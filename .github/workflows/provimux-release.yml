# Provimux release (PMX-09, PMX-10, PMX-13): a tag v<base>-pmx.<n> builds the same
# 10 archives as CLIProxyAPI's release.yaml, under Provimux names, and the
# linux/amd64 and linux/arm64 images; publishes the GitHub release; then pushes the
# images to ghcr.io/<owner>/provimux and updates Formula/provimux.rb in
# ngvoicu/homebrew-tap. A manual run (workflow_dispatch) is a dry run: it builds
# everything, rehearses the image push against a registry on the runner and the
# formula update against the run's own files, and publishes nothing.
#
# Order and trust:
#   meta, catalogs, build-*, image, prepare  read-only token, checkout without a
#       stored credential; these are the only jobs that run repository code.
#   provenance (a tag push): the tag's commit carries the owner's authorization for
#       exactly this tag (commit status provimux-release/<tag>); nothing publishes
#       without it.
#   publish-release, release-latest (contents: write), image-push and image-latest
#       (packages: write)  no checkout, no repository script: fixed inline steps on
#       the files the read-only jobs prepared. image-dryrun (the dry run's push
#       rehearsal and smoke test) is read-only.
#   No job has a secret beyond GITHUB_TOKEN or an environment. The Homebrew tap is
#       updated by provimux-publish (main only) from the formula that tap-check
#       verified here; report tells a failed run in the issue "sync: v<base>".
#   publish-release runs only when every archive and both images have built; the
#   image tags and the formula move only after the release is public, not a
#   prerelease, with all its assets; each promotion job checks that again first.
#   (One workflow: a release created with GITHUB_TOKEN starts no other.)
#
# The model catalogs (router-for-me/models) are fetched once, at one commit,
# validated, and handed to every build as an artifact; the release notes name the
# commit. The image pushed is the OCI export of the build that was tested.
#
# The build jobs are copied from upstream's .github/workflows/release.yaml (left
# unchanged and disabled in this repo). Differences: binary provimux, archive names
# provimux_<base>-pmx.<n>_*, the extra ProvimuxVersion ldflag, the Go version read
# from release.yaml at run time, the catalogs from the catalogs job, a banner check
# on native runners. The image follows upstream's docker-image.yml with
# .github/provimux/Dockerfile: VERSION = the base tag WITH "v" (upstream passes the
# tag name), plus PROVIMUX_VERSION.
#
# main.Version stays exactly what stock CLIProxyAPI sets for its archives (the base
# version without "v"): providers see it in user agents.
name: provimux-release

on:
  push:
    tags:
      - 'v*-pmx.*'
  workflow_dispatch:
    inputs:
      provimux_version:
        description: 'Provimux version for the dry run (e.g. 8.0.77-pmx.0-dryrun); empty = <base>-pmx.0-dryrun'
        required: false
        default: ''
      models_commit:
        description: 'router-for-me/models commit for the catalogs (40 hex); empty = its main when the run starts'
        required: false
        default: ''

permissions:
  contents: read

# One run per tag at a time; a second push of the same tag waits.
concurrency:
  group: provimux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.meta.outputs.base }}
      provimux_version: ${{ steps.meta.outputs.provimux_version }}
      go_version: ${{ steps.meta.outputs.go_version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_date: ${{ steps.meta.outputs.build_date }}
      ldflags: ${{ steps.meta.outputs.ldflags }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Versions and build metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.provimux_version }}
        run: bash .github/provimux/release-meta.sh

  # The model catalogs every build embeds: fetched once, at one commit, validated.
  catalogs:
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      models_commit: ${{ steps.fetch.outputs.commit }}
      catalogs_sha256: ${{ steps.validate.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.meta.outputs.go_version }}
          cache: true
      - name: Fetch the catalogs at one commit
        id: fetch
        env:
          MODELS_REPOSITORY: https://github.com/router-for-me/models.git
          INPUT_COMMIT: ${{ inputs.models_commit }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_COMMIT:-}" ]]; then
            commit="$INPUT_COMMIT"
          else
            commit="$(git ls-remote "$MODELS_REPOSITORY" refs/heads/main | cut -f1)"
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Not a full commit id: '$commit'"; exit 1; }
          src="$RUNNER_TEMP/models-src"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 "$MODELS_REPOSITORY" "$commit"
          [[ "$(git -C "$src" rev-parse FETCH_HEAD)" == "$commit" ]]
          out="$RUNNER_TEMP/catalogs"
          mkdir -p "$out"
          git -C "$src" show "$commit:models.json" > "$out/models.json"
          git -C "$src" show "$commit:codex_client_models.json" > "$out/codex_client_models.json"
          echo "$commit" > "$out/MODELS_COMMIT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Validate the catalogs
        id: validate
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/catalogs"
          fail() { echo "::error::$*"; exit 1; }
          m="$out/models.json"
          # models.json: an object of model lists; the sections validateModelsCatalog
          # reads must be lists; every model has a non-empty id, unique in its list.
          jq -e 'type == "object"' "$m" >/dev/null || fail "models.json is not a JSON object."
          for s in claude gemini vertex aistudio codex-free codex-team codex-plus codex-pro kimi antigravity xai meta; do
            jq -e --arg s "$s" '.[$s] | type == "array"' "$m" >/dev/null || fail "models.json: section $s is missing or not a list."
            [[ "$(jq --arg s "$s" '.[$s] | length' "$m")" -gt 0 ]] || echo "::warning::models.json: section $s is empty."
          done
          jq -e 'all(.[]; type == "array"
                   and all(.[]; type == "object" and (.id | type == "string" and test("\\S")))
                   and ((map(.id | gsub("^\\s+|\\s+$"; "")) | unique | length) == length))' "$m" >/dev/null ||
            fail "models.json: a section is not a list of models with unique non-empty ids."
          total="$(jq '[.[] | length] | add' "$m")"
          [[ "$total" -gt 0 ]] || fail "models.json lists no model."
          c="$out/codex_client_models.json"
          jq -e 'type == "object" and (.models | type == "array" and length > 0)' "$c" >/dev/null ||
            fail "codex_client_models.json has no models list."
          go run ./cmd/validate_codex_models --file "$c"
          # The Go validators, on the catalogs embedded as a build would embed them.
          cp "$m" "$c" internal/registry/models/
          go test -count=1 -run '^(TestCatalogFetcherSources|TestEmbeddedCodexClientModelsCatalogIsValid)$' ./internal/registry/
          (cd "$out" && sha256sum codex_client_models.json models.json > SHA256SUMS && cat SHA256SUMS)
          sha="$(sha256sum "$out/SHA256SUMS" | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Model catalogs"
            echo
            echo "- router-for-me/models@\`$(cat "$out/MODELS_COMMIT")\`"
            echo "- models.json: $total models in $(jq 'length' "$m") sections; codex_client_models.json: $(jq '.models | length' "$c") models"
            echo "- SHA256SUMS: \`$sha\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: model-catalogs
          path: |
            ${{ runner.temp }}/catalogs/models.json
            ${{ runner.temp }}/catalogs/codex_client_models.json
            ${{ runner.temp }}/catalogs/SHA256SUMS
            ${{ runner.temp }}/catalogs/MODELS_COMMIT
          if-no-files-found: error

  build-hosted:
    name: build ${{ matrix.target }}
    needs: [meta, catalogs]
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.base }}
      PROVIMUX_VERSION: ${{ needs.meta.outputs.provimux_version }}
      LDFLAGS: ${{ needs.meta.outputs.ldflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: tar.gz
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: aarch64
            archive_format: tar.gz
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - target: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.meta.outputs.go_version }}
          cache: true
      - &catalogs-download
        name: Download the model catalogs
        uses: actions/download-artifact@v4
        with:
          name: model-catalogs
          path: internal/registry/models
      - &catalogs-check
        name: Check the model catalogs
        shell: bash
        env:
          MODELS_COMMIT: ${{ needs.catalogs.outputs.models_commit }}
          CATALOGS_SHA256: ${{ needs.catalogs.outputs.catalogs_sha256 }}
        run: |
          set -euo pipefail
          cd internal/registry/models
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          got="$(sum SHA256SUMS | cut -d' ' -f1)"
          [[ "$got" == "$CATALOGS_SHA256" && "$(cat MODELS_COMMIT)" == "$MODELS_COMMIT" ]] || {
            echo "::error::Catalogs are not the ones the catalogs job validated (SHA256SUMS $got, commit $(cat MODELS_COMMIT))"; exit 1; }
          sum -c SHA256SUMS
          rm SHA256SUMS MODELS_COMMIT
          echo "Model catalogs: router-for-me/models@${MODELS_COMMIT}, SHA256SUMS ${got}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
        run: |
          set -euo pipefail
          binary_name="provimux"
          if [[ "$GOOS" == "windows" ]]; then
            binary_name="provimux.exe"
          fi

          archive_dir="dist/${TARGET}/archive"
          archive_name="provimux_${PROVIMUX_VERSION}_${GOOS}_${ASSET_ARCH}.${ARCHIVE_FORMAT}"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -ldflags="${LDFLAGS}" \
            -o "$archive_dir/$binary_name" ./cmd/server/

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          cp .github/README.md "$archive_dir/README_PROVIMUX.md"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${archive_dir}/*' -DestinationPath 'dist/${archive_name}' -Force"
          else
            tar -C "$archive_dir" -czf "dist/$archive_name" "$binary_name" LICENSE README.md README_CN.md README_PROVIMUX.md config.example.yaml
          fi
          echo "BINARY=$PWD/$archive_dir/$binary_name" >> "$GITHUB_ENV"
      - name: Check banner
        shell: bash
        run: bash .github/provimux/check-banner.sh "$BINARY" "$PROVIMUX_VERSION" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/provimux_*
          if-no-files-found: error

  build-linux-glibc:
    name: build linux-${{ matrix.goarch }} glibc
    needs: [meta, catalogs]
    runs-on: ${{ matrix.runner }}
    env:
      GO_VERSION: ${{ needs.meta.outputs.go_version }}
      RELEASE_VERSION: ${{ needs.meta.outputs.base }}
      PROVIMUX_VERSION: ${{ needs.meta.outputs.provimux_version }}
      LDFLAGS: ${{ needs.meta.outputs.ldflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: aarch64
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.meta.outputs.go_version }}
          cache: true
      - *catalogs-download
      - *catalogs-check
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="provimux_${PROVIMUX_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GO_VERSION \
            -e GOARCH \
            -e LDFLAGS \
            "$MANYLINUX_IMAGE" \
            bash -euo pipefail -c '
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"

              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="${LDFLAGS}" \
                -o "'"$archive_dir"'/provimux" ./cmd/server/

              glibc_versions="$(readelf --version-info "'"$archive_dir"'/provimux" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -n "${glibc_versions}" ]]; then
                printf "GLIBC versions:\n%s\n" "${glibc_versions}"
                max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                  printf "linux ${GOARCH} binary requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${max_glibc}" >&2
                  exit 1
                fi
              fi
            '

          sudo chown -R "$(id -u):$(id -g)" dist
          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          cp .github/README.md "$archive_dir/README_PROVIMUX.md"
          tar -C "$archive_dir" -czf "dist/$archive_name" provimux LICENSE README.md README_CN.md README_PROVIMUX.md config.example.yaml
          echo "BINARY=$PWD/$archive_dir/provimux" >> "$GITHUB_ENV"
      - name: Check banner
        shell: bash
        run: bash .github/provimux/check-banner.sh "$BINARY" "$PROVIMUX_VERSION" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/provimux_*
          if-no-files-found: error

  build-linux-no-plugin:
    name: build linux-${{ matrix.goarch }} no-plugin
    needs: [meta, catalogs]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.base }}
      PROVIMUX_VERSION: ${{ needs.meta.outputs.provimux_version }}
      LDFLAGS: ${{ needs.meta.outputs.ldflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-no-plugin
            goarch: amd64
            asset_arch: amd64
            native: true
          - target: linux-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
            native: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.meta.outputs.go_version }}
          cache: true
      - *catalogs-download
      - *catalogs-check
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-no-plugin-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-linux-no-plugin-${{ matrix.goarch }}-
            go-linux-no-plugin-
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="provimux_${PROVIMUX_VERSION}_linux_${ASSET_ARCH}_no-plugin.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -buildvcs=false \
            -ldflags="${LDFLAGS}" \
            -o "$archive_dir/provimux" ./cmd/server/

          if readelf -l "$archive_dir/provimux" | grep -q 'Requesting program interpreter'; then
            readelf -l "$archive_dir/provimux" >&2
            echo "no-plugin linux binary must not require a dynamic interpreter" >&2
            exit 1
          fi

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          cp .github/README.md "$archive_dir/README_PROVIMUX.md"
          tar -C "$archive_dir" -czf "dist/$archive_name" provimux LICENSE README.md README_CN.md README_PROVIMUX.md config.example.yaml
          echo "BINARY=$PWD/$archive_dir/provimux" >> "$GITHUB_ENV"
      - name: Check banner
        if: ${{ matrix.native }}
        shell: bash
        run: bash .github/provimux/check-banner.sh "$BINARY" "$PROVIMUX_VERSION" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/provimux_*
          if-no-files-found: error

  build-freebsd:
    name: build ${{ matrix.target }}
    needs: [meta, catalogs]
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ matrix.target }}
      TARGET_GOARCH: ${{ matrix.goarch }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
      ASSET_SUFFIX: ${{ matrix.asset_suffix }}
      RELEASE_VERSION: ${{ needs.meta.outputs.base }}
      PROVIMUX_VERSION: ${{ needs.meta.outputs.provimux_version }}
      LDFLAGS: ${{ needs.meta.outputs.ldflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: freebsd-amd64
            goarch: amd64
            asset_arch: amd64
            asset_suffix: ''
            cgo_enabled: true
          - target: freebsd-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
            asset_suffix: _no-plugin
            cgo_enabled: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.meta.outputs.go_version }}
          cache: true
      - *catalogs-download
      - *catalogs-check
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-freebsd-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-freebsd-${{ matrix.goarch }}-
            go-freebsd-
      - name: Prepare FreeBSD output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "dist/${TARGET}"
      - name: Install FreeBSD cross-build dependencies
        if: ${{ matrix.cgo_enabled }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld curl
      - name: Build FreeBSD binary with CGO
        if: ${{ matrix.cgo_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${TARGET}/bin"
          sysroot_dir="/tmp/freebsd-sysroot"
          rm -rf "$sysroot_dir"
          mkdir -p "$sysroot_dir"
          trap 'sudo rm -rf "$sysroot_dir" /tmp/base.txz' EXIT

          case "$TARGET_GOARCH" in
            amd64)
              freebsd_arch="amd64"
              clang_target="x86_64-unknown-freebsd14"
              ;;
            arm64)
              freebsd_arch="arm64"
              clang_target="aarch64-unknown-freebsd14"
              ;;
            *)
              echo "Unsupported FreeBSD architecture: $TARGET_GOARCH" >&2
              exit 1
              ;;
          esac

          urls=(
            "https://download.freebsd.org/releases/${freebsd_arch}/14.4-RELEASE/base.txz"
            "https://archive.freebsd.org/old-releases/${freebsd_arch}/14.4-RELEASE/base.txz"
            "https://archive.freebsd.org/old-releases/${freebsd_arch}/14.3-RELEASE/base.txz"
          )

          downloaded=false
          for url in "${urls[@]}"; do
            echo "Attempting to download FreeBSD base.txz from ${url}..."
            if curl -fsSL --retry 3 --retry-connrefused "$url" -o /tmp/base.txz; then
              echo "Successfully downloaded FreeBSD base.txz from ${url}"
              downloaded=true
              break
            else
              echo "Download failed from ${url}, trying next candidate..."
            fi
          done

          if [[ "$downloaded" != "true" ]]; then
            echo "Error: Failed to download FreeBSD base.txz from all candidate mirrors" >&2
            exit 1
          fi

          echo "Extracting FreeBSD sysroot to ${sysroot_dir}..."
          sudo tar -xf /tmp/base.txz -C "$sysroot_dir"
          rm -f /tmp/base.txz

          echo "Building FreeBSD ${TARGET} binary with CGO..."
          CGO_ENABLED=1 \
          GOOS=freebsd \
          GOARCH="$TARGET_GOARCH" \
          CGO_LDFLAGS="-fuse-ld=lld" \
          CC="clang --target=${clang_target} --sysroot=${sysroot_dir}" \
          go build -buildvcs=false \
            -ldflags="${LDFLAGS}" \
            -o "dist/${TARGET}/bin/provimux" ./cmd/server/
      - name: Build FreeBSD no-plugin binary
        if: ${{ !matrix.cgo_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${TARGET}/bin"
          CGO_ENABLED=0 GOOS=freebsd GOARCH="$TARGET_GOARCH" go build -buildvcs=false \
            -ldflags="${LDFLAGS}" \
            -o "dist/${TARGET}/bin/provimux" ./cmd/server/
      - name: Package FreeBSD archive
        shell: bash
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="provimux_${PROVIMUX_VERSION}_freebsd_${ASSET_ARCH}${ASSET_SUFFIX}.tar.gz"
          mkdir -p "$archive_dir"

          echo "Packaging ${archive_name}"
          cp "dist/${TARGET}/bin/provimux" "$archive_dir/provimux"
          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          cp .github/README.md "$archive_dir/README_PROVIMUX.md"
          tar -C "$archive_dir" -czf "dist/$archive_name" provimux LICENSE README.md README_CN.md README_PROVIMUX.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/provimux_*
          if-no-files-found: error


  # One image per architecture, exported as an OCI layout (pushed later, unchanged)
  # and loaded into Docker for the checks; the checks confirm the two are the same.
  image:
    name: image linux/${{ matrix.arch }}
    needs: [meta, catalogs]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # main.Version in the image: the base tag with "v", as upstream's image.
      VERSION: v${{ needs.meta.outputs.base }}
      PROVIMUX_VERSION: ${{ needs.meta.outputs.provimux_version }}
      COMMIT: ${{ needs.meta.outputs.commit }}
      BUILD_DATE: ${{ needs.meta.outputs.build_date }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - *catalogs-download
      - *catalogs-check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/provimux/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            PROVIMUX_VERSION=${{ env.PROVIMUX_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.PROVIMUX_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          outputs: |
            type=oci,dest=${{ runner.temp }}/oci-${{ matrix.arch }}.tar
            type=docker,name=provimux:check
          cache-from: type=gha,scope=provimux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=provimux-${{ matrix.arch }}
      - name: Check banner and image layout
        run: |
          set -euo pipefail
          expected="Provimux Version: ${PROVIMUX_VERSION} (based on CLIProxyAPI ${VERSION}) by providers.dev"
          for cmd in ./provimux ./CLIProxyAPI; do
            out="$(docker run --rm provimux:check "$cmd" --help 2>&1 || true)"
            banner="$(printf '%s\n' "$out" | grep -m1 '^Provimux Version:' || true)"
            echo "$cmd: $banner"
            [[ "$banner" == "$expected"* ]] || { printf '%s\n' "$out" | head -n 20; echo "::error::Expected: $expected"; exit 1; }
          done
          docker image inspect provimux:check --format 'arch={{.Architecture}} workdir={{.Config.WorkingDir}} cmd={{json .Config.Cmd}} ports={{json .Config.ExposedPorts}}' | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$(docker image inspect provimux:check --format '{{.Config.WorkingDir}}')" == "/CLIProxyAPI" ]]
          [[ "$(docker image inspect provimux:check --format '{{.Architecture}}')" == "$ARCH" ]]
      - name: Check the OCI export is the image checked
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          dir="$RUNNER_TEMP/oci"
          mkdir -p "$dir"
          tar -xf "$RUNNER_TEMP/oci-${ARCH}.tar" -C "$dir"
          blob() { echo "$dir/blobs/${1%%:*}/${1#*:}"; }
          for f in "$dir"/blobs/sha256/*; do
            [[ "$(sha256sum < "$f" | cut -d' ' -f1)" == "$(basename "$f")" ]] || fail "Blob $f does not match its digest."
          done
          [[ "$(jq '.manifests | length' "$dir/index.json")" == 1 ]] || fail "The OCI export holds more than one manifest."
          desc="$(jq -c '.manifests[0] | {mediaType, digest, size}' "$dir/index.json")"
          [[ "$(jq -r .mediaType <<<"$desc")" == application/vnd.oci.image.manifest.v1+json ]] || fail "Unexpected manifest type: $desc"
          manifest="$(blob "$(jq -r .digest <<<"$desc")")"
          config="$(blob "$(jq -r .config.digest "$manifest")")"
          # Same layers (diff ids), platform and complete runtime config (Entrypoint, User,
          # Env, Cmd, WorkingDir, Labels, ports, volumes, stop signal, healthcheck, ...)
          # as the image the banner check ran. Docker's inspect lists unset fields as
          # null, "" or false where the OCI config leaves them out, so those are dropped
          # on both sides; every field that is set must be present and equal on both.
          docker image inspect provimux:check > "$RUNNER_TEMP/inspect.json"
          jq -e --slurpfile oci "$config" '
            def set: with_entries(select(.value != null and .value != "" and .value != false and .value != [] and .value != {}));
            .[0] as $d | $oci[0] as $o
            | ($o.rootfs.diff_ids == $d.RootFS.Layers)
              and ($o.architecture == $d.Architecture) and ($o.os == $d.Os) and (($o.variant // "") == ($d.Variant // ""))
              and (($o.config // {} | set) == ($d.Config // {} | del(.Hostname, .Domainname, .Image) | set))' \
            "$RUNNER_TEMP/inspect.json" >/dev/null || {
            echo "OCI export:"; jq -S '{architecture, os, variant, rootfs, config}' "$config"
            echo "Image checked:"; jq -S '.[0] | {Architecture, Os, Variant, RootFS, Config}' "$RUNNER_TEMP/inspect.json"
            fail "The OCI export's layers, platform or config differ from the image checked."
          }
          platform="$(jq -c '{architecture, os} + (if .variant then {variant} else {} end)' "$config")"
          [[ "$(jq -r .architecture <<<"$platform")" == "$ARCH" ]] || fail "OCI export is $platform, not $ARCH."
          jq -c --argjson p "$platform" '. + {platform: $p}' <<<"$desc" > "$RUNNER_TEMP/ocidesc-${ARCH}.json"
          echo "linux/${ARCH}: manifest $(jq -r .digest <<<"$desc"), config $(jq -r .config.digest "$manifest"), loaded image $(docker image inspect provimux:check --format '{{.Id}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: oci-${{ matrix.arch }}
          path: ${{ runner.temp }}/oci-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ocidesc-${{ matrix.arch }}
          path: ${{ runner.temp }}/ocidesc-${{ matrix.arch }}.json
          if-no-files-found: error

  # Everything the publish jobs need, prepared without write access: the archives,
  # checksums.txt, the release notes and the image index.
  prepare:
    runs-on: ubuntu-latest
    needs:
      - meta
      - catalogs
      - build-hosted
      - build-linux-glibc
      - build-linux-no-plugin
      - build-freebsd
      - image
    env:
      GH_REPO: ${{ github.repository }}
      BASE: ${{ needs.meta.outputs.base }}
      PROVIMUX_VERSION: ${{ needs.meta.outputs.provimux_version }}
      MODELS_COMMIT: ${{ needs.catalogs.outputs.models_commit }}
      CATALOGS_SHA256: ${{ needs.catalogs.outputs.catalogs_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: archive-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: ocidesc
          pattern: ocidesc-*
          merge-multiple: true
      - name: Check archives and write checksums
        run: |
          set -euo pipefail
          cd dist
          p="provimux_${PROVIMUX_VERSION}"
          expected=(
            "${p}_darwin_aarch64.tar.gz"
            "${p}_darwin_amd64.tar.gz"
            "${p}_freebsd_aarch64_no-plugin.tar.gz"
            "${p}_freebsd_amd64.tar.gz"
            "${p}_linux_aarch64.tar.gz"
            "${p}_linux_aarch64_no-plugin.tar.gz"
            "${p}_linux_amd64.tar.gz"
            "${p}_linux_amd64_no-plugin.tar.gz"
            "${p}_windows_aarch64.zip"
            "${p}_windows_amd64.zip"
          )
          missing=0
          for f in "${expected[@]}"; do
            [[ -f "$f" ]] || { echo "::error::Missing archive $f"; missing=1; }
          done
          shopt -s nullglob
          archives=(provimux_*.tar.gz provimux_*.zip)
          [[ ${#archives[@]} -eq ${#expected[@]} ]] || { echo "::error::Expected ${#expected[@]} archives, found ${#archives[@]}: ${archives[*]}"; missing=1; }
          [[ $missing -eq 0 ]] || exit 1
          sha256sum "${archives[@]}" | sort -k2 > checksums.txt
          cat checksums.txt
      - name: Write the image index
        run: |
          set -euo pipefail
          mkdir -p image-index
          [[ -f ocidesc/ocidesc-amd64.json && -f ocidesc/ocidesc-arm64.json ]] || { echo "::error::Missing image descriptors"; exit 1; }
          jq -cn \
            --arg v "$PROVIMUX_VERSION" \
            --arg src "https://github.com/${GH_REPO}" \
            --arg rev "$GITHUB_SHA" \
            --slurpfile amd ocidesc/ocidesc-amd64.json \
            --slurpfile arm ocidesc/ocidesc-arm64.json \
            '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json",
              manifests: ($amd + $arm),
              annotations: {"org.opencontainers.image.version": $v, "org.opencontainers.image.source": $src,
                            "org.opencontainers.image.revision": $rev, "org.opencontainers.image.licenses": "MIT"}}' \
            > image-index/index.json
          jq . image-index/index.json
          echo "sha256:$(sha256sum image-index/index.json | cut -d' ' -f1)" > image-index/digest
          echo "Image index: $(cat image-index/digest)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Write release notes
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            ref="$GITHUB_REF_NAME"
          else
            ref="HEAD"
          fi
          # Since the previous Provimux release on the same base, when it is reachable
          # from here; otherwise (first release on this base, or the stack was rebased)
          # everything since the CLIProxyAPI base.
          if previous="$(git describe --tags --abbrev=0 --match "v${BASE}-pmx.*" "${ref}^" 2>/dev/null)"; then
            range="${previous}..${ref}"
            since="since ${previous}"
          else
            range="v${BASE}..${ref}"
            since="on CLIProxyAPI ${BASE}"
          fi
          # Layer commits carry the trailer "Provimux-Layer: branding" (guard.sh); the
          # owner's patches below the layer do not.
          patches=() layer=()
          for c in $(git rev-list --reverse --topo-order "$range"); do
            line="$(git log -1 --format='- %s (%h)' "$c")"
            if git log -1 --format='%(trailers:key=Provimux-Layer,valueonly)' "$c" | sed 's/[[:space:]]*$//' | grep -qx 'branding'; then
              layer+=("$line")
            else
              patches+=("$line")
            fi
          done
          list() { if [[ $# -gt 0 ]]; then printf '%s\n' "$@"; else echo "- (none)"; fi; }
          readme="https://github.com/${GH_REPO}/blob/${ref/HEAD/$GITHUB_SHA}/.github/README.md"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "Provimux ${PROVIMUX_VERSION} by [providers.dev](https://providers.dev), built on CLIProxyAPI ${BASE}."
            echo
            echo "- CLIProxyAPI ${BASE}: https://github.com/router-for-me/CLIProxyAPI/releases/tag/v${BASE}"
            echo "- What Provimux adds: ${readme}"
            echo "- Model catalogs: router-for-me/models at [\`${MODELS_COMMIT:0:12}\`](https://github.com/router-for-me/models/tree/${MODELS_COMMIT}) (SHA256SUMS \`${CATALOGS_SHA256}\`)"
            echo "- Docker image: \`ghcr.io/${owner}/provimux:${PROVIMUX_VERSION}\` (index \`$(cat image-index/digest)\`)"
            echo
            echo "## Owner patches ${since}"
            echo
            list "${patches[@]}"
            echo
            echo "## Provimux layer ${since}"
            echo
            list "${layer[@]}"
          } > dist/release-notes.md
          cat dist/release-notes.md
          cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/provimux_*
            dist/checksums.txt
            dist/release-notes.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: image-index
          path: image-index/
          if-no-files-found: error

  # Release provenance (SYNC.md, "Release provenance"). Only an admin can create, move or
  # delete a v* tag (tag ruleset 27670572), and nothing is released for a tag unless
  # its commit carries the durable authorization for exactly that tag: the commit status
  # "provimux-release/<tag>" with state success, created by the repository owner (the
  # publish job sets it with PROVIMUX_TOKEN, publish.sh by hand with the owner's gh;
  # GITHUB_TOKEN would create it as github-actions[bot], which does not count). It stays
  # on the commit, so a rerun of the release at any later time finds it. Every job that
  # publishes (publish-release and all after it) needs this one.
  provenance:
    needs: meta
    if: ${{ needs.meta.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      TAG: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - name: The owner authorized exactly this tag at this commit
        run: |
          # >>> provenance
          set -euo pipefail
          fail() { echo "::error title=provimux-release refused::$*"; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/$TAG" && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-pmx\.[0-9]+$ && "$SHA" =~ ^[0-9a-f]{40}$ ]] ||
            fail "$GITHUB_REF at $SHA is not a v<base>-pmx.<n> tag push"
          # The tag on the remote is still this commit.
          now="$(git ls-remote "https://github.com/$GH_REPO.git" "refs/tags/$TAG" "refs/tags/$TAG^{}" |
            awk -v t="refs/tags/$TAG" '$2 == t "^{}" {p = $1} $2 == t {l = $1} END {print (p != "" ? p : l)}')" || now=''
          [[ "$now" == "$SHA" ]] || fail "refs/tags/$TAG is now '$now', not this run's $SHA"
          # provimux-publish sets the status right after its push (a commit status needs the
          # commit on GitHub), so a missing one is waited for, up to 10 minutes. A read
          # error is not "no authorization": it stops with its own message.
          st="$(mktemp)"
          for _ in $(seq 1 30); do
            gh api --paginate "repos/$GH_REPO/commits/$SHA/statuses?per_page=100" >"$st" ||
              fail "cannot read the commit statuses of $SHA; rerun when GitHub answers"
            ok="$(jq -rs --arg ctx "provimux-release/$TAG" --arg owner "$OWNER" \
              '[.[][] | select(.context == $ctx)] | sort_by(.id) | last
               | if . == null then "none"
                 elif .state == "success" and .creator.login == $owner and .creator.type == "User" then "ok"
                 else "\(.state) by \(.creator.login) (\(.creator.type))" end' "$st")"
            [[ "$ok" == none && -z "${PMX_NO_WAIT:-}" ]] || break
            sleep 20
          done
          case "$ok" in
            ok) echo "The owner authorized $TAG at $SHA (commit status provimux-release/$TAG)." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            none) fail "$SHA has no commit status provimux-release/$TAG: nothing is released. provimux-publish sets it before its push; for a tag pushed by hand the owner sets it (SYNC.md, \"Release provenance\"), then reruns this run." ;;
            *) fail "the newest commit status provimux-release/$TAG on $SHA is $ok, not success by the owner $OWNER: nothing is released" ;;
          esac
          # <<< provenance

  # Publish the GitHub release. Assets of a published release are never replaced: a
  # rerun checks that they match this run's files and stops otherwise. A draft left
  # by a failed run is resumed by uploading only the missing assets; every asset's
  # digest is checked before the release is published.
  publish-release:
    needs: [meta, prepare, provenance]
    if: ${{ needs.meta.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # The release this run published and verified: release-latest promotes only it.
      release_id: ${{ steps.publish.outputs.release_id }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish release
        id: publish
        working-directory: dist
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          declare -A want
          while read -r h f; do want[$f]=$h; done < checksums.txt
          want[checksums.txt]="$(sha256sum checksums.txt | cut -d' ' -f1)"
          [[ ${#want[@]} -eq 11 ]] || fail "Expected 10 archives and checksums.txt, have ${#want[@]} files."
          for f in "${!want[@]}"; do
            [[ "$(sha256sum "$f" | cut -d' ' -f1)" == "${want[$f]}" ]] || fail "$f does not match checksums.txt."
          done
          # The release(s) with this tag, drafts included (the tag endpoint skips drafts).
          release() {
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.TAG) | {id, draft, prerelease, assets: [.assets[] | {id, name, state, digest}]}' | jq -s .
          }
          # Check every asset present: expected name, fully uploaded, this run's digest.
          # Prints the expected names still missing.
          check() {
            local r=$1 bad=0 id name state digest got
            while IFS=$'\t' read -r id name state digest; do
              if [[ -z "${want[$name]:-}" ]]; then echo "::error::Unexpected asset $name" >&2; bad=1; continue; fi
              [[ "$state" == uploaded ]] || { echo "::error::Asset $name is $state" >&2; bad=1; continue; }
              if [[ -z "$digest" || "$digest" == null ]]; then
                got="sha256:$(gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$id" | sha256sum | cut -d' ' -f1)"
              else
                got="$digest"
              fi
              [[ "$got" == "sha256:${want[$name]}" ]] || { echo "::error::Asset $name is $got, this run built sha256:${want[$name]}" >&2; bad=1; }
            done < <(jq -r '.[0].assets[] | [.id, .name, .state, (.digest // "")] | @tsv' <<<"$r")
            [[ $bad -eq 0 ]] || return 1
            for f in "${!want[@]}"; do
              jq -e --arg f "$f" '.[0].assets | any(.name == $f)' <<<"$r" >/dev/null || echo "$f"
            done
          }
          r="$(release)"
          case "$(jq length <<<"$r")" in
            0)
              gh release create "$TAG" --draft --prerelease=false --latest=false --verify-tag --title "$TAG" --notes-file release-notes.md "${!want[@]}"
              r="$(release)"
              ;;
            1) ;;
            *) fail "Several releases have tag $TAG; delete the extra drafts and rerun." ;;
          esac
          # A Provimux release is never a prerelease: a release or draft with this tag
          # marked as one was not made by this workflow, and nothing is promoted from it.
          [[ "$(jq '.[0].prerelease' <<<"$r")" == false ]] || fail "Release $TAG is marked as a prerelease; it is left as it is and nothing is promoted."
          missing="$(check "$r")" || fail "Release $TAG has assets that are not this run's; it is left as it is."
          if [[ "$(jq '.[0].draft' <<<"$r")" == false ]]; then
            [[ -z "$missing" ]] || fail "Published release $TAG lacks: $missing. Assets of a published release are not changed here."
            echo "Release $TAG is already published with this run's assets; nothing to do."
          else
            if [[ -n "$missing" ]]; then
              echo "Resuming draft $TAG; uploading: $missing"
              mapfile -t files <<<"$missing"
              gh release upload "$TAG" "${files[@]}"
              r="$(release)"
              missing="$(check "$r")" || fail "Draft $TAG has assets that are not this run's."
              [[ -z "$missing" ]] || fail "Draft $TAG still lacks: $missing"
            fi
            # Not "latest" here: the job release-latest moves it, serialized, only forward.
            gh release edit "$TAG" --draft=false --latest=false
          fi
          # The public release, as anyone sees it.
          pub="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '{id, draft, prerelease, assets: [.assets[] | {id, name, state, digest}]}' | jq -s .)"
          [[ "$(jq '.[0].draft' <<<"$pub")" == false ]] || fail "Release $TAG is still a draft."
          [[ "$(jq '.[0].prerelease' <<<"$pub")" == false ]] || fail "Release $TAG is a prerelease."
          missing="$(check "$pub")" || fail "Published release $TAG does not match this run."
          [[ -z "$missing" ]] || fail "Published release $TAG lacks: $missing"
          # Immutable releases are on for the repository: a published release's assets and
          # tag can no longer change. Nothing is promoted from a release that is not.
          [[ "$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.immutable')" == true ]] ||
            fail "Release $TAG is published but not immutable (Settings → General → Releases → immutable releases); nothing is promoted."
          echo "release_id=$(jq -r '.[0].id' <<<"$pub")" >>"$GITHUB_OUTPUT"
          echo "Release $TAG is public and immutable with ${#want[@]} assets, all matching." | tee -a "$GITHUB_STEP_SUMMARY"

  # Formula/provimux.rb for ngvoicu/homebrew-tap, written without write access from
  # the assets the formula installs, downloaded from the public release (on a dry
  # run, from this run's own files) and checked against checksums.txt.
  formula:
    needs: [meta, prepare, publish-release]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.meta.outputs.publish != 'true' || needs.publish-release.result == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      PROVIMUX_VERSION: ${{ needs.meta.outputs.provimux_version }}
      BASE_URL: ${{ needs.meta.outputs.publish == 'true' && format('https://github.com/{0}/releases/download/{1}', github.repository, github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Fetch the tap
        run: git clone --depth 1 https://github.com/ngvoicu/homebrew-tap.git tap
      - name: Download and check the archives the formula installs
        run: |
          set -euo pipefail
          formula=tap/Formula/provimux.rb
          if [[ -n "${BASE_URL:-}" ]]; then
            src="$BASE_URL"
          else
            src="file://$PWD/release"
            echo "Dry run: no public release; checking this run's own files."
          fi
          dl="$RUNNER_TEMP/download"
          rm -rf "$dl"
          mkdir -p "$dl"
          get() { curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$dl/$1" "$src/$1"; }
          get checksums.txt
          cmp -s "$dl/checksums.txt" release/checksums.txt || {
            diff release/checksums.txt "$dl/checksums.txt" || true
            echo "::error::checksums.txt at $src is not the one this run built."
            exit 1
          }
          suffixes=()
          while IFS= read -r s; do suffixes+=("$s"); done < <(sed -n 's|^ *url "https://github\.com/ngvoicu/provimux/releases/download/[^"]*/provimux_[^_"]*_\([^"]*\)"$|\1|p' "$formula")
          [[ ${#suffixes[@]} -gt 0 ]] || { echo "::error::No release archive URL in $formula."; exit 1; }
          bad=0
          for s in "${suffixes[@]}"; do
            f="provimux_${PROVIMUX_VERSION}_${s}"
            want="$(awk -v f="$f" '$2 == f { print $1 }' "$dl/checksums.txt")"
            [[ -n "$want" ]] || { echo "::error::$f is not in checksums.txt."; bad=1; continue; }
            get "$f"
            got="$(sha256sum "$dl/$f" | cut -d' ' -f1)"
            if [[ "$got" == "$want" ]]; then
              echo "OK $f $got"
            else
              echo "::error::$f from $src is $got; checksums.txt says $want."
              bad=1
            fi
          done
          [[ $bad -eq 0 ]] || exit 1
          mkdir -p formula
          cp "$formula" formula/base.rb
          bash .github/provimux/update-formula.sh "$PROVIMUX_VERSION" "$dl/checksums.txt" "$formula"
          cp "$formula" formula/provimux.rb
          diff -u formula/base.rb formula/provimux.rb | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: formula
          path: formula/
          if-no-files-found: error

  # Promotion happens only from a published release that is not a prerelease, as
  # anyone sees it (the tag endpoint does not return drafts). Checked again in every
  # promotion job, right before it promotes.
  #
  # The Homebrew tap is NOT updated here: no job of this workflow has a token beyond
  # GITHUB_TOKEN or an environment (a tag run uses the tag's own workflow file). This
  # job checks the prepared formula against the tap, as a dry run, and binds the formula
  # artifact to itself (one annotation "provimux-formula-artifact: <id> formula
  # sha256:<digest>"). provimux-publish (main only) updates the tap from exactly that
  # artifact after this run succeeded (tap.sh artifact, tap.sh prepare); by hand,
  # publish.sh --tap. The tap only moves forward, and only in its version, url and
  # sha256 lines (tap.sh verify).
  tap-check:
    needs: [meta, formula]
    if: ${{ !cancelled() && needs.formula.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      PROVIMUX_VERSION: ${{ needs.meta.outputs.provimux_version }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
    steps:
      - &release-public
        name: Check the release is public and not a prerelease
        if: ${{ needs.meta.outputs.publish == 'true' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '"draft=\(.draft) prerelease=\(.prerelease) immutable=\(.immutable)"')" ||
            { echo "::error::$TAG is not a published release."; exit 1; }
          [[ "$state" == "draft=false prerelease=false immutable=true" ]] ||
            { echo "::error::Release $TAG is $state; nothing is promoted from a draft, a prerelease or a release that is not immutable."; exit 1; }
          echo "Release $TAG: $state"
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/provimux
          persist-credentials: false
      - name: The formula artifact, by id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PMX_REPO: ${{ github.repository }}
          PMX_RUN_ID: ${{ github.run_id }}
          ID: ${{ needs.formula.outputs.artifact }}
          DIGEST: ${{ needs.formula.outputs.digest }}
        run: bash .github/provimux/check.sh fetch "$ID" formula "$DIGEST" "$RUNNER_TEMP/formula"
      - uses: actions/download-artifact@v4
        if: ${{ needs.meta.outputs.publish != 'true' }}
        with:
          name: release
          path: release
      - name: Check the formula against the tap (commits nothing)
        env:
          CHECKSUMS_URL: ${{ format('https://github.com/{0}/releases/download/{1}/checksums.txt', github.repository, github.ref_name) }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          git clone --depth 1 https://github.com/ngvoicu/homebrew-tap.git tap
          formula=tap/Formula/provimux.rb
          new="$RUNNER_TEMP/formula/provimux.rb"
          version_of() { sed -n 's/^  version "\(.*\)"$/\1/p' "$1"; }
          current="$(version_of "$formula")"
          [[ "$(version_of "$new")" == "$PROVIMUX_VERSION" ]] || fail "The prepared formula is not for $PROVIMUX_VERSION."
          if cmp -s "$new" "$formula"; then
            echo "The tap already has this formula ($current)."
            exit 0
          fi
          [[ "$current" != "$PROVIMUX_VERSION" ]] ||
            fail "The tap has $PROVIMUX_VERSION with a different formula than this run's."
          if [[ "$PUBLISH" == true && "$(printf '%s\n%s\n' "$current" "$PROVIMUX_VERSION" | sort -V | tail -n 1)" != "$PROVIMUX_VERSION" ]]; then
            echo "::notice::The tap has $current; $PROVIMUX_VERSION is not newer, the tap will stay as it is."
            exit 0
          fi
          cmp -s "$RUNNER_TEMP/formula/base.rb" "$formula" ||
            fail "Formula/provimux.rb changed in the tap since the formula job read it; rerun the formula and tap-check jobs."
          # The checksums of the release (on a dry run, this run's own).
          if [[ "$PUBLISH" == true ]]; then
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/checksums.txt" "$CHECKSUMS_URL"
          else
            cp release/checksums.txt "$RUNNER_TEMP/checksums.txt"
          fi
          bash .github/provimux/tap.sh verify "$PROVIMUX_VERSION" "$RUNNER_TEMP/checksums.txt" "$formula" "$new" ||
            fail "The prepared formula changes more than the version, url and sha256 lines."
          diff -u "$formula" "$new" || true
          echo "The prepared formula passes every check against ngvoicu/homebrew-tap ($current -> $PROVIMUX_VERSION); nothing is committed here." | tee -a "$GITHUB_STEP_SUMMARY"
      # The binding provimux-publish (tap.sh artifact) reads: only this job's annotation.
      - name: Bind the formula artifact
        env:
          ID: ${{ needs.formula.outputs.artifact }}
          DIGEST: ${{ needs.formula.outputs.digest }}
        run: echo "::notice title=provimux-formula-artifact::$ID formula sha256:$DIGEST"

  # Mark this run's release "latest" on GitHub, only forward. publish-release never does
  # (it publishes with --latest=false; GitHub would otherwise make every newly published
  # release latest, so an older base's -pmx.<n> published later would move it back).
  # It promotes only the release id publish-release published and verified, never
  # another release it finds. One job at a time across all runs (queue: max keeps every
  # pending one, as for image-latest); inside that, it reads the release and the
  # current latest, stops when either cannot be read, leaves a latest that is not older,
  # and reads latest back after the change.
  release-latest:
    needs: [meta, publish-release]
    if: ${{ needs.meta.outputs.publish == 'true' && needs.publish-release.outputs.release_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: provimux-release-latest
      cancel-in-progress: false
      queue: max
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      ID: ${{ needs.publish-release.outputs.release_id }}
    steps:
      - name: Mark this release latest (only forward)
        run: |
          # >>> latest
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          re='^v[0-9]+\.[0-9]+\.[0-9]+-pmx\.[0-9]+$'
          [[ "$ID" =~ ^[0-9]+$ && "$TAG" =~ $re ]] || fail "No verified release id for $TAG; latest left as it is."
          mine="$(gh api "repos/$GH_REPO/releases/$ID" --jq '"\(.tag_name) \(.draft) \(.prerelease) \(.immutable)"')" ||
            fail "Cannot read release $ID; latest left as it is."
          [[ "$mine" == "$TAG false false true" ]] || fail "Release $ID is '$mine', not $TAG published and immutable; latest left as it is."
          err="$(mktemp)"
          if cur="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name // ""' 2>"$err")"; then
            [[ -n "$cur" ]] || fail "The current latest release has no tag name; latest left as it is."
          elif grep -q 'HTTP 404' "$err"; then
            cur=''
          else
            fail "Cannot read the current latest release ($(head -n 1 "$err")); latest left as it is."
          fi
          if [[ "$cur" == "$TAG" ]]; then
            echo "Latest is already $TAG."
            exit 0
          fi
          if [[ "$cur" =~ $re && "$(printf '%s\n%s\n' "$cur" "$TAG" | sort -V | tail -n 1)" == "$cur" ]]; then
            echo "::notice::Latest is $cur, not older than $TAG; left as it is."
            exit 0
          fi
          gh api -X PATCH "repos/$GH_REPO/releases/$ID" -f make_latest=true >/dev/null
          after="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name // ""')" || fail "Marked $TAG latest, but cannot read latest back."
          [[ "$after" == "$TAG" ]] || fail "Marked $TAG latest, but latest reads back as '$after'."
          echo "Latest: ${cur:-none} -> $TAG"
          # <<< latest

  # Push the images checked by the image job, byte for byte, by digest; then the
  # multi-arch index prepared by the prepare job; then the version tag (never moved
  # once set). No checkout, no repository script. Not in a concurrency group: each
  # release's version tag is pushed even when several releases overlap.
  image-push:
    needs: [meta, prepare, publish-release]
    if: ${{ needs.meta.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PROVIMUX_VERSION: ${{ needs.meta.outputs.provimux_version }}
      REGISTRY: ghcr.io
      IMAGE_STAGES: push
    steps:
      - *release-public
      - &oci-download
        uses: actions/download-artifact@v4
        with:
          path: oci
          pattern: oci-*
          merge-multiple: true
      - &index-download
        uses: actions/download-artifact@v4
        with:
          name: image-index
          path: image-index
      - &image-push-step
        name: Push the image (stages in IMAGE_STAGES)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          name="${GITHUB_REPOSITORY_OWNER,,}/provimux"
          if [[ "$REGISTRY" == ghcr.io ]]; then
            token="$(curl -fsS -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" "https://ghcr.io/token?service=ghcr.io&scope=repository:${name}:pull,push" | jq -r .token)"
            [[ -n "$token" && "$token" != null ]] || fail "No registry token for $name."
            auth=(-H "Authorization: Bearer $token")
            api="https://ghcr.io/v2/$name"
          else
            auth=()
            api="http://$REGISTRY/v2/$name"
          fi
          accept='application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json'
          # Digest a tag or digest resolves to; empty when it does not exist.
          ref_digest() {
            local hdr code d
            hdr="$(mktemp)"
            code="$(curl -sS "${auth[@]}" -I -H "Accept: $accept" -D "$hdr" -o /dev/null -w '%{http_code}' "$api/manifests/$1")"
            case "$code" in
              200)
                # A 200 without a valid digest is not "absent": stop.
                d="$(awk 'tolower($1) == "docker-content-digest:" { print $2 }' "$hdr" | tr -d '\r')"
                [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::HEAD $api/manifests/$1: HTTP 200 without a valid Docker-Content-Digest ('$d')" >&2; return 1; }
                echo "$d" ;;
              404) ;;
              *) echo "::error::HEAD $api/manifests/$1: HTTP $code" >&2; return 1 ;;
            esac
          }
          push_blob() { # digest file
            local loc sep
            [[ "$(curl -sS "${auth[@]}" -I -o /dev/null -w '%{http_code}' "$api/blobs/$1")" == 200 ]] && return 0
            loc="$(curl -fsS "${auth[@]}" -X POST --data '' -D - -o /dev/null "$api/blobs/uploads/" | awk 'tolower($1) == "location:" { print $2 }' | tr -d '\r')"
            [[ -n "$loc" ]] || fail "No upload location for $1."
            [[ "$loc" == http* ]] || loc="${api%%/v2/*}$loc"
            [[ "$loc" == *\?* ]] && sep='&' || sep='?'
            curl -fsS "${auth[@]}" -X PUT -H 'Content-Type: application/octet-stream' -T "$2" -o /dev/null "${loc}${sep}digest=$1"
          }
          put_manifest() { # ref file media-type
            local want got
            want="sha256:$(sha256sum "$2" | cut -d' ' -f1)"
            curl -fsS "${auth[@]}" -X PUT -H "Content-Type: $3" --data-binary "@$2" -o /dev/null "$api/manifests/$1"
            got="$(ref_digest "$1")"
            [[ "$got" == "$want" ]] || fail "$name:$1 is $got after the push, expected $want."
          }

          index=image-index/index.json
          idigest="$(cat image-index/digest)"
          [[ "sha256:$(sha256sum "$index" | cut -d' ' -f1)" == "$idigest" ]] || fail "The image index does not match its digest."
          jq -e --arg v "$PROVIMUX_VERSION" '.annotations["org.opencontainers.image.version"] == $v' "$index" >/dev/null ||
            fail "The image index is not for $PROVIMUX_VERSION."

          stage() { [[ " $IMAGE_STAGES " == *" $1 "* ]]; }

          if stage push; then
            # 1. Each architecture's image, exactly as exported, by digest.
            for arch in amd64 arm64; do
              dir="$RUNNER_TEMP/oci-$arch"
              mkdir -p "$dir"
              tar -xf "oci/oci-$arch.tar" -C "$dir"
              blob() { echo "$dir/blobs/${1%%:*}/${1#*:}"; }
              desc="$(jq -c '.manifests[0]' "$dir/index.json")"
              mdigest="$(jq -r .digest <<<"$desc")"
              jq -e --arg d "$mdigest" --arg a "$arch" 'any(.manifests[]; .digest == $d and .platform.architecture == $a)' "$index" >/dev/null ||
                fail "linux/$arch manifest $mdigest is not in the image index."
              manifest="$(blob "$mdigest")"
              [[ "sha256:$(sha256sum "$manifest" | cut -d' ' -f1)" == "$mdigest" ]] || fail "Manifest blob does not match $mdigest."
              for d in $(jq -r '.config.digest, .layers[].digest' "$manifest"); do
                f="$(blob "$d")"
                [[ "sha256:$(sha256sum "$f" | cut -d' ' -f1)" == "$d" ]] || fail "Blob $d does not match its digest."
                push_blob "$d" "$f"
              done
              put_manifest "$mdigest" "$manifest" "$(jq -r .mediaType <<<"$desc")"
              echo "Pushed $REGISTRY/$name@$mdigest (linux/$arch)"
            done

            # 2. The index, by digest, then the version tag. A version tag is never moved.
            put_manifest "$idigest" "$index" application/vnd.oci.image.index.v1+json
            current="$(ref_digest "$PROVIMUX_VERSION")"
            if [[ -z "$current" ]]; then
              put_manifest "$PROVIMUX_VERSION" "$index" application/vnd.oci.image.index.v1+json
              echo "Tagged $REGISTRY/$name:$PROVIMUX_VERSION = $idigest" | tee -a "$GITHUB_STEP_SUMMARY"
            elif [[ "$current" == "$idigest" ]]; then
              echo "$REGISTRY/$name:$PROVIMUX_VERSION is already $idigest."
            else
              fail "$REGISTRY/$name:$PROVIMUX_VERSION is $current, not this run's $idigest; a version tag is not moved."
            fi
          fi

          if stage latest; then
            # The version tag is this run's index (pushed by the push stage).
            [[ "$(ref_digest "$PROVIMUX_VERSION")" == "$idigest" ]] || fail "$REGISTRY/$name:$PROVIMUX_VERSION is not this run's $idigest; :latest left as it is."
            # 3. :latest, only forward. The version :latest has: the index annotation,
            # else the org.opencontainers.image.version label of its first image.
            latest="$(ref_digest latest)"
            have=''
            if [[ -n "$latest" ]]; then
              m="$(curl -fsSL "${auth[@]}" -H "Accept: $accept" "$api/manifests/$latest")"
              have="$(jq -r '.annotations["org.opencontainers.image.version"] // empty' <<<"$m")"
              if [[ -z "$have" ]]; then
                if jq -e '.manifests' <<<"$m" >/dev/null; then
                  m="$(curl -fsSL "${auth[@]}" -H "Accept: $accept" "$api/manifests/$(jq -r '.manifests[0].digest' <<<"$m")")"
                fi
                have="$(curl -fsSL "${auth[@]}" "$api/blobs/$(jq -r .config.digest <<<"$m")" | jq -r '.config.Labels["org.opencontainers.image.version"] // empty')"
              fi
              [[ -n "$have" ]] || fail "Cannot tell which version $REGISTRY/$name:latest ($latest) is; :latest left as it is."
            fi
            if [[ "$latest" == "$idigest" ]]; then
              echo "$REGISTRY/$name:latest is already $PROVIMUX_VERSION."
            elif [[ -z "$latest" || ( "$have" != "$PROVIMUX_VERSION" && "$(printf '%s\n%s\n' "$have" "$PROVIMUX_VERSION" | sort -V | tail -n 1)" == "$PROVIMUX_VERSION" ) ]]; then
              put_manifest latest "$index" application/vnd.oci.image.index.v1+json
              echo "Moved $REGISTRY/$name:latest from ${have:-nothing} to $PROVIMUX_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::notice::$REGISTRY/$name:latest is $have, not older than $PROVIMUX_VERSION; left as it is."
            fi
          fi

  # Move :latest to this version, only forward. One job at a time across runs, so an
  # older run cannot move :latest back. queue: max keeps every pending job of the group
  # (up to 100) instead of one, so overlapping releases each run in turn and none is
  # cancelled; the only-forward rule leaves :latest on the newest.
  image-latest:
    needs: [meta, image-push]
    if: ${{ needs.meta.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: provimux-image-latest
      cancel-in-progress: false
      queue: max
    env:
      PROVIMUX_VERSION: ${{ needs.meta.outputs.provimux_version }}
      REGISTRY: ghcr.io
      IMAGE_STAGES: latest
    steps:
      - *release-public
      - *index-download
      - *image-push-step

  # Dry run: the same push step, both stages, against a registry on the runner, with
  # a read-only token; then the smoke test of the pushed image.
  image-dryrun:
    needs: [meta, prepare]
    if: ${{ needs.meta.outputs.publish != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROVIMUX_VERSION: ${{ needs.meta.outputs.provimux_version }}
      REGISTRY: localhost:5000
      IMAGE_STAGES: push latest
    steps:
      - *oci-download
      - *index-download
      - name: Start a registry for the dry run
        run: |
          docker run -d --name registry -p 5000:5000 registry:2
          for _ in $(seq 30); do curl -fsS http://localhost:5000/v2/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - *image-push-step
      - name: "Dry run: point :latest at a newer version"
        run: |
          set -euo pipefail
          api="http://localhost:5000/v2/${GITHUB_REPOSITORY_OWNER,,}/provimux"
          jq -c '.annotations["org.opencontainers.image.version"] = "99.0.0-pmx.1"' image-index/index.json > "$RUNNER_TEMP/newer.json"
          curl -fsS -X PUT -H 'Content-Type: application/vnd.oci.image.index.v1+json' --data-binary "@$RUNNER_TEMP/newer.json" "$api/manifests/latest"
      # Again: a rerun changes nothing and must leave the newer :latest.
      - *image-push-step
      - name: Check the dry-run registry
        run: |
          set -euo pipefail
          api="http://localhost:5000/v2/${GITHUB_REPOSITORY_OWNER,,}/provimux"
          digest() { curl -fsSI -H 'Accept: application/vnd.oci.image.index.v1+json' "$api/manifests/$1" | awk 'tolower($1) == "docker-content-digest:" { print $2 }' | tr -d '\r'; }
          [[ "$(digest "$PROVIMUX_VERSION")" == "$(cat image-index/digest)" ]] || { echo "::error::Version tag is not the prepared index."; exit 1; }
          [[ "$(digest latest)" == "sha256:$(sha256sum "$RUNNER_TEMP/newer.json" | cut -d' ' -f1)" ]] || { echo "::error:::latest was moved back."; exit 1; }
          echo "Version tag = $(cat image-index/digest); :latest left on the newer version."
          ref="localhost:5000/${GITHUB_REPOSITORY_OWNER,,}/provimux:${PROVIMUX_VERSION}"
          docker pull -q --platform linux/amd64 "$ref"
          out="$(docker run --rm --platform linux/amd64 "$ref" ./provimux --help 2>&1 || true)"
          grep -m1 '^Provimux Version:' <<<"$out"
          docker buildx imagetools inspect "$ref"

  # A failed or cancelled release run reports itself in the issue "sync: v<base>" (opened
  # when none is open), so that a failure is told even when no check or publish run
  # looks at this base again. No checkout, no repository script.
  report:
    needs: [meta, catalogs, build-hosted, build-linux-glibc, build-linux-no-plugin, build-freebsd, image, prepare, provenance, publish-release, formula, tap-check, release-latest, image-push, image-latest]
    if: ${{ always() && github.event_name == 'push' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Tell the sync issue (and the tap issue when tap-check failed)
        run: |
          # >>> report
          set -euo pipefail
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-pmx\.[0-9]+$ ]] || { echo "::error::$TAG is not v<base>-pmx.<n>"; exit 1; }
          base="${BASH_REMATCH[1]}"
          failed="$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "\(.name) (\(.conclusion))"] | join(", ")')" || failed="(cannot list the jobs)"
          title="sync: v$base — release $TAG failed, owner needed"
          marker="<!-- provimux-release $GITHUB_RUN_ID/$ATTEMPT -->"
          # shellcheck disable=SC2016 # Markdown backticks in the text
          body="$(printf '%s\n**The release run for `%s` (`%s`) failed.** Failed jobs: %s.\n\nNothing after the failed jobs ran. When the cause is fixed, rerun the failed jobs (published assets and tags are never replaced; every promotion only moves forward):\n\n```sh\ngh run rerun %s --failed -R %s\n```\n\nThen check the release (SYNC.md, "Check a release"). The Homebrew tap is updated by provimux-publish after a successful release run, or by `publish.sh --tap %s`.\n\nRun: %s\n' \
            "$marker" "$TAG" "${SHA:0:12}" "$failed" "$GITHUB_RUN_ID" "$GH_REPO" "$TAG" "$RUN_URL")"
          number="$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" \
            --jq ".[] | select(.pull_request == null) | select(.title == \"sync: v$base\" or (.title | startswith(\"sync: v$base \"))) | .number" | sort -n | head -n 1)"
          if [[ -z "$number" ]]; then
            gh issue create -R "$GH_REPO" --title "$title" --body "$body"
          else
            gh issue edit "$number" -R "$GH_REPO" --title "$title" >/dev/null
            if ! gh api --paginate "repos/$GH_REPO/issues/$number/comments?per_page=100" --jq '.[].body' | grep -qF -- "$marker"; then
              gh issue comment "$number" -R "$GH_REPO" --body "$body" >/dev/null
            fi
            echo "Reported on #$number: $title"
          fi
          # A failed tap-check (the formula does not fit the tap) is a tap failure too: the
          # issue "homebrew tap: <tag> needs the owner" (SYNC.md, "The Homebrew tap"), opened
          # or commented on once per run attempt; never retitled or closed here.
          if [[ "$failed" == *"tap-check ("* ]]; then
            ttitle="homebrew tap: $TAG needs the owner"
            # shellcheck disable=SC2016 # Markdown backticks in the text
            tbody="$(printf '%s\n**The release run for `%s` failed its job `tap-check`**: the formula does not fit the Homebrew tap. No automation closes or retitles this issue. When the cause is fixed and the release is complete, the owner runs, with their own credentials (if a newer `-pmx` release exists by then, use that tag):\n\n```sh\nbash .github/provimux/publish.sh --tap %s\nbash .github/provimux/tap.sh check %s "$(mktemp -d)"\n```\n\nand closes this issue once `tap.sh check` prints `ok`.\n\nRun: %s\n' \
              "$marker" "$TAG" "$TAG" "$TAG" "$RUN_URL")"
            tnumber="$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" \
              --jq ".[] | select(.pull_request == null) | select(.title == \"$ttitle\") | .number" | sort -n | head -n 1)"
            if [[ -z "$tnumber" ]]; then
              gh issue create -R "$GH_REPO" --title "$ttitle" --body "$tbody"
            elif ! gh api --paginate "repos/$GH_REPO/issues/$tnumber/comments?per_page=100" --jq '.[].body' | grep -qF -- "$marker"; then
              gh issue comment "$tnumber" -R "$GH_REPO" --body "$tbody" >/dev/null
            fi
            echo "Reported on the tap issue: $ttitle"
          fi
          # <<< report
