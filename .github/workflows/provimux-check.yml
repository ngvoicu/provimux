# Provimux sync check: check automatically; provimux-publish.yml publishes a pass
# (.github/provimux/SYNC.md). Every 3 hours (or by hand, optionally for one tag) it
# rebases main onto CLIProxyAPI's newest stable release, builds, compares go test ./...
# with the pristine release, runs the guard, lists new upstream workflow files and the
# range-diff of the owner's patches, and reports in the issue "sync: v<base>".
#
# It publishes nothing and holds no token of the owner (provimux-publish.yml, started
# by this run's completion, does). Every job checks out the run's
# own commit (github.sha, the head_sha publish.sh binds the artifact to) and runs that
# commit's scripts. Only the "test" jobs run upstream's or the candidate's code, one tree
# per job, and they only write raw go output; the "verdict" job turns that output (data)
# into the result and runs no repository code, nor does "prepare" (git only) or "report",
# which alone may write issues.
name: provimux-check

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release to check (vX.Y.Z, a stable release); empty = the newest stable CLIProxyAPI release'
        required: false
        default: ''

concurrency:
  group: provimux-check
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      status: ${{ steps.prepare.outputs.status || steps.select.outputs.status }}
      # Every later job reads this job's artifact by this id and digest, never by name.
      artifact: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      PMX_REPO: ${{ github.repository }}
      PMX_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # The check scripts, outside the tree the check rebases.
      - name: Copy the check scripts
        run: |
          cp -R .github/provimux "$RUNNER_TEMP/pmx"
          echo "PMX_CHECK_OUT=$RUNNER_TEMP/check" >> "$GITHUB_ENV"
      - name: Select the release
        id: select
        env:
          # Read-only API access (the job has contents: read); only this step has it.
          GH_TOKEN: ${{ github.token }}
          PMX_TAG: ${{ inputs.tag }}
        run: bash "$RUNNER_TEMP/pmx/check.sh" select
      - name: Rebase, range-diff, workflow paths, guard (git only)
        id: prepare
        if: ${{ steps.select.outputs.status == 'check' }}
        run: |
          git config --global --add safe.directory "$PWD"
          bash "$RUNNER_TEMP/pmx/check.sh" prepare
      - uses: actions/upload-artifact@v4
        id: upload
        if: ${{ always() }}
        with:
          name: pmx-prepare
          path: ${{ runner.temp }}/check/
          if-no-files-found: warn

  # One job per tree: upstream's and the candidate's code run here, and only raw go output
  # leaves the job. Two jobs, not a matrix, so that each hands its own artifact id and
  # step outcomes to the verdict.
  test-candidate:
    name: test (candidate)
    needs: prepare
    if: ${{ needs.prepare.outputs.status == 'test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
      build: ${{ steps.build.outcome }}
      test: ${{ steps.test.outcome }}
      rerun: ${{ steps.rerun.outcome }}
      retry: ${{ steps.retry.outcome }}
    env:
      # The release may need a newer Go than the one its go.mod names.
      GOTOOLCHAIN: auto
      PMX_REPO: ${{ github.repository }}
      PMX_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/provimux
          persist-credentials: false
      - name: Paths
        run: echo "PMX_CHECK_OUT=$RUNNER_TEMP/check" >> "$GITHUB_ENV"
      # Before any of the tree's code runs; the token only in this step.
      - name: The prepare job's artifact, by id
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.prepare.outputs.artifact }}
          DIGEST: ${{ needs.prepare.outputs.digest }}
        run: bash .github/provimux/check.sh fetch "$ID" pmx-prepare "$DIGEST" "$PMX_CHECK_OUT"
      - name: Export the candidate tree (git only)
        run: bash .github/provimux/check.sh tree candidate
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ runner.temp }}/check/trees/candidate/go.mod
          cache: false
      # Each part is its own step whose exit status is the command's; the runner keeps
      # its outcome (a job output below), which the tree's code cannot write.
      - name: go build (runs the tree's code)
        id: build
        continue-on-error: true
        run: bash .github/provimux/check.sh test candidate build
      - name: go list, go test -json (runs the tree's code; raw output only)
        id: test
        continue-on-error: true
        run: bash .github/provimux/check.sh test candidate test
      - name: go test again, whole, the packages with a failing test (runs the tree's code)
        id: rerun
        continue-on-error: true
        run: bash .github/provimux/check.sh test candidate rerun
      # Known timing tests (.github/provimux/timing-tests.txt) that failed above: each alone,
      # in a fresh process, until it passes (2 times at most); each retry is logged here.
      - name: go test again, alone, the known timing tests that failed (runs the tree's code)
        id: retry
        continue-on-error: true
        run: bash .github/provimux/check.sh test candidate retry
      - uses: actions/upload-artifact@v4
        id: upload
        if: ${{ always() }}
        with:
          name: pmx-test-candidate
          path: ${{ runner.temp }}/check/test/candidate/
          if-no-files-found: warn

  test-tag:
    name: test (tag)
    needs: prepare
    if: ${{ needs.prepare.outputs.status == 'test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
      test: ${{ steps.test.outcome }}
    env:
      # The release may need a newer Go than the one its go.mod names.
      GOTOOLCHAIN: auto
      PMX_REPO: ${{ github.repository }}
      PMX_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/provimux
          persist-credentials: false
      - name: Paths
        run: echo "PMX_CHECK_OUT=$RUNNER_TEMP/check" >> "$GITHUB_ENV"
      # Before any of the tree's code runs; the token only in this step.
      - name: The prepare job's artifact, by id
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.prepare.outputs.artifact }}
          DIGEST: ${{ needs.prepare.outputs.digest }}
        run: bash .github/provimux/check.sh fetch "$ID" pmx-prepare "$DIGEST" "$PMX_CHECK_OUT"
      - name: Export the tag tree (git only)
        run: bash .github/provimux/check.sh tree tag
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ runner.temp }}/check/trees/tag/go.mod
          cache: false
      # Each part is its own step whose exit status is the command's; the runner keeps
      # its outcome (a job output below), which the tree's code cannot write.
      - name: go list, go test -json (runs the tree's code; raw output only)
        id: test
        continue-on-error: true
        run: bash .github/provimux/check.sh test tag test
      - uses: actions/upload-artifact@v4
        id: upload
        if: ${{ always() }}
        with:
          name: pmx-test-tag
          path: ${{ runner.temp }}/check/test/tag/
          if-no-files-found: warn

  # Turns the raw output into the result. Runs no repository code. Every input is the
  # artifact its producing job named by id and digest (a job output); an artifact of the
  # same name uploaded or replaced by another job (a new id) is never read. The test
  # outcomes are the runner's step outcomes and the jobs' conclusions (jobs API), checked
  # against the exit statuses in the artifacts.
  verdict:
    needs: [prepare, test-candidate, test-tag]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      PMX_REPO: ${{ github.repository }}
      PMX_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PMX_RUN_ID: ${{ github.run_id }}
      PMX_RUN_ATTEMPT: ${{ github.run_attempt }}
      PMX_PREP_JOB: ${{ needs.prepare.result }}
      PMX_TEST_JOB: candidate ${{ needs.test-candidate.result }}, tag ${{ needs.test-tag.result }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/provimux
          persist-credentials: false
      - name: Paths
        run: echo "PMX_CHECK_OUT=$RUNNER_TEMP/check" >> "$GITHUB_ENV"
      - name: The prepare and test artifacts, by id
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ needs.prepare.outputs.status }}
          PREP: ${{ needs.prepare.outputs.artifact }} ${{ needs.prepare.outputs.digest }}
          CAND: ${{ needs.test-candidate.outputs.artifact }} ${{ needs.test-candidate.outputs.digest }}
          TAG: ${{ needs.test-tag.outputs.artifact }} ${{ needs.test-tag.outputs.digest }}
        run: |
          # A missing or mismatched artifact leaves its files absent: the verdict then
          # reports which result is missing.
          read -r id d <<<"$PREP"
          bash .github/provimux/check.sh fetch "${id:-}" pmx-prepare "${d:-}" "$PMX_CHECK_OUT" || true
          if [ "$STATUS" = test ]; then
            read -r id d <<<"$CAND"
            bash .github/provimux/check.sh fetch "${id:-}" pmx-test-candidate "${d:-}" "$PMX_CHECK_OUT/test/candidate" || true
            read -r id d <<<"$TAG"
            bash .github/provimux/check.sh fetch "${id:-}" pmx-test-tag "${d:-}" "$PMX_CHECK_OUT/test/tag" || true
          fi
      - name: Verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PMX_OUTCOME_BUILD: ${{ needs.test-candidate.outputs.build }}
          PMX_OUTCOME_CAND_TEST: ${{ needs.test-candidate.outputs.test }}
          PMX_OUTCOME_RERUN: ${{ needs.test-candidate.outputs.rerun }}
          PMX_OUTCOME_RETRY: ${{ needs.test-candidate.outputs.retry }}
          PMX_OUTCOME_TAG_TEST: ${{ needs.test-tag.outputs.test }}
        run: bash .github/provimux/check.sh verdict
      - name: Summary
        if: ${{ always() }}
        run: |
          if [ -f "$PMX_CHECK_OUT/result.json" ]; then
            jq -r '"### provimux-check: \(.status) \(.upstream.tag // "")", "", (.reasons[]? | "- " + .),
              (if (.warnings // []) | length > 0 then "", "Warnings from the candidate tests (not counted):", "", (.warnings[] | "- \(.test): \(.text)") else empty end),
              (if (.tests.timing_retries // []) | length > 0 then "", "Known timing tests that failed on the candidate, and their retries (timing-tests.txt):", "", (.tests.timing_retries[] | "- \(.test): \(.retries | if length == 0 then "not retried" else join(", ") end)") else empty end)' \
              "$PMX_CHECK_OUT/result.json" | tr -d '`' >> "$GITHUB_STEP_SUMMARY"
          fi
      # The artifact publish.sh reads. The run succeeds only if this upload does, and an
      # artifact name is unique in a run, so a run that succeeded has this job's copy.
      - uses: actions/upload-artifact@v4
        id: upload
        if: ${{ always() }}
        with:
          name: provimux-check-${{ needs.prepare.outputs.tag || 'none' }}
          path: |
            ${{ runner.temp }}/check/result.json
            ${{ runner.temp }}/check/candidate.bundle
            ${{ runner.temp }}/check/logs/
          if-no-files-found: warn
      # Binds the artifact to this job: publish.sh and autopublish.sh (check_artifact in
      # common.sh) take only the artifact this annotation names, the only one of this
      # title on this job. The test jobs can upload artifacts too, but cannot annotate
      # this job; a second annotation of this title (from any output) fails the lookup.
      - name: Bind the artifact to the verdict
        if: ${{ always() && steps.upload.outputs.artifact-id != '' }}
        env:
          ID: ${{ steps.upload.outputs.artifact-id }}
          NAME: provimux-check-${{ needs.prepare.outputs.tag || 'none' }}
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: echo "::notice title=provimux-check-artifact::$ID $NAME${DIGEST:+ sha256:$DIGEST}"

  report:
    needs: [prepare, test-candidate, test-tag, verdict]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/provimux
          persist-credentials: false
      # The verdict's artifact by its id and digest (no lookup by name).
      - name: The verdict's artifact, by id
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PMX_REPO: ${{ github.repository }}
          PMX_RUN_ID: ${{ github.run_id }}
          ID: ${{ needs.verdict.outputs.artifact }}
          DIGEST: ${{ needs.verdict.outputs.digest }}
          NAME: provimux-check-${{ needs.prepare.outputs.tag || 'none' }}
        run: bash .github/provimux/check.sh fetch "$ID" "$NAME" "$DIGEST" "$RUNNER_TEMP/artifact"
      - name: Open, update or close the sync issue
        env:
          GH_TOKEN: ${{ github.token }}
          PMX_REPO: ${{ github.repository }}
          RESULT: ${{ runner.temp }}/artifact/result.json
          # success only when every job of the check did (the test jobs may be skipped).
          CHECK_JOB: ${{ (needs.prepare.result == 'success' && needs.verdict.result == 'success' && (needs.test-candidate.result == 'success' || needs.test-candidate.result == 'skipped') && (needs.test-tag.result == 'success' || needs.test-tag.result == 'skipped')) && 'success' || format('prepare {0}, test (candidate) {1}, test (tag) {2}, verdict {3}', needs.prepare.result, needs.test-candidate.result, needs.test-tag.result, needs.verdict.result) }}
          TAG_HINT: ${{ needs.prepare.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/provimux/report.sh
