# Provimux automatic publish (.github/provimux/SYNC.md, "Publishing automatically"): after
# every provimux-check run on main that passed for a release, publish it with no step by
# the owner. Started by hand (workflow_dispatch) it publishes one tag, or with dry_run
# does everything but the push (git push --dry-run).
#
# Trust:
#   - Before any repository code runs, an inline step proves the workflow identity and
#     that the check run's head_sha is exactly the current refs/heads/main. The checkout,
#     the check run, the artifact's old main and the push lease are all that one commit.
#   - The check's artifact is the one its verdict job bound to itself (check_artifact in
#     common.sh), for automatic and manual runs alike; a typed tag only confirms it.
#   - PROVIMUX_TOKEN is a secret of the environment provimux-publish (branch main, tags
#     v*-pmx.*), which only the job "publish" here and tap-publish in provimux-release.yml
#     declare. In that job only the step "Push" has it: a fixed inline git push of the
#     plan publish.sh verified (no hooks, no global config, no checkout), nothing else.
#     publish.sh never sees it. gh uses this run's GITHUB_TOKEN.
#   - A push with GITHUB_TOKEN could change no workflow file and its tag would start no
#     provimux-release run; that is why the push needs the owner's token.
name: provimux-publish

on:
  workflow_run:
    workflows: [provimux-check]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release to publish (vX.Y.Z); must be what the check run on the current main checked'
        required: true
      run:
        description: 'provimux-check run id on the current main; empty = the newest successful one'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: everything except the push (git push --dry-run); no wait, no issue change'
        type: boolean
        default: true

# One publish at a time, never cancelled midway. A second run for the same tag finds
# v<base>-pmx.* and skips; publish.sh and the atomic push refuse it too.
concurrency:
  group: provimux-publish
  cancel-in-progress: false

permissions: {}

env:
  PMX_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}

jobs:
  # Read-only: which check run, which commit, which tag. No secret.
  select:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      run: ${{ steps.verify.outputs.run }}
      action: ${{ steps.decide.outputs.action }}
      tag: ${{ steps.decide.outputs.tag }}
      artifact: ${{ steps.decide.outputs.artifact }}
      why: ${{ steps.verify.outputs.why || steps.decide.outputs.why }}
    steps:
      # Inline, before any checkout: runs no repository code.
      - name: Verify the workflow, the check run and the current main
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
          RUN_INPUT: ${{ inputs.run }}
        run: |
          set -euo pipefail
          fail() { echo "why=$*" >>"$GITHUB_OUTPUT"; echo "::error title=provimux-publish refused::$*"; exit 1; }
          [[ "$WORKFLOW_REF" == "$PMX_REPO/.github/workflows/provimux-publish.yml@refs/heads/main" ]] ||
            fail "this is $WORKFLOW_REF, not provimux-publish.yml on refs/heads/main"
          main="$(git ls-remote "https://github.com/$PMX_REPO.git" refs/heads/main | awk '{print $1}')"
          [[ "$main" =~ ^[0-9a-f]{40}$ ]] || fail "cannot read refs/heads/main"
          case "$EVENT" in
            workflow_run) run="$EVENT_RUN" ;;
            workflow_dispatch)
              run="$RUN_INPUT"
              if [[ -z "$run" ]]; then
                run="$(gh api "repos/$PMX_REPO/actions/workflows/provimux-check.yml/runs?branch=main&head_sha=$main&status=success&per_page=50" \
                  --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")] | sort_by(.created_at) | last | .id // empty')"
              fi ;;
            *) fail "event $EVENT" ;;
          esac
          [[ "$run" =~ ^[0-9]+$ ]] || fail "no successful provimux-check run on the current main $main (run the check)"
          gh api "repos/$PMX_REPO/actions/runs/$run" >"$RUNNER_TEMP/run.json" || fail "cannot read run $run"
          jq -e --arg repo "$PMX_REPO" --arg main "$main" '
            .path == ".github/workflows/provimux-check.yml" and .head_branch == "main"
            and (.event == "schedule" or .event == "workflow_dispatch")
            and .status == "completed" and .conclusion == "success"
            and .repository.full_name == $repo and .head_repository.full_name == $repo
            and .head_sha == $main' "$RUNNER_TEMP/run.json" >/dev/null ||
            fail "run $run ($(jq -r '"\(.path) \(.event) \(.head_branch) \(.conclusion) \(.head_sha)"' "$RUNNER_TEMP/run.json")) is not a successful provimux-check run of $PMX_REPO on the current main $main; nothing is published from an older main (run the check again)"
          echo "Check run $run checked the current main $main."
          { echo "sha=$main"; echo "run=$run"; } >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.verify.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: The checkout is that commit
        shell: bash
        env:
          SHA: ${{ steps.verify.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA" || { echo "::error::checked out $(git rev-parse HEAD), not $SHA"; exit 1; }

      - name: Decide (which tag; read-only)
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PMX_CHECK_RUN: ${{ steps.verify.outputs.run }}
          PMX_EXPECT_MAIN: ${{ steps.verify.outputs.sha }}
          PMX_TAG_INPUT: ${{ inputs.tag }}
        run: bash .github/provimux/autopublish.sh decide

  publish:
    needs: select
    if: ${{ needs.select.outputs.action == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # PROVIMUX_TOKEN lives in this environment (branch main, tags v*-pmx.*).
    environment: provimux-publish
    permissions:
      contents: read
      actions: read
      checks: read
      # publish.sh --wait closes the sync issue after a complete release.
      issues: write
    outputs:
      no_token: ${{ steps.token.outcome == 'failure' }}
    env:
      SHA: ${{ needs.select.outputs.sha }}
      TAG: ${{ needs.select.outputs.tag }}
      CHECK_RUN: ${{ needs.select.outputs.run }}
    steps:
      - name: Paths
        shell: bash
        run: |
          { echo "PLAN_DIR=$RUNNER_TEMP/pmx-plan"; echo "LOG=$RUNNER_TEMP/publish.log"; } >>"$GITHUB_ENV"

      # Again, inline: main may have moved while the select job ran.
      - name: main is still the checked commit
        shell: bash
        run: |
          main="$(git ls-remote "https://github.com/$PMX_REPO.git" refs/heads/main | awk '{print $1}')"
          if [ "$main" != "$SHA" ]; then
            msg="main is now $main, not the checked $SHA; nothing is published (the next check on the new main publishes)"
            echo "publish: $msg" >>"$LOG"
            echo "::error title=provimux-publish refused::$msg"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: The checkout is that commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SHA" || { echo "::error::checked out $(git rev-parse HEAD), not $SHA"; exit 1; }

      # publish.sh steps 1 to 4 (verification, guard on git objects, decisions, recheck),
      # without the token: the plan the next step pushes.
      - name: Plan (verify; no token)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/provimux/publish.sh "$TAG" --ci --plan "$PLAN_DIR" --run "$CHECK_RUN" --expect-main "$SHA" 2>&1 | tee -a "$LOG"

      - name: PROVIMUX_TOKEN is set
        id: token
        shell: bash
        env:
          # true/false only; the value is not exposed here.
          HAS_TOKEN: ${{ secrets.PROVIMUX_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::error title=PROVIMUX_TOKEN missing::The secret PROVIMUX_TOKEN of the environment provimux-publish is not set: nothing was pushed. Set it as SYNC.md says (\"The token\"), or publish by hand (\"Publishing by hand\")."
            exit 1
          fi

      # The only step with the token: one git push of the verified plan, from the plan's
      # bare repository (no checkout, hooks off, no global or system config), with the
      # lease on the checked main. The credential helper reads the token from this
      # process's environment; it is in no file, URL, argument or log.
      - name: Push (the only step with the token)
        shell: bash
        env:
          PMX_PUSH_TOKEN: ${{ secrets.PROVIMUX_TOKEN }}
        run: |
          set -euo pipefail
          plan="$PLAN_DIR/plan.env"
          get() { local v; v="$(sed -n "s/^$1=//p" "$plan" | head -n 1)"; [[ "$v" =~ $2 ]] || { echo "::error::plan: $1 is '$v'"; exit 1; }; printf '%s' "$v"; }
          sha_re='^[0-9a-f]{40}$'
          tag="$(get TAG '^v[0-9]+\.[0-9]+\.[0-9]+$')"
          pmx="$(get PMX_TAG '^v[0-9]+\.[0-9]+\.[0-9]+-pmx\.1$')"
          old="$(get OLD_MAIN "$sha_re")"
          cand="$(get CANDIDATE "$sha_re")"
          up="$(get UPSTREAM_COMMIT "$sha_re")"
          base_tag="$(get PUSH_BASE_TAG '^[01]$')"
          repo="$(get REPO '^/.+/repo\.git$')"
          [[ "$tag" == "$TAG" && "$pmx" == "$TAG-pmx.1" && "$old" == "$SHA" ]] ||
            { echo "::error::the plan is not for $TAG on $SHA"; exit 1; }
          refs=("$cand:refs/heads/main")
          [[ "$base_tag" == 0 ]] || refs+=("$up:refs/tags/$tag")
          refs+=("$cand:refs/tags/$pmx")
          args=(--atomic --porcelain "--force-with-lease=refs/heads/main:$SHA")
          [[ -z "$DRY_RUN" ]] || args+=(--dry-run)
          echo "git push ${args[*]} https://github.com/$PMX_REPO.git ${refs[*]}"
          # shellcheck disable=SC2016 # expanded by the credential helper's shell
          if GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 git --git-dir="$repo" \
            -c core.hooksPath=/dev/null -c credential.helper= \
            -c 'credential.https://github.com.helper=!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=$PMX_PUSH_TOKEN"; }; f' \
            push "${args[@]}" "https://github.com/$PMX_REPO.git" "${refs[@]}"; then
            if [[ -z "$DRY_RUN" ]]; then echo "Pushed."; else echo "Dry run: nothing was pushed."; fi
          else
            # git says the push failed; whether the remote changed (a lost acknowledgement)
            # is read from the remote by the notify job, not assumed here.
            echo "publish: git push of $TAG reported a failure" >>"$LOG"
            exit 1
          fi

      - name: Wait for the release, close the issue (no token)
        if: ${{ env.DRY_RUN == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/provimux/publish.sh "$TAG" --ci --wait "$PLAN_DIR" 2>&1 | tee -a "$LOG"

      # For the notify job: this job's log and plan (written only by main's own scripts).
      - name: Keep the log and the plan
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pmx-publish-log
          path: |
            ${{ runner.temp }}/publish.log
            ${{ runner.temp }}/pmx-plan/plan.env
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### provimux-publish: $TAG from check run $CHECK_RUN on $SHA${DRY_RUN:+ (dry run)}"
            if [ -s "$LOG" ]; then grep -E '^(publish: |Published|Plan written|Closed)' "$LOG" | tr -d '`' | sed 's/^/- /' || true; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Every failure of select or publish (not a dry run) is told in the sync issue, by the
  # current main's autopublish.sh notify, which reads the remote's refs and releases before
  # it writes any instruction.
  notify:
    needs: [select, publish]
    if: >-
      ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) &&
      (needs.select.result == 'failure' || needs.select.result == 'cancelled' ||
       needs.publish.result == 'failure' || needs.publish.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # Inline: the current main, whose scripts tell the issue (no other code runs here).
      - name: The current main
        id: main
        shell: bash
        run: |
          main="$(git ls-remote "https://github.com/$PMX_REPO.git" refs/heads/main | awk '{print $1}')"
          [[ "$main" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot read refs/heads/main"; exit 1; }
          echo "sha=$main" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.main.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: The checkout is that commit
        shell: bash
        env:
          SHA: ${{ steps.main.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA" || { echo "::error::checked out $(git rev-parse HEAD), not $SHA"; exit 1; }

      - name: The publish job's log and plan
        if: ${{ needs.publish.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pmx-publish-log
          path: ${{ runner.temp }}/publish

      - name: Tell the sync issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select.outputs.tag || inputs.tag }}
          OUTCOME: ${{ needs.publish.outputs.no_token == 'true' && 'no-token' || 'failed' }}
          WHY: ${{ needs.select.outputs.why }}
          EXPECT_MAIN: ${{ needs.select.outputs.sha }}
          LOG: ${{ runner.temp }}/publish/publish.log
          PLAN: ${{ runner.temp }}/publish/pmx-plan/plan.env
        run: bash .github/provimux/autopublish.sh notify
