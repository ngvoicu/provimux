# Provimux Docker image (PMX-10): a tag v<base>-pmx.<n> builds linux/amd64 and
# linux/arm64 from .github/provimux/Dockerfile and pushes ghcr.io/<owner>/provimux
# :<base>-pmx.<n> and :latest with GITHUB_TOKEN. A manual run (workflow_dispatch) is
# a dry run: it builds both architectures and checks the banner; it pushes nothing.
#
# Mirrors upstream's .github/workflows/docker-image.yml (left unchanged and
# disabled in this repo): one native runner per architecture, catalogs refreshed
# before the build, VERSION = the base tag WITH "v" (upstream passes the tag name),
# COMMIT and BUILD_DATE as upstream, plus PROVIMUX_VERSION. Instead of per-arch
# temporary tags on Docker Hub, each arch is pushed by digest and one manifest
# job tags the pair.
name: provimux-docker

on:
  push:
    tags:
      - 'v*-pmx.*'
  workflow_dispatch:
    inputs:
      provimux_version:
        description: 'Provimux version for the dry run (e.g. 8.0.77-pmx.0-dryrun); empty = <base>-pmx.0-dryrun'
        required: false
        default: ''

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/provimux

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.meta.outputs.base }}
      provimux_version: ${{ steps.meta.outputs.provimux_version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_date: ${{ steps.meta.outputs.build_date }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Versions and build metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.provimux_version }}
        run: |
          bash .github/provimux/release-meta.sh
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: docker ${{ matrix.arch }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # main.Version in the image: the base tag with "v", as upstream's image.
      VERSION: v${{ needs.meta.outputs.base }}
      PROVIMUX_VERSION: ${{ needs.meta.outputs.provimux_version }}
      COMMIT: ${{ needs.meta.outputs.commit }}
      BUILD_DATE: ${{ needs.meta.outputs.build_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/provimux/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            PROVIMUX_VERSION=${{ env.PROVIMUX_VERSION }}
          tags: provimux:check
          cache-from: type=gha,scope=provimux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=provimux-${{ matrix.arch }}
      - name: Check banner and image layout
        run: |
          set -euo pipefail
          expected="Provimux Version: ${PROVIMUX_VERSION} (based on CLIProxyAPI ${VERSION})"
          for cmd in ./provimux ./CLIProxyAPI; do
            out="$(docker run --rm provimux:check "$cmd" --help 2>&1 || true)"
            banner="$(printf '%s\n' "$out" | grep -m1 '^Provimux Version:' || true)"
            echo "$cmd: $banner"
            [[ "$banner" == "$expected"* ]] || { printf '%s\n' "$out" | head -n 20; echo "::error::Expected: $expected"; exit 1; }
          done
          docker image inspect provimux:check --format 'arch={{.Architecture}} workdir={{.Config.WorkingDir}} cmd={{json .Config.Cmd}} ports={{json .Config.ExposedPorts}}' | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$(docker image inspect provimux:check --format '{{.Config.WorkingDir}}')" == "/CLIProxyAPI" ]]
          [[ "$(docker image inspect provimux:check --format '{{.Architecture}}')" == "${{ matrix.arch }}" ]]
      - name: Login to GHCR
        if: ${{ needs.meta.outputs.publish == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest (linux/${{ matrix.arch }})
        if: ${{ needs.meta.outputs.publish == 'true' }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/provimux/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            PROVIMUX_VERSION=${{ env.PROVIMUX_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.PROVIMUX_VERSION }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=provimux-${{ matrix.arch }}
      - name: Save digest
        if: ${{ needs.meta.outputs.publish == 'true' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: ${{ needs.meta.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  docker_manifest:
    needs:
      - meta
      - docker
    if: ${{ needs.meta.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PROVIMUX_VERSION: ${{ needs.meta.outputs.provimux_version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          digests=(*)
          [[ ${#digests[@]} -eq 2 ]] || { echo "::error::Expected 2 digests, found ${#digests[@]}"; exit 1; }
          sources=()
          for d in "${digests[@]}"; do sources+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create \
            --tag "${IMAGE}:${PROVIMUX_VERSION}" \
            --tag "${IMAGE}:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${PROVIMUX_VERSION}"
