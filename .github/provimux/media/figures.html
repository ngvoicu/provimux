<!doctype html>
<!-- Source for the README figures. Edit here, then run: node .github/provimux/media/render-figures.mjs
     The text comes from real Provimux output, reduced to an example setup: one Claude subscription, one Claude
     API key, one Codex subscription and an OpenRouter key. -->
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;-webkit-font-smoothing:antialiased}
figure{margin:0 0 40px;width:960px}
.mono,pre,code{font-family:"SF Mono",ui-monospace,Menlo,monospace}

/* Terminal figures */
.term{border-radius:10px;overflow:hidden;background:#14171c;border:1px solid #363c45}
.term .bar{height:30px;background:#232730;display:flex;align-items:center;gap:8px;padding:0 12px}
.term .bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}
.term .bar i:nth-child(2){background:#febc2e}
.term .bar i:nth-child(3){background:#28c840}
.term .bar span{margin-left:10px;font:12px/1 -apple-system,"Segoe UI",sans-serif;color:#7f8890}
.term pre{margin:0;padding:14px 18px 16px;font-size:12.5px;line-height:1.6;color:#dde1e4;white-space:pre}
.p{color:#7f8890}.k{color:#8fb8de}.s{color:#e2c08d}.n{color:#c79bd9}.hl{background:rgba(104,183,141,.18);border-radius:3px}
.acc{color:#a798d7}.mut{color:#9aa3a8}.dim{color:#7f8890}.ok{color:#68b78d}.warn{color:#cd9a22}.rule{color:#4f585f}
.term .sect{margin:0;padding:10px 18px 0;font:11px/1.3 -apple-system,"Segoe UI",sans-serif;color:#7f8890;letter-spacing:.04em;text-transform:uppercase}
.term .sect + pre{padding-top:6px}

/* Diagram figures */
.paper{border-radius:10px;border:1px solid #cfd6dd;padding:26px 30px 28px;color:#1d2733;background:#f6f7f9;
  font:14px/1.4 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#5d6a78;margin:0 0 18px}
.cols{display:flex;align-items:stretch;gap:0}
.col{display:flex;flex-direction:column;gap:8px}
.col h4{margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5d6a78;font-weight:600}
.box{border:1px solid #c3ccd5;background:#fff;border-radius:7px;padding:8px 11px}
.box small{display:block;color:#5d6a78;font-size:12px;margin-top:2px}
.arrow{display:flex;align-items:center;justify-content:center;width:56px;color:#7d8a97;font-size:22px}
.hub{border:2px solid #2f6f9f;background:#eaf2f9;border-radius:10px;padding:16px 18px;width:330px}
.hub .name{font-size:24px;font-weight:700;letter-spacing:.01em;color:#1b4f75}
.hub .addr{font:13px "SF Mono",ui-monospace,Menlo,monospace;color:#2f6f9f;margin:4px 0 12px}
.hub ul{margin:0;padding:0 0 0 16px;font-size:13px;line-height:1.55;color:#24384b}
.tag{display:inline-block;font:11px/1 "SF Mono",ui-monospace,Menlo,monospace;padding:3px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.tag.oauth{background:#dcefe3;color:#25603d}.tag.apikey{background:#f3e6d0;color:#7a4b0c}

/* Live lists */
.ll-row{display:flex;align-items:center;margin-top:14px}
.ll-row .lab{width:118px;flex:none;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#5d6a78;font-weight:600}
.chips{display:flex;flex-direction:column;gap:5px;width:300px}
.chip{font:12.5px/1.2 "SF Mono",ui-monospace,Menlo,monospace;padding:6px 9px;border-radius:5px;border:1px solid #c3ccd5;background:#fff}
.chip.gone{color:#9a5a4b;background:#f8ebe7;border-color:#e3c0b5;text-decoration:line-through}
.chip.new{color:#1f5f3c;background:#e2f2e8;border-color:#a9d4b8}
.chip.ghost{visibility:hidden}
.ll-head{display:flex;margin-left:118px}
.ll-head div{width:300px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5d6a78;font-weight:600}
.ll-head .gap,.ll-row .arrow{width:56px}
.legend{display:flex;gap:22px;margin:20px 0 0 118px;font-size:12.5px;color:#3c4a58}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid #c3ccd5;background:#fff}
.legend .g::before{background:#f8ebe7;border-color:#e3c0b5}.legend .w::before{background:#e2f2e8;border-color:#a9d4b8}

/* OpenRouter */
.code{border:1px solid #c3ccd5;background:#fff;border-radius:7px;padding:10px 12px;margin:0;font-size:12px;line-height:1.55;color:#1d2733;white-space:pre}
.code .add{background:#dff0e5;color:#1f5f3c;border-radius:3px}
.code .c{color:#7d8a97}
.strip{margin-top:16px;display:flex;gap:10px;align-items:center;font-size:13px;color:#24384b}
.strip .mono{font-size:12.5px;background:#fff;border:1px solid #c3ccd5;border-radius:5px;padding:5px 8px}
</style></head>
<body>

<figure id="overview">
<div class="paper">
<div class="kicker">One local endpoint for your subscriptions and API keys</div>
<div class="cols">
  <div class="col" style="width:210px;justify-content:center">
    <h4>Your tools</h4>
    <div class="box">pi</div>
    <div class="box">Codex CLI</div>
    <div class="box">Claude Code</div>
    <div class="box">Any OpenAI-, Claude- or Gemini-format client</div>
  </div>
  <div class="arrow">→</div>
  <div class="col" style="justify-content:center">
    <div class="hub">
      <div class="name">Provimux</div>
      <div class="addr">http://127.0.0.1:8317</div>
      <ul>
        <li>which account serves each model, and which one answered</li>
        <li>each login's own model list</li>
        <li>OpenRouter caching, sessions and limits</li>
        <li>the right context and output limits</li>
      </ul>
    </div>
  </div>
  <div class="arrow">→</div>
  <div class="col" style="width:248px;justify-content:center">
    <h4>Your accounts</h4>
    <div class="box">Claude subscription<span class="tag oauth">oauth</span></div>
    <div class="box">Claude API key<span class="tag apikey">apikey</span></div>
    <div class="box">Codex subscription<span class="tag oauth">oauth</span></div>
    <div class="box">OpenRouter key<span class="tag apikey">apikey</span><small>openrouter.ai</small></div>
  </div>
</div>
</div>
</figure>

<figure id="model-accounts">
<div class="term"><div class="bar"><i></i><i></i><i></i><span>terminal</span></div>
<p class="sect">Which accounts serve each model, highest priority first (tried first)</p>
<pre><span class="p">$</span> curl -s 'http://127.0.0.1:8317/v1/models?include=accounts' -H "Authorization: Bearer $KEY" \
    | jq -r '.data[] | .id, "  \(.accounts[])"'
claude-opus-5-5
  <span class="hl">{<span class="k">"provider"</span>:<span class="s">"claude"</span>,<span class="k">"kind"</span>:<span class="s">"oauth"</span>,<span class="k">"priority"</span>:<span class="n">10</span>}</span>
  {<span class="k">"provider"</span>:<span class="s">"claude"</span>,<span class="k">"kind"</span>:<span class="s">"apikey"</span>,<span class="k">"priority"</span>:<span class="n">0</span>}
gpt-6.1-terra
  <span class="hl">{<span class="k">"provider"</span>:<span class="s">"codex"</span>,<span class="k">"kind"</span>:<span class="s">"oauth"</span>,<span class="k">"priority"</span>:<span class="n">0</span>}</span>
anthropic/claude-opus-5.5
  <span class="hl">{<span class="k">"provider"</span>:<span class="s">"openai-compatible-openrouter"</span>,<span class="k">"kind"</span>:<span class="s">"apikey"</span>,<span class="k">"priority"</span>:<span class="n">0</span>,<span class="k">"host"</span>:<span class="s">"openrouter.ai"</span>}</span></pre>
<p class="sect">Which kind of account answered this request</p>
<pre><span class="p">$</span> curl -si http://127.0.0.1:8317/v1/chat/completions -H "Authorization: Bearer $KEY" -d @request.json | grep -i '^x-cpa'
<span class="hl"><span class="k">X-Cpa-Auth-Kind:</span> oauth</span>
<span class="k">X-Cpa-Trace-Id:</span> <span class="dim">20261118231958-b1fbc5f0…</span></pre>
</div>
</figure>

<figure id="live-lists">
<div class="paper">
<div class="kicker">models.live-lists: each login registers what its own account lists</div>
<div class="ll-head"><div>The shared catalog</div><div class="gap"></div><div>What the login serves</div></div>
<div class="ll-row"><span class="lab">Claude login</span>
  <div class="chips"><span class="chip">claude-opus-5-5</span><span class="chip">claude-sonnet-5-5</span><span class="chip">claude-haiku-5-5</span><span class="chip">claude-opus-4-1-20250805</span><span class="chip">claude-3-7-sonnet-20250219</span></div>
  <div class="arrow">→</div>
  <div class="chips"><span class="chip">claude-opus-5-5</span><span class="chip">claude-sonnet-5-5</span><span class="chip">claude-haiku-5-5</span><span class="chip gone">claude-opus-4-1-20250805</span><span class="chip gone">claude-3-7-sonnet-20250219</span></div>
</div>
<div class="ll-row" style="margin-top:22px"><span class="lab">Codex login</span>
  <div class="chips"><span class="chip">gpt-6.1-terra</span><span class="chip">gpt-6-chat-thinking</span><span class="chip ghost">-</span></div>
  <div class="arrow">→</div>
  <div class="chips"><span class="chip">gpt-6.1-terra</span><span class="chip gone">gpt-6-chat-thinking</span><span class="chip new">gpt-6.2-sol</span></div>
</div>
<div class="legend"><span>in both: the catalog's values</span><span class="g">not in the login's list: hidden</span><span class="w">not in the catalog yet: added from the provider</span></div>
</div>
</figure>

<figure id="openrouter">
<div class="paper">
<div class="kicker">An openai-compatibility entry whose base URL is openrouter.ai</div>
<div class="cols" style="gap:18px">
  <div class="col" style="width:400px"><h4>Your client sends</h4>
<pre class="code">POST /v1/chat/completions

{"model": "anthropic/claude-opus-5.5",
 "messages": [
  {"role": "system",
   "content": "You are a coding agent…"},
  {"role": "user", "content": "Read main.go"},
  {"role": "assistant", "content": "…"},
  {"role": "user",
   "content": "Now add a test"}]}</pre></div>
  <div class="arrow" style="width:22px">→</div>
  <div class="col" style="width:470px"><h4>OpenRouter receives</h4>
<pre class="code"><span class="add">X-Session-Id: 9c3e5a…</span>  <span class="c">same for the whole conversation</span>

{"model": "anthropic/claude-opus-5.5",
 "messages": [
  {"role": "system", "content": [{"type": "text",
   "text": "You are a coding agent…",
   <span class="add">"cache_control": {"type": "ephemeral"}</span>}]},
  {"role": "user", "content": "Read main.go"},
  {"role": "assistant", "content": "…"},
  {"role": "user", "content": [{"type": "text",
   "text": "Now add a test",
   <span class="add">"cache_control": {"type": "ephemeral"}</span>}]}]}</pre></div>
</div>
<div class="strip"><span>Limits and levels, from OpenRouter's model list:</span><span class="mono">context 1,000,000 · output 128,000 · reasoning low, medium, high, xhigh, max</span></div>
</div>
</figure>

<figure id="pi">
<div class="term"><div class="bar"><i></i><i></i><i></i><span>pi 1.5.2 · /model, with pi-cliproxyapi-provider</span></div>
<pre><span class="mut">Scope: </span><span class="acc">all</span><span class="mut"> | scoped</span>
<span class="acc">→ </span><span class="acc">✓ </span><span class="acc">claude-opus-5-5</span><span class="mut"> (Claude Opus 5.5 · </span><span class="ok">Anthropic sub, fallback api</span><span class="mut">)</span> <span class="mut">[cliproxyapi]</span>
    claude-sonnet-5-5<span class="mut"> (Claude Sonnet 5.5 · </span><span class="ok">Anthropic sub, fallback api</span><span class="mut">)</span> <span class="mut">[cliproxyapi]</span>
    gpt-6.1-terra<span class="mut"> (GPT 6.1 Terra · </span><span class="ok">OpenAI sub</span><span class="mut">)</span> <span class="mut">[cliproxyapi]</span>
    anthropic/claude-opus-5.5<span class="mut"> (anthropic/claude-opus-5.5 · </span><span class="ok">OpenRouter api</span><span class="mut">)</span> <span class="mut">[cliproxyapi]</span>

<span class="mut">  Model Name: Claude Opus 5.5 · </span><span class="ok">Anthropic sub, fallback api</span></pre>
<p class="sect">The last line of pi's footer, with pi-cache-keeper</p>
<pre>cache warm · 59m left · <span class="ok">sub</span> · window <span class="ok">✓</span> · cache short <span class="ok">✓</span> · long <span class="ok">✓</span> (in use) · price <span class="dim">✗</span>
cache warm · 4m left · <span class="warn">api</span> · window <span class="ok">✓</span> · cache short <span class="ok">✓</span> (in use) · long <span class="ok">✓</span> · price <span class="dim">✗</span> · <span class="warn">⚠ answered by an API key</span></pre>
</div>
</figure>

<script>
// ?fig=<id> keeps one figure and reports its height once layout and fonts are ready; render-figures.mjs reads it.
const id = new URLSearchParams(location.search).get("fig");
if (id) {
	for (const figure of document.querySelectorAll("figure")) if (figure.id !== id) figure.remove();
	const figure = document.getElementById(id);
	figure.style.marginBottom = "0";
	document.fonts.ready.then(
		() => { document.body.dataset.height = String(Math.ceil(figure.getBoundingClientRect().height)); },
		(error) => { document.body.dataset.error = String(error); },
	);
}
</script>
</body></html>
