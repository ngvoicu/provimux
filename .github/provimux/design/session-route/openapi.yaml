openapi: 3.1.0
info:
  title: Provimux session routes
  version: "1"
  summary: Where a conversation is bound, and releasing it.
  description: |
    Contract 1 of `session-route.md` (beside this file). Four requests of Provimux's own. Stock
    CLIProxyAPI has none of them: a 404 means "not this build".

    **This release has the two client requests only** (decided by the lead on 2026-11-27). The
    operator's two requests (`/v8/management/provimux/session-routes`), the automatic return (the
    rule) and its setting are **not in this release**: they are described here for a later one and
    answer 404 now. In this release `rule` is always `{in_effect: false, will: stay}` and a cache's
    `basis` is always `setting`.

    With `routing.session-affinity: true` the gateway binds a conversation to the account that served
    it. These requests show that binding and remove it. Removing it sends nothing: the conversation's
    next request is routed as a new conversation's, to the first available route by priority.

    Rules of the contract:

    - It only grows. Fields are added, never removed or redefined. A reader ignores fields and enum
      values it does not know.
    - Unknown is `null`, never left out, except `account` on a route, which is absent where the build
      or the configuration gives no account marker.
    - Times are RFC 3339 in UTC. Durations are whole seconds.
    - A session id is never in a URL: a conversation is named by headers and by the body.
servers:
  - url: http://localhost:8317
    description: A local gateway. The port is the configuration's.
tags:
  - name: client
    description: For any configured client key. A key sees and releases only conversations it has used.
  - name: operator
    description: Behind the management key. Every binding. Not in this release.

paths:
  /v1/provimux/session-route:
    post:
      tags: [client]
      operationId: showSessionRoute
      summary: Where this conversation is bound for a name.
      description: |
        The conversation is named **as a turn names it**: send the session header your client sends
        on its turns (`Session-Id`, `X-Session-Affinity`, `X-Session-ID`, `X-Claude-Code-Session-Id`,
        ...), or put the body fields your turns carry their session in under `identity`. The gateway
        reads them with the function every turn goes through, so the identity is the binding's own.

        `model` is the name the client sends on its turns. The gateway resolves it as a turn's name is
        resolved before an account is chosen: `auto` becomes the model it routes to (with "serve only
        my names", the first of the owner's served names; else upstream's first available model; in
        Home mode it stays `auto`), and the answer gives that model as `routed_model`. A name a plugin's
        model router rewrote, which depends on the turn's body, is not resolved: ask under the name the
        router chose.

        A conversation another client key used and a conversation that does not exist get the same
        answer: `conversation: "not-seen"`. So does a conversation whose binding has expired: the
        gateway forgets it once its binding is gone and the binding's lifetime has passed.

        Nothing is changed by this request: no binding is made, moved or refreshed. Every call answers
        from the gateway's state at that moment, so calling it again is the way to check whether a
        higher-priority route has become free. It sends nothing to any account and ends no cooldown.
      security:
        - clientKey: []
      parameters:
        - $ref: "#/components/parameters/SessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowRequest"
            examples:
              pi-claude-format:
                summary: Pi on a Claude-format model (header X-Session-Affinity)
                value: { model: opus }
              body-identity:
                summary: A client whose turns carry prompt_cache_key
                value:
                  model: gpt-main
                  identity: { prompt_cache_key: project-a }
      responses:
        "200":
          description: The state of the conversation for the name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRoute"
              examples:
                fell-back-cache-cold:
                  $ref: "#/components/examples/FellBackCacheCold"
                fell-back-first-route-cooling:
                  $ref: "#/components/examples/FellBackFirstRouteCooling"
                on-first-route:
                  $ref: "#/components/examples/OnFirstRoute"
                bound-to-unlisted:
                  $ref: "#/components/examples/BoundToUnlisted"
                not-seen:
                  $ref: "#/components/examples/NotSeen"
                affinity-off:
                  $ref: "#/components/examples/AffinityOff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/provimux/session-route/release:
    post:
      tags: [client]
      operationId: releaseSessionRoute
      summary: Remove this conversation's binding for a name.
      description: |
        The conversation's next request for the name is routed as a new conversation's: to the first
        available route by priority, among the accounts that request may use. Nothing is sent to any
        account by this request.

        An answer in flight finishes where it started. If, before it ends, the conversation is bound
        again to the same login and that answer then fails with a fault of that login, upstream removes
        the newer binding too (it removes a binding to a login that just failed); the conversation is
        bound afresh at its next message. A binding to another login is left alone.

        On a Codex WebSocket (decided by the lead on 2026-11-27): a release holds only if that
        connection is closed **before its next turn**. A turn on the open connection is pinned to the
        login that served it and binds the conversation to that login again, and closing the
        connection afterwards does not undo that: release again, then close. `websocket_may_hold` says
        when this applies.

        A sub-agent keeps its own binding. One started after a release inherits its parent's binding
        as upstream does: if the parent has been bound again on the lower login by then, the child
        goes there too.

        With `expect`, only exactly the binding that token stands for is released; else `409`.
        Releasing what is not bound is not an error: `released: false`.
      security:
        - clientKey: []
      parameters:
        - $ref: "#/components/parameters/SessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseRequest"
            examples:
              after-show:
                value: { model: opus, expect: "b.k3v7q2mfx4ardn5w" }
      responses:
        "200":
          description: What was done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
              examples:
                released:
                  $ref: "#/components/examples/Released"
                nothing-bound:
                  $ref: "#/components/examples/NothingBound"
                not-seen:
                  $ref: "#/components/examples/ReleaseNotSeen"
                affinity-off:
                  $ref: "#/components/examples/ReleaseAffinityOff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            `expect` was given and the binding is no longer the one it stands for: the conversation was
            routed again since the show (a turn, even on the same account), moved, or was released and
            bound again. Nothing was released. The body is the state now, with the current token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRoute"

  /v8/management/provimux/session-routes:
    get:
      tags: [operator]
      operationId: listSessionRoutes
      summary: The rule's setting, the value in use, and every binding. Not in this release.
      description: |
        **Not in this release** (404). Read-only, from memory. `setting` is what is set; `in_effect` and `reason` are what holds.
        `conversations` lists the bindings of the session cache and the conversations the gateway
        recognises by their content, newest answer first, at most `limit`.
      security:
        - managementKey: []
      parameters:
        - name: below_first
          in: query
          description: "`true`: only conversations below their first route."
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000, default: 200 }
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRoutesState"
              examples:
                in-effect:
                  $ref: "#/components/examples/StateInEffect"
                affinity-off:
                  $ref: "#/components/examples/StateAffinityOff"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v8/management/provimux/session-routes/release:
    post:
      tags: [operator]
      operationId: releaseSessionRouteByHandle
      summary: Remove one binding, by its handle from the list. Not in this release.
      description: "**Not in this release** (404)."
      security:
        - managementKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id:
                  type: string
                  description: A conversation's `id` from the list. It stands for that binding on that account.
            examples:
              one:
                value: { id: "c.5tq2hb7yw3mdk4zn" }
      responses:
        "200":
          description: "What was done. A handle whose binding is gone or has moved answers `released: false`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    clientKey:
      type: http
      scheme: bearer
      description: A configured client key, sent as on any model request.
    managementKey:
      type: http
      scheme: bearer
      description: The management key.

  parameters:
    SessionHeader:
      name: X-Session-Affinity
      in: header
      required: false
      description: |
        Stands for whichever session header the client's turns carry; the gateway reads all of them,
        in upstream's order: `X-Claude-Code-Session-Id` (with `X-Claude-Code-Agent-Id`), `Session-Id`,
        `Thread-Id`, `X-Http-Session-Id`, `X-Session-ID`, `X-Session-Affinity`, `X-Slot-Session-Id`,
        `X-Task-ID`, `X-Conversation-Id`, `X-Thread-Id`, `X-Client-Request-Id`. Send exactly what a
        turn sends, and nothing a turn does not.
      schema: { type: string, maxLength: 256 }
      example: 0c9b1f0e-6a51-4c58-9b1e-2f6f3f1f7a10

  responses:
    BadRequest:
      description: |
        The body is read strictly (G1, after the review): one JSON object and nothing after it, each
        field at most once, no field the schema does not name. `400` for: a body that does not parse,
        is not an object, or has anything after the object; a field given twice or unknown; `model`
        absent, not a string, `null`, or empty or blank; `identity` present and not an object
        (`null` included); `expect` on a show; on a release, `expect` present and not a well-formed
        token (empty, blank, `null`, not a string, or not `b.` and 16 characters); a body over 64 KiB.
        Also a name this gateway does not serve to this key (with "serve only my names", the
        setting's own message, as a turn for the name gets). A refused request changes nothing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No key, or a key the gateway does not know.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          description: The gateway's error, in the shape of the route group it was sent to.

    ShowRequest:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model:
          type: string
          minLength: 1
          description: The name, as the client sends it on a turn. A thinking suffix is ignored, as on a turn.
        identity:
          $ref: "#/components/schemas/Identity"

    ReleaseRequest:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model:
          type: string
          minLength: 1
        identity:
          $ref: "#/components/schemas/Identity"
        expect:
          type: string
          pattern: "^b\\.[a-z2-7]{16}$"
          description: |
            `binding` from a show. With it, the release happens only while the binding is still exactly
            that one: the token is computed again from the binding as it is and compared at the moment
            of the removal; else `409` and nothing is released. Without it, whatever is bound is
            released. Present, it must be a well-formed token: an empty, blank or `null` `expect` is
            `400`, never taken as absent.

    Identity:
      type: object
      description: |
        Only for a client whose turns name their conversation in the body. The fields a turn carries
        its session in, copied as they are; the gateway reads this object as it reads a turn's body.
        Read in upstream's order: `metadata.user_id` (Claude Code's), `cachedContent`, `thread_id`,
        `session_id`, `prompt_cache_key`, `conversation`, `conversation_id`. Anything else is ignored.
      additionalProperties: true
      examples:
        - { prompt_cache_key: project-a }
        - { metadata: { user_id: "user_abc_account__session_0c9b1f0e-6a51-4c58-9b1e-2f6f3f1f7a10" } }

    Route:
      type: object
      description: |
        One account that serves the name, exactly as a row of `GET /v1/models?include=accounts`
        gives it. Nothing here identifies the account to a reader except as "the same" or "not the
        same" (`account`).
      required: [provider, kind, priority]
      properties:
        provider:
          type: string
          examples: [claude, codex, openai-compatibility]
        kind:
          type: string
          description: |
            `oauth`: a subscription login. `apikey`: an API key. Empty where the gateway cannot tell (a
            credential with neither a key nor a login's tokens), exactly as the list gives it (added in G1).
          enum: [oauth, apikey, ""]
        priority:
          type: integer
          description: Higher is tried first.
        host:
          type: string
          description: The host of an API key's base URL, where it has one.
        account:
          type: string
          pattern: "^[as]\\.[a-z2-7]{20}$"
          description: |
            The account marker (`answered-by.md`): the value of `X-Provimux-Account` on this account's
            answers. Absent where the build has no marker or `models.answered-by` is off.

    UnlistedRoute:
      type: object
      additionalProperties: false
      description: |
        The account a binding names, where `GET /v1/models?include=accounts` does not show it now for
        this name (disabled, or no longer serving the name): nothing of it is given (added in G1, after
        the review).
      required: [listed]
      properties:
        listed:
          type: boolean
          enum: [false]

    OperatorRoute:
      description: A route as the operator sees it, with what `model-routes` already shows him.
      allOf:
        - $ref: "#/components/schemas/Route"
        - type: object
          required: [auth_index, login, recorded_cooldown]
          properties:
            auth_index:
              type: [string, "null"]
            login:
              type: object
              description: As `ModelRoute.login` of `pui13/openapi.yaml`.
              required: [name, email, label]
              properties:
                name: { type: [string, "null"] }
                email: { type: [string, "null"] }
                label: { type: [string, "null"] }
            recorded_cooldown:
              description: As `ModelRoute.recorded_cooldown` of `pui13/openapi.yaml`; `null` when none is recorded.
              type: [object, "null"]

    Cache:
      type: object
      description: How long the gateway takes this conversation's cache on the bound account to live.
      required: [lifetime_s, basis, entry, last_use_at, cold, cold_at]
      properties:
        lifetime_s:
          type: integer
          minimum: 0
        basis:
          type: string
          description: |
            `answers`: what this conversation's own answers on the bound account reported writing
            (3,600 or 300). `figures`: the largest lifetime providers.dev's figures state for the entry
            the account last answered this name as. `setting`: `cold-after`. In this release always
            `setting`, with its default hour: the other sources are not in this release.
          enum: [answers, figures, setting]
        entry:
          type: [string, "null"]
          description: With `figures`, the providers.dev entry, `<provider>/<model>`. Else `null`. Always `null` in this release.
        last_use_at:
          type: string
          format: date-time
          description: The conversation's last request or answer on the binding, whichever is later.
        cold:
          type: boolean
          description: "`last_use_at` is further back than `lifetime_s` plus 60 seconds."
        cold_at:
          type: string
          format: date-time
          description: When it is, or was, cold by that measure.

    SessionRoute:
      type: object
      required: [observed_at, affinity, conversation, model, routed_model, binding, bound, position, first, cache, rule, websocket_may_hold, subagent]
      properties:
        observed_at:
          type: string
          format: date-time
        affinity:
          type: string
          description: |
            Session affinity as it runs. `on`. `off`: `routing.session-affinity` is false; nothing is
            ever bound. `home`: Home mode; Home selects. `not-supported`: a plugin schedules.
            Anything but `on`: `conversation` is `not-bound` and every other field is empty.
          enum: ["on", "off", home, not-supported]
        conversation:
          type: string
          description: |
            `bound`. `not-bound`: this key has used the conversation and it has no binding for the
            name now (released, expired, or never bound). `not-seen`: the gateway has seen no request
            of this conversation from this key since it started, or has forgotten it (its binding
            expired), or cannot name a conversation from what was sent. A turn is seen once its
            result is recorded, right after its last byte: a show sent the instant a streamed turn
            ends may come just before, and answers as if the turn had not been sent yet.
          enum: [bound, not-bound, not-seen]
        model:
          type: string
          description: The name asked about, without a thinking suffix.
        routed_model:
          type: [string, "null"]
          description: |
            The model the name is routed to, without a thinking suffix, where the request path routes it
            to another (`auto`): a model of `GET /v1/models`. `null` when the name is routed as it is.
            Added in G1, after the review.
        binding:
          type: [string, "null"]
          pattern: "^b\\.[a-z2-7]{16}$"
          description: |
            A token for exactly this binding, for `expect`: the conversation, the account, and the
            selection that made or last chose the binding. Every turn of the conversation is a new
            selection, so after a turn the token is another (show again); so it is after a release and
            a new binding, even on the same account. `null` unless `bound`.
        bound:
          type: [object, "null"]
          description: "`null` unless `bound`."
          required: [route, since, origin, fell_back_from, fell_back_at]
          properties:
            route:
              description: "The bound account as the list shows it, or `{listed: false}` where the list does not show it now."
              oneOf:
                - $ref: "#/components/schemas/Route"
                - $ref: "#/components/schemas/UnlistedRoute"
            since:
              type: [string, "null"]
              format: date-time
              description: When this account first answered the conversation in this stretch. `null` after a gateway restart, until its next answer.
            origin:
              type: string
              description: |
                `first`: the gateway has seen no other account answer this conversation.
                `fallback`: another account answered it before this one. `not-known`: after a restart.
              enum: [first, fallback, not-known]
            fell_back_from:
              description: "With `fallback`, the route that answered before (or `{listed: false}`). Else `null`."
              oneOf:
                - $ref: "#/components/schemas/Route"
                - $ref: "#/components/schemas/UnlistedRoute"
                - type: "null"
            fell_back_at:
              type: [string, "null"]
              format: date-time
        position:
          type: [object, "null"]
          description: "`null` unless `bound` to an account the list shows (G1, after the review: nothing is said of an unlisted account's place)."
          required: [below_first, higher_priority_free, higher_priority_free_at]
          properties:
            below_first:
              type: boolean
              description: The bound account's priority is lower than the highest priority that serves the name.
            higher_priority_free:
              type: boolean
              description: |
                An account of a higher priority than the bound one is available now. The one fact here
                that no list shows: it is said about the name, never per account.
            higher_priority_free_at:
              type: [string, "null"]
              format: date-time
              description: |
                Added by the lead on 2026-11-27. When a higher-priority route is expected free: the end of
                the recorded cooldown that ends first among the accounts of a higher priority than the
                bound one. One time for the name, never per account. `null` when one is free now
                (`higher_priority_free`), when none of them has a recorded cooldown end (disabled, an
                expired token, no higher account), or when nothing is bound.
        first:
          type: array
          description: |
            The first routes now, as the list shows them: the accounts of the highest available priority
            for the name. A released conversation's next request goes to one of them unless that request
            may not use it (a request that may not use a free account, a provider the request does not
            reach) or it cools in between; which of several is chosen is the strategy's. Empty unless
            `bound`.
          items:
            $ref: "#/components/schemas/Route"
        cache:
          description: "`null` unless `bound`."
          oneOf:
            - $ref: "#/components/schemas/Cache"
            - type: "null"
        rule:
          type: object
          description: "What the gateway does by itself with this binding. Not in this release: always `{in_effect: false, will: stay}`."
          required: [in_effect, will]
          properties:
            in_effect:
              type: boolean
              description: Whether `routing.session-affinity-return` runs.
            will:
              type: string
              description: |
                `return-when-cold`: below a free higher-priority route; released once `cache.cold`.
                `return-when-free`: below its first route and cold, or soon cold; released once a
                higher-priority account is available. `stay`: on a first route, or the rule is not
                in effect, or nothing is bound.
              enum: [return-when-cold, return-when-free, stay]
        websocket_may_hold:
          type: boolean
          description: |
            A turn of this conversation came on a connection pinned to its login (a Codex WebSocket), or
            it is named by Codex headers; whatever header names it. On such a connection a release
            holds only if the connection is closed before its next turn: a turn on the open connection
            binds the conversation to the old login again, and closing afterwards does not undo that
            (release again, then close). Decided by the lead on 2026-11-27.
        subagent:
          type: boolean
          description: |
            The conversation is a sub-agent's: it has a parent conversation (a fork is not a sub-agent).
            A parent's release does not move it. A sub-agent started after the parent's release inherits
            the parent's binding as upstream does: where the parent was bound again on the lower login,
            the child goes there too.

    Release:
      type: object
      required: [observed_at, affinity, released, conversation, model, routed_model, was, next, websocket_may_hold]
      properties:
        observed_at:
          type: string
          format: date-time
        affinity:
          type: string
          description: |
            Session affinity as it runs, as in a show. Anything but `on`: nothing is bound, nothing is
            released, and this says why. Added in G1, so that the release says why as the show does.
          enum: ["on", "off", home, not-supported]
        released:
          type: boolean
        conversation:
          type: string
          description: The state after the request. `not-bound` after a release; else as in a show.
          enum: [not-bound, not-seen]
        model:
          type: string
          description: As in a show. Added in G1, after the review.
        routed_model:
          type: [string, "null"]
          description: As in a show. Added in G1, after the review.
        was:
          description: "The route the binding named (or `{listed: false}`). `null` when nothing was released."
          oneOf:
            - $ref: "#/components/schemas/Route"
            - $ref: "#/components/schemas/UnlistedRoute"
            - type: "null"
        next:
          type: array
          description: "The first routes now, as in a show's `first`: where the next request goes while they stay available and it may use them."
          items:
            $ref: "#/components/schemas/Route"
        websocket_may_hold:
          type: boolean
          description: As in a show. With `true`, close the connection before its next turn, or the release is undone.

    SessionRoutesState:
      type: object
      required: [observed_at, setting, in_effect, reason, affinity, lifetimes, counts, conversations, truncated]
      properties:
        observed_at:
          type: string
          format: date-time
        setting:
          type: object
          description: "`routing.session-affinity-return` as it applies."
          required: [enabled, set, cold_after_s, cold_after_set]
          properties:
            enabled:
              type: boolean
              description: "The value as it applies: `true` unless the configuration says `false`."
            set:
              type: boolean
              description: Whether the configuration sets `enabled`.
            cold_after_s:
              type: integer
              minimum: 60
              description: "`cold-after` as it applies: 3,600 unless set."
            cold_after_set:
              type: boolean
        in_effect:
          type: boolean
          description: Whether the rule runs now. This, not `setting.enabled`, is the value in use.
        reason:
          type: [string, "null"]
          description: Why not, when not in effect. `null` when in effect.
          enum: [session-affinity-off, home-mode, plugin-scheduler, switch-off, null]
        affinity:
          type: object
          description: Upstream's settings the rule depends on, as they run.
          required: [enabled, ttl_s, strategy, subagents, rebind_on]
          properties:
            enabled: { type: boolean }
            ttl_s: { type: integer }
            strategy:
              type: string
              enum: [round-robin, fill-first, weighted-round-robin]
            subagents: { type: boolean }
            rebind_on:
              type: string
              enum: [any, quota, never]
        lifetimes:
          type: array
          description: The sources of a cache lifetime this build has, in the order they are tried.
          items:
            type: string
            enum: [answers, figures, setting]
        counts:
          type: object
          required: [bound, below_first, released_by_rule, released_by_client, released_by_operator, last_rule_release_at, since]
          properties:
            bound:
              type: integer
              description: Bindings now.
            below_first:
              type: integer
              description: Of those, below their first route now.
            released_by_rule: { type: integer }
            released_by_client: { type: integer }
            released_by_operator: { type: integer }
            last_rule_release_at:
              type: [string, "null"]
              format: date-time
            since:
              type: string
              format: date-time
              description: "When the counting started: the gateway's start."
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/OperatorConversation"
        truncated:
          type: boolean
          description: More conversations exist than `limit` allowed.

    OperatorConversation:
      type: object
      required: [id, session, named_by, model, bound, since, origin, fell_back_from, fell_back_at, below_first, higher_priority_free, first, cache, will, subagent, callers]
      properties:
        id:
          type: string
          description: A handle for the release request. It stands for this binding on this account.
        session:
          type: string
          description: The first 8 characters of the session id, after its prefix. Never the whole id.
        named_by:
          type: string
          description: |
            What names the conversation: the prefix of its identity (`claude`, `codex`, `affinity`,
            `header`, `pck`, ...), or `content` for one the gateway recognises by its content only.
        model:
          type: string
        bound:
          $ref: "#/components/schemas/OperatorRoute"
        since:
          type: [string, "null"]
          format: date-time
        origin:
          type: string
          enum: [first, fallback, not-known]
        fell_back_from:
          oneOf:
            - $ref: "#/components/schemas/OperatorRoute"
            - type: "null"
        fell_back_at:
          type: [string, "null"]
          format: date-time
        below_first:
          type: boolean
        higher_priority_free:
          type: boolean
        first:
          type: array
          items:
            $ref: "#/components/schemas/OperatorRoute"
        cache:
          $ref: "#/components/schemas/Cache"
        will:
          type: string
          enum: [return-when-cold, return-when-free, stay]
        subagent:
          type: boolean
        callers:
          type: integer
          description: How many client keys the gateway has seen use it since the start. 0 after a restart, until its next answer.

