openapi: 3.1.0
info:
  title: Provimux session routes
  version: "1"
  summary: Where a conversation is bound, and releasing it.
  description: |
    Contract 1 of `session-route.md` (beside this file). Three requests of Provimux's own. Stock
    CLIProxyAPI has none of them: a 404 means "not this build".

    Amended 2026-11-27 with the second design of the rule (not in this repository): the operator's
    list of bindings and its release are withdrawn, as is the object `cache` of the show; the rule's
    state is `GET /v8/management/provimux/session-return`. None of the withdrawn parts was released.

    **This release has the two client requests only** (decided on 2026-11-27). The rule
    and its state request are **not in this release** (the state request is described with the rule,
    in its own later step, and answers 404 now): in this release the show's `rule` is always
    `{in_effect: false, cold_after_s: null}`.

    With `routing.session-affinity: true` the gateway binds a conversation to the account that served
    it. These requests show that binding and remove it. Removing it sends nothing: the conversation's
    next request is routed as a new conversation's, to the first available route by priority.

    Rules of the contract:

    - It only grows. Fields are added, never removed or redefined. A reader ignores fields and enum
      values it does not know.
    - Unknown is `null`, never left out, except `account` on a route, which is absent where the build
      or the configuration gives no account marker.
    - Times are RFC 3339 in UTC. Durations are whole seconds, except `cold_after_s`, which is the
      operator's time with its fraction (`1m0.9s` is 60.9).
    - A session id is never in a URL: a conversation is named by headers and by the body.
servers:
  - url: http://localhost:8317
    description: A local gateway. The port is the configuration's.
tags:
  - name: client
    description: For any configured client key. A key sees and releases only conversations it has used.
  - name: operator
    description: Behind the management key. The rule's state.

paths:
  /v1/provimux/session-route:
    post:
      tags: [client]
      operationId: showSessionRoute
      summary: Where this conversation is bound for a name.
      description: |
        The conversation is named **as a turn names it**: send the session header your client sends
        on its turns (`Session-Id`, `X-Session-Affinity`, `X-Session-ID`, `X-Claude-Code-Session-Id`,
        ...), or put the body fields your turns carry their session in under `identity`. The gateway
        reads them with the function every turn goes through, so the identity is the binding's own.

        `model` is the name the client sends on its turns. The gateway resolves it as a turn's name is
        resolved before an account is chosen: `auto` becomes the model it routes to (with "serve only
        my names", the first of the owner's served names; else upstream's first available model; in
        Home mode it stays `auto`), and the answer gives that model as `routed_model`. Asking under the
        name sent finds the turn for a plain name, and for `auto` while the catalog's first model is
        the one it was when the turn was sent. After the catalog changed, or where a plugin's model
        router rewrote the name (it reads the turn's body, so a show cannot), ask under the model the
        turn was routed to: the `routed_model` an earlier answer named, or the router's target.

        A conversation another client key used and a conversation that does not exist get the same
        answer: `conversation: "not-seen"`. So does a conversation whose binding has expired: the
        gateway forgets it once its binding is gone and the binding's lifetime has passed.

        Nothing is changed by this request: no binding is made, moved or refreshed. Every call answers
        from the gateway's state at that moment, so calling it again is the way to check whether a
        higher-priority route has become free. It sends nothing to any account and ends no cooldown.
      security:
        - clientKey: []
      parameters:
        - $ref: "#/components/parameters/SessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowRequest"
            examples:
              pi-claude-format:
                summary: Pi on a Claude-format model (header X-Session-Affinity)
                value: { model: opus }
              body-identity:
                summary: A client whose turns carry prompt_cache_key
                value:
                  model: gpt-main
                  identity: { prompt_cache_key: project-a }
      responses:
        "200":
          description: The state of the conversation for the name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRoute"
              examples:
                fell-back-cache-cold:
                  $ref: "#/components/examples/FellBackCacheCold"
                fell-back-first-route-cooling:
                  $ref: "#/components/examples/FellBackFirstRouteCooling"
                on-first-route:
                  $ref: "#/components/examples/OnFirstRoute"
                bound-to-unlisted:
                  $ref: "#/components/examples/BoundToUnlisted"
                not-seen:
                  $ref: "#/components/examples/NotSeen"
                affinity-off:
                  $ref: "#/components/examples/AffinityOff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/provimux/session-route/release:
    post:
      tags: [client]
      operationId: releaseSessionRoute
      summary: Remove this conversation's binding for a name.
      description: |
        The conversation's next request for the name is routed as a new conversation's: to the first
        available route by priority, among the accounts that request may use. Nothing is sent to any
        account by this request.

        An answer in flight finishes where it started. Under the default rebind policy, if before it
        ends the conversation is bound again to the same login and that answer then fails with a fault
        of that login, upstream removes the newer binding too (it removes a binding to a login that just
        failed), and the conversation is bound afresh at its next message; with
        `session-affinity-rebind-on: never` the newer binding stays. A binding to another login is left
        alone.

        On a Codex WebSocket (decided on 2026-11-27): a release holds only if that
        connection is closed **before its next turn**. A turn on the open connection is pinned to the
        login that served it and binds the conversation to that login again, and closing the
        connection afterwards does not undo that: release again, then close. `websocket_may_hold` says
        when this applies.

        A sub-agent keeps its own binding. With sub-agent inheritance on (upstream's default), a
        released sub-agent's next turn takes its parent's binding again, even where the show named a
        higher account as first, and a sub-agent started after a release takes its parent's binding
        as it is then. With inheritance off, a new sub-agent is routed on its own.

        With `expect`, only the life of the binding that token names is released (`expect`, below);
        else `409`. Releasing what is not bound is not an error: `released: false`.
      security:
        - clientKey: []
      parameters:
        - $ref: "#/components/parameters/SessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseRequest"
            examples:
              after-show:
                value: { model: opus, expect: "b.k3v7q2mfx4ardn5w" }
      responses:
        "200":
          description: What was done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
              examples:
                released:
                  $ref: "#/components/examples/Released"
                nothing-bound:
                  $ref: "#/components/examples/NothingBound"
                not-seen:
                  $ref: "#/components/examples/ReleaseNotSeen"
                affinity-off:
                  $ref: "#/components/examples/ReleaseAffinityOff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            `expect` was given and the binding is no longer the one it stands for (the conversation
            moved, or was released and bound again, on the same account too), or the string names no
            life of it. Nothing was released. The body is the state now, with the current token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRoute"

  /v8/management/provimux/session-return:
    get:
      tags: [operator]
      operationId: showSessionReturn
      summary: The rule's setting and the value in use.
      description: |
        Read-only, from memory. `setting` is what the configuration says; `in_effect` and `reason`
        are what holds. `counts.returned` is exact: it is raised in the same step that drops a
        binding. There is no list of bindings and no release here (design section 15.5).

        A change of the setting takes effect for selections that read the configuration after the
        commit; a selection already underway can finish using the previous value. Every change of
        the value in use starts a new observation: a conversation's first message after it is not
        judged.
      security:
        - managementKey: []
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReturnState"
              examples:
                in-effect:
                  $ref: "#/components/examples/ReturnInEffect"
                as-installed:
                  $ref: "#/components/examples/ReturnAsInstalled"
                not-set:
                  $ref: "#/components/examples/ReturnNotSet"
                not-below-ttl:
                  $ref: "#/components/examples/ReturnNotBelowTTL"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    clientKey:
      type: http
      scheme: bearer
      description: A configured client key, sent as on any model request.
    managementKey:
      type: http
      scheme: bearer
      description: The management key.

  parameters:
    SessionHeader:
      name: X-Session-Affinity
      in: header
      required: false
      description: |
        Stands for whichever session header the client's turns carry; the gateway reads all of them,
        in upstream's order: `X-Claude-Code-Session-Id` (with `X-Claude-Code-Agent-Id`), `Session-Id`,
        `Thread-Id`, `X-Http-Session-Id`, `X-Session-ID`, `X-Session-Affinity`, `X-Slot-Session-Id`,
        `X-Task-ID`, `X-Conversation-Id`, `X-Thread-Id`, `X-Client-Request-Id`. Send exactly what a
        turn sends, and nothing a turn does not.
      schema: { type: string, maxLength: 256 }
      example: 0c9b1f0e-6a51-4c58-9b1e-2f6f3f1f7a10

  responses:
    BadRequest:
      description: |
        The body is read strictly (after the review): one JSON object and nothing after it, each
        field at most once, no field the schema does not name. `400` for: a body that does not parse,
        is not an object, or has anything after the object; a field given twice or unknown; `model`
        absent, not a string, `null`, or empty or blank; `identity` present and not an object
        (`null` included); `expect` on a show; on a release, `expect` present and empty, `null` or
        not a string (a non-empty string that names no life of the binding is `409`); a body over
        64 KiB.
        Also a name this gateway does not serve to this key (with "serve only my names", the
        setting's own message, as a turn for the name gets). A refused request changes nothing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No key, or a key the gateway does not know.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: true
      description: |
        In the shape of the route group the request was sent to: `/v1` puts an object under `error`;
        `/v8/management` puts a code under `error` and the words under `message`.
      properties:
        error:
          description: The gateway's error, in the shape of the route group it was sent to.

    ShowRequest:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model:
          type: string
          minLength: 1
          description: The name, as the client sends it on a turn. A thinking suffix is ignored, as on a turn.
        identity:
          $ref: "#/components/schemas/Identity"

    ReleaseRequest:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model:
          type: string
          minLength: 1
        identity:
          $ref: "#/components/schemas/Identity"
        expect:
          type: string
          minLength: 1
          description: |
            `binding` from a show. It names one life of the binding: from the answer after which the
            gateway first held it for this conversation, to its removal by anyone. With it, the
            release happens only while that life lasts; a binding that was removed and made again,
            on the same account too, is another, and the answer is `409`. A binding that ended by
            its own lifetime and was made again on the same account counts as the same. Without
            `expect`, whatever is bound is released. An empty string, `null`, or a body that is not
            exactly one object of this schema is refused with `400`. (As built: the life is checked
            and the binding removed under one lock, in that order; a non-empty string that names no
            life of the binding, a blank one included, is `409`.)

    Identity:
      type: object
      description: |
        Only for a client whose turns name their conversation in the body. The fields a turn carries
        its session in, copied as they are; the gateway reads this object as it reads a turn's body.
        Read in upstream's order: `metadata.user_id` (Claude Code's), `cachedContent`, `thread_id`,
        `session_id`, `prompt_cache_key`, `conversation`, `conversation_id`. Anything else is ignored.
      additionalProperties: true
      examples:
        - { prompt_cache_key: project-a }
        - { metadata: { user_id: "user_abc_account__session_0c9b1f0e-6a51-4c58-9b1e-2f6f3f1f7a10" } }

    Route:
      type: object
      description: |
        One account that serves the name, exactly as a row of `GET /v1/models?include=accounts`
        gives it. Nothing here identifies the account to a reader except as "the same" or "not the
        same" (`account`).
      required: [provider, kind, priority]
      properties:
        provider:
          type: string
          examples: [claude, codex, openai-compatibility]
        kind:
          type: string
          description: |
            `oauth`: a subscription login. `apikey`: an API key. Empty where the gateway cannot tell (a
            credential with neither a key nor a login's tokens), exactly as the list gives it.
          enum: [oauth, apikey, ""]
        priority:
          type: integer
          description: Higher is tried first.
        host:
          type: string
          description: The host of an API key's base URL, where it has one.
        account:
          type: string
          pattern: "^[as]\\.[a-z2-7]{20}$"
          description: |
            The account marker (`answered-by.md`): the value of `X-Provimux-Account` on this account's
            answers. Absent where the build has no marker or `models.answered-by` is off.

    UnlistedRoute:
      type: object
      additionalProperties: false
      description: |
        The account a binding names, where `GET /v1/models?include=accounts` does not show it now for
        this name (disabled, or no longer serving the name): nothing of it is given (added after
        the review).
      required: [listed]
      properties:
        listed:
          type: boolean
          enum: [false]

    SessionRoute:
      type: object
      required: [observed_at, affinity, conversation, model, routed_model, binding, bound, position, first, rule, websocket_may_hold, subagent]
      properties:
        observed_at:
          type: string
          format: date-time
        affinity:
          type: string
          description: |
            Session affinity as it runs. `on`. `off`: `routing.session-affinity` is false; nothing is
            ever bound. `home`: Home mode; Home selects. `not-supported`: a plugin schedules.
            Anything but `on`: `conversation` is `not-bound` and every other field is empty.
          enum: ["on", "off", home, not-supported]
        conversation:
          type: string
          description: |
            `bound`. `not-bound`: this key has used the conversation and it has no binding for the
            name now (released, expired, or never bound). `not-seen`: the gateway has seen no request
            of this conversation from this key since it started, or has forgotten it (its binding
            expired), or cannot name a conversation from what was sent. A turn is seen once its
            result is recorded, right after its last byte: a show sent the instant a streamed turn
            ends can come just before, and then answers as if the turn had not been sent yet.
          enum: [bound, not-bound, not-seen]
        model:
          type: string
          description: The name asked about, without a thinking suffix.
        routed_model:
          type: [string, "null"]
          description: |
            The model the name is routed to, without a thinking suffix, where the request path routes it
            to another (`auto`): a model of `GET /v1/models`. `null` when the name is routed as it is.
        binding:
          type: [string, "null"]
          description: |
            A token for this binding's life, for `expect` (`ReleaseRequest.expect`): the same through
            every turn on it; another once it was removed and made again. `null` unless `bound`, and
            `null` while the gateway has not yet seen an answer on the binding (it is bound, but its
            life has not started).
        bound:
          type: [object, "null"]
          description: "`null` unless `bound`."
          required: [route, since, origin, fell_back_from, fell_back_at]
          properties:
            route:
              description: "The bound account as the list shows it, or `{listed: false}` where the list does not show it now."
              oneOf:
                - $ref: "#/components/schemas/Route"
                - $ref: "#/components/schemas/UnlistedRoute"
            since:
              type: [string, "null"]
              format: date-time
              description: When this account first answered the conversation in this stretch. `null` after a gateway restart, until its next answer.
            origin:
              type: string
              description: |
                `first`: the gateway has seen no other account answer this conversation.
                `fallback`: another account answered it before this one. `not-known`: after a restart.
              enum: [first, fallback, not-known]
            fell_back_from:
              description: "With `fallback`, the route that answered before (or `{listed: false}`). Else `null`."
              oneOf:
                - $ref: "#/components/schemas/Route"
                - $ref: "#/components/schemas/UnlistedRoute"
                - type: "null"
            fell_back_at:
              type: [string, "null"]
              format: date-time
        position:
          type: [object, "null"]
          description: "`null` unless `bound` to an account the list shows (after the review: nothing is said of an unlisted account's place)."
          required: [below_first, higher_priority_free, higher_priority_free_at]
          properties:
            below_first:
              type: boolean
              description: The bound account's priority is lower than the highest priority that serves the name.
            higher_priority_free:
              type: boolean
              description: |
                An account of a higher priority than the bound one is available now. The one fact here
                that no list shows: it is said about the name, never per account.
            higher_priority_free_at:
              type: [string, "null"]
              format: date-time
              description: |
                Added on 2026-11-27. When a higher-priority route is expected free: the end of
                the recorded cooldown that ends first among the accounts of a higher priority than the
                bound one. One time for the name, never per account. `null` when one is free now
                (`higher_priority_free`), when none of them has a recorded cooldown end (disabled, an
                expired token, no higher account), or when nothing is bound.
        first:
          type: array
          description: |
            The first routes now, as the list shows them: the accounts of the highest available priority
            for the name. A released conversation's next request goes to one of them unless that request
            may not use it (a request that may not use a free account, a provider the request does not
            reach) or it cools in between; which of several is chosen is the strategy's. Empty unless
            `bound`.
          items:
            $ref: "#/components/schemas/Route"
        rule:
          type: object
          description: |
            What the gateway does by itself (the second design of the rule). With `in_effect`: at this
            conversation's next request, if it is bound to an account below the highest-priority
            account that request may use, and no message of it was routed to an account for `cold_after_s`, the binding is
            dropped and the request is routed as a new conversation's. It is decided at that request,
            from that request's own accounts, so no show can say beforehand that it will happen. Never
            for a sub-agent or a fork, a pinned turn, or a conversation the client did not name.
            The object `cache` of an earlier draft of this contract is withdrawn: the gateway states
            no cache's lifetime. The rule never moves a conversation that had a message routed to an
            account within `cold_after_s`. A message the gateway refused before choosing an account
            (for example while every account that serves the name is cooling) reaches no provider and
            reads no cache, so it does not count as use; nor does an answer while it streams, so the
            message after an answer that itself took longer than `cold_after_s` can go back. A
            provider's prompt cache is refreshed when a request reads it, not while the answer is
            written. The gateway cannot see how long a provider keeps a cache, so the operator
            chooses the time. Any binding below a higher priority
            this request may use can return, also after the operator adds a higher-priority account.
            The rule sends no request to any provider.
          required: [in_effect, cold_after_s]
          properties:
            in_effect:
              type: boolean
              description: |
                Whether the rule runs (`routing.session-affinity-return.cold-after` is set and applies):
                the state request's `in_effect`.
            cold_after_s:
              type: [number, "null"]
              description: |
                The operator's time, in seconds with its fraction; `null` when not set. Given also when
                the rule is not in effect (the state request says why).
        websocket_may_hold:
          type: boolean
          description: |
            A turn of this conversation came on a connection pinned to its login (a Codex WebSocket), or
            it is named by Codex headers; whatever header names it. On such a connection a release
            holds only if the connection is closed before its next turn: a turn on the open connection
            binds the conversation to the old login again, and closing afterwards does not undo that
            (release again, then close). Decided on 2026-11-27.
        subagent:
          type: boolean
          description: |
            The conversation is a sub-agent's: it has a parent conversation (a fork is not a sub-agent).
            A parent's release does not move it. With sub-agent inheritance on (upstream's default), its
            next turn after its own release takes its parent's binding again, even where the show named
            a higher account as first; with inheritance off, a new sub-agent is routed on its own.

    Release:
      type: object
      required: [observed_at, affinity, released, conversation, model, routed_model, was, next, websocket_may_hold]
      properties:
        observed_at:
          type: string
          format: date-time
        affinity:
          type: string
          description: |
            Session affinity as it runs, as in a show. Anything but `on`: nothing is bound, nothing is
            released, and this says why. Added so that the release says why as the show does.
          enum: ["on", "off", home, not-supported]
        released:
          type: boolean
        conversation:
          type: string
          description: The state after the request. `not-bound` after a release; else as in a show.
          enum: [not-bound, not-seen]
        model:
          type: string
          description: As in a show. Added after the review.
        routed_model:
          type: [string, "null"]
          description: As in a show. Added after the review.
        was:
          description: "The route the binding named (or `{listed: false}`). `null` when nothing was released."
          oneOf:
            - $ref: "#/components/schemas/Route"
            - $ref: "#/components/schemas/UnlistedRoute"
            - type: "null"
        next:
          type: array
          description: "The first routes now, as in a show's `first`: where the next request goes while they stay available and it may use them."
          items:
            $ref: "#/components/schemas/Route"
        websocket_may_hold:
          type: boolean
          description: As in a show. With `true`, close the connection before its next turn, or the release is undone.


    SessionReturnState:
      type: object
      required: [observed_at, setting, in_effect, reason, ttl_s, counts]
      properties:
        observed_at:
          type: string
          format: date-time
        setting:
          type: object
          description: "`routing.session-affinity-return` as the configuration has it."
          required: [cold_after_s]
          properties:
            cold_after_s:
              type: [number, "null"]
              minimum: 60
              description: |
                `cold-after` in seconds, with its fraction where it has one (`1m0.9s` is 60.9); `null`
                when not set. `null` for `cold-after` in the configuration is off, as removing the key
                is. A duration at or above the TTL is accepted and reported `not-below-ttl`. The
                gateway compares the duration itself, never this number.
        in_effect:
          type: boolean
          description: Whether the rule runs now. This is the value in use.
        reason:
          type: [string, "null"]
          description: |
            Why not, when not in effect; `null` when in effect. The first that applies: `home-mode`,
            `plugin-scheduler`, `session-affinity-off` (bindings are not honoured by this gateway's
            selection), `not-set` (no `cold-after`), `rebind-never`
            (`session-affinity-rebind-on: never`), `not-below-ttl` (`cold-after` is not shorter than
            `session-affinity-ttl`: a binding ends by itself first).
          enum: [home-mode, plugin-scheduler, session-affinity-off, not-set, rebind-never, not-below-ttl, null]
        ttl_s:
          type: [integer, "null"]
          description: |
            The binding lifetime in use (`session-affinity-ttl`), in seconds; `null` with session
            affinity off. `cold-after` at or above it is `not-below-ttl`.
        counts:
          type: object
          required: [returned, last_returned_at, since]
          properties:
            returned:
              type: integer
              description: |
                Bindings dropped since startup. One conversation can count more than once.
            last_returned_at:
              type: [string, "null"]
              format: date-time
            since:
              type: string
              format: date-time
              description: "When the counting started: the gateway's start."

  examples:
    FellBackCacheCold:
      summary: "Fell back to a paid key 40 minutes ago, the first route is free"
      value:
        observed_at: "2026-11-27T10:15:00Z"
        affinity: "on"
        conversation: bound
        model: opus
        routed_model: null
        binding: "b.k3v7q2mfx4ardn5w"
        bound:
          route: { provider: claude, kind: apikey, priority: 5, host: api.anthropic.com, account: "a.f6zq3m2hx7kd4vwn5tyb" }
