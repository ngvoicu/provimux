openapi: 3.1.0
info:
  title: Provimux management endpoints for the console
  version: "1"
  description: |
    Read-only endpoints that exist only in Provimux (github.com/ngvoicu/provimux), under
    /v8/management/provimux/. Stock CLIProxyAPI answers 404 on these paths, and so does a Provimux older
    than an endpoint; the console (provimux-ui) hides the matching page then, or falls back to an older
    endpoint (model-lists, then live-lists).

    Rules of the contract:
    - Every property listed as required is always present. A value that is not known is null.
    - Times are RFC 3339 in UTC with the fraction of a second the server recorded (up to nanoseconds;
      none when it is zero), e.g. 2026-11-19T18:04:11.482Z. Compare them as times, not as strings.
    - The server only adds properties. It never removes one or changes a type or a meaning.
      Clients ignore properties and enum values they do not know.
    - They report state Provimux has recorded. They do not predict what the router will do: which route
      a request gets, whether a route is selectable now, or when a fetch is retried.
    - No response carries an API key, a token, an auth ID, a base URL beyond its host, or a
      provider's error text. A live-list failure is a category code and an HTTP status, never error text.
servers:
  - url: http://127.0.0.1:8317/v8/management
security:
  - managementKey: []
  - managementKeyHeader: []
paths:
  /provimux/model-routes:
    get:
      operationId: provimuxModelRoutes
      summary: Per model, every enabled login or key that registered it, with its recorded cooldown
      parameters:
        - name: model
          in: query
          required: false
          description: |
            Return only models whose id equals one of the values (exact, case-sensitive). Repeatable.
            An empty value returns an empty list without reading any state: the console's presence probe.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: The models and their routes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRoutesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Absent"
  /provimux/live-lists:
    get:
      operationId: provimuxLiveLists
      summary: Per login whose vendor list Provimux fetches, whether its model list is live or the catalog
      description: |
        Kept for consoles released before /provimux/model-lists. Its providers list grows as Provimux fetches
        more vendors' lists (claude, codex, meta; since model-lists P2 also devin, kimi, xai, gemini).
      responses:
        "200":
          description: The state of the live model lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveListsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Absent"
        "503":
          description: The live-list fetcher's state is not available in this binary. Not a sign of absence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /provimux/model-lists:
    get:
      operationId: provimuxModelLists
      summary: Per login, which source decides its models (its vendor's live list, the published list, the built-in list or none)
      description: |
        Every row names its login (login.name, login.email, login.label), as GET /credentials does: the answer is
        for the operator, behind the management key. Whoever reads it to publish anything (groundtruth's
        discovery) must drop `login` and `auth_index` from every row before the data leaves the machine.
      parameters:
        - name: auth_index
          in: query
          required: false
          description: |
            Return only this login, with models filled: one row per model it registers, with the source of each
            field. A value no login has returns an empty logins list.
          schema:
            type: string
        - name: view
          in: query
          required: false
          description: |
            "live": every row carries live_list, the vendor's list as it arrived, unmerged (null without one).
            What groundtruth's daily discovery reads. Other values are ignored.
          schema:
            type: string
            enum: [live]
      responses:
        "200":
          description: The state of the model lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Absent"
        "503":
          description: The model-list state is not available in this binary. Not a sign of absence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    managementKey:
      type: http
      scheme: bearer
      description: The management key, as for every /v8/management route.
    managementKeyHeader:
      type: apiKey
      in: header
      name: X-Management-Key
  responses:
    Unauthorized:
      description: The management key is missing or wrong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Remote management is off for this client, no key is configured, or the address is banned after 5 failures.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Absent:
      description: |
        Empty body. Either management is not enabled (or home mode is on), or this server has no such
        route: stock CLIProxyAPI, or a Provimux older than this endpoint. The console hides the page.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC, with fractional seconds when the recorded time has them.
    Login:
      type: object
      description: How the credentials page names this credential. Never a secret.
      required: [name, email, label]
      properties:
        name:
          type: [string, "null"]
          description: |
            Auth file name, only for a login GET /credentials lists under a file. Null for a configured API key,
            for a runtime credential (identified by auth_index only) and for a login the credentials list hides.
        email:
          type: [string, "null"]
          description: Account email, under the same condition as name. Null when there is none.
        label:
          type: [string, "null"]
          description: |
            The credential's label, for a login under the same condition as name. For a configured key the
            OpenAI-compatible entry's name, or "<provider>-apikey". Null for runtime credentials.
    Limits:
      type: object
      required: [context, output]
      properties:
        context:
          type: [integer, "null"]
          description: Context window in tokens. Null when not known.
        output:
          type: [integer, "null"]
          description: Largest output in tokens. Null when not known.
    ReasoningBudget:
      type: object
      required: [min, max, zero_allowed, dynamic_allowed]
      properties:
        min:
          type: integer
        max:
          type: integer
        zero_allowed:
          type: boolean
          description: A budget of 0 (reasoning off) is accepted.
        dynamic_allowed:
          type: boolean
          description: A dynamic budget (-1) is accepted.
    Reasoning:
      type: object
      required: [levels, budget]
      properties:
        levels:
          type: array
          description: Discrete effort levels. Empty for a budget-only model.
          items:
            type: string
        budget:
          oneOf:
            - $ref: "#/components/schemas/ReasoningBudget"
            - type: "null"
    RecordedCooldown:
      type: object
      description: |
        An unexpired cooldown as the auth manager recorded it on the credential. It is a record, not an
        availability verdict: a route without one can still be unusable (an expired token, for example),
        and the router decides the rest.
      required: [scope, model, reason, until, http_status, backoff_level]
      properties:
        scope:
          type: string
          description: |
            "credential": recorded for the whole credential. "model": recorded for one model on this credential.
            Clients treat other values as unknown.
          example: model
        model:
          type: [string, "null"]
          description: |
            For scope "model", the model the cooldown is recorded under, as the auth manager keys it (prefix cut,
            OAuth alias resolved). Null for scope "credential".
        reason:
          type: string
          description: |
            A code, never a provider's text. Known values: quota, credential_quota, transient_rate_limit,
            transient_error, unauthorized, payment_required, not_found, model_not_supported, invalid_grant,
            cloudflare_challenge, unknown. Clients treat other values as unknown.
          example: quota
        until:
          $ref: "#/components/schemas/Timestamp"
        http_status:
          type: [integer, "null"]
          description: The provider's status behind the cooldown, when it is known and matches the reason.
        backoff_level:
          type: [integer, "null"]
    ModelRoute:
      type: object
      description: One credential that registered one model.
      required:
        - auth_index
        - provider
        - kind
        - priority
        - host
        - login
        - limits
        - reasoning
        - recorded_cooldown
      properties:
        auth_index:
          type: [string, "null"]
          description: The credential's stable index, the same value as auth_index in GET /credentials and auth-index in GET /config.
        provider:
          type: string
          example: claude
        kind:
          type: [string, "null"]
          description: |
            "oauth" for a subscription login, "apikey" for an API key; null when the credential tells neither.
            Clients treat other values as unknown.
          example: oauth
        priority:
          type: integer
          description: The credential's configured priority; higher is preferred.
        host:
          type: [string, "null"]
          description: Lower-case host of an API key's base URL. No port, path, query or user info. Null for logins and for keys without a base URL.
        login:
          $ref: "#/components/schemas/Login"
        limits:
          $ref: "#/components/schemas/Limits"
          description: What this credential declares for the model.
        reasoning:
          oneOf:
            - $ref: "#/components/schemas/Reasoning"
            - type: "null"
          description: Null when the credential declares no reasoning support for the model.
        recorded_cooldown:
          oneOf:
            - $ref: "#/components/schemas/RecordedCooldown"
            - type: "null"
          description: |
            The later-ending of the credential's recorded cooldown and this model's. Null when none is recorded,
            and for an alias pooling several upstream models (their cooldowns are recorded under their own names).
    Model:
      type: object
      required: [id, display_name, owned_by, limits, routes]
      properties:
        id:
          type: string
          description: The model id as a client sends it, prefix and alias included.
        display_name:
          type: [string, "null"]
        owned_by:
          type: [string, "null"]
        limits:
          $ref: "#/components/schemas/Limits"
          description: |
            What the registry publishes for the model: the smallest limit across its routes, null where
            routes disagree and one declares none.
        routes:
          type: array
          minItems: 1
          description: Highest priority first, then provider, kind, login label, auth_index.
          items:
            $ref: "#/components/schemas/ModelRoute"
    ModelRoutesResponse:
      type: object
      required: [observed_at, models]
      properties:
        observed_at:
          $ref: "#/components/schemas/Timestamp"
        models:
          type: array
          description: Sorted by id. Every model at least one enabled credential registered, also while all its routes are cooling.
          items:
            $ref: "#/components/schemas/Model"
    LiveListFailure:
      type: object
      description: The latest fetch attempt of the login's current account, when it failed. Codes only, no error text.
      required: [at, category, http_status]
      properties:
        at:
          $ref: "#/components/schemas/Timestamp"
        category:
          type: string
          description: |
            http_status (the provider answered with another status than 200), credentials (preparing the
            login's credentials failed), invalid_response (the answer was not a usable model list), network
            (no answer), other. Clients treat other values as unknown.
          example: http_status
        http_status:
          type: [integer, "null"]
          description: The provider's status, for category http_status; otherwise null.
    LiveListLogin:
      type: object
      required:
        - auth_index
        - provider
        - login
        - disabled
        - source
        - fetching
        - fetched_at
        - listed_models
        - registered_models
        - last_failure
      properties:
        auth_index:
          type: [string, "null"]
        provider:
          type: string
          example: claude
        login:
          $ref: "#/components/schemas/Login"
        disabled:
          type: boolean
          description: The login is switched off and is never fetched.
        source:
          type: string
          description: |
            "live": models.live-lists is on and a list of this account is held, so it filters the login's models.
            "catalog": the built-in catalog is used unchanged (the option is off, or no list of this account is
            held). Clients treat other values as unknown.
          example: live
        fetching:
          type: boolean
          description: A fetch for this login is running now.
        fetched_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: When the held list of this account arrived. Null without one.
        listed_models:
          type: [integer, "null"]
          description: How many model ids the provider returned. Null without a list.
        registered_models:
          type: integer
          description: How many models the login serves now.
        last_failure:
          oneOf:
            - $ref: "#/components/schemas/LiveListFailure"
            - type: "null"
          description: |
            The account's last fetch, when it failed; null once a fetch succeeds, and for an earlier account in the
            same auth file. With source "live" the previous list is kept.
    LiveListsResponse:
      type: object
      required: [observed_at, enabled, providers, logins]
      properties:
        observed_at:
          $ref: "#/components/schemas/Timestamp"
        enabled:
          type: boolean
          description: The models.live-lists option.
        providers:
          type: array
          description: Providers whose logins have live lists. Logins of other providers and all API keys keep the catalog and are not listed.
          items:
            type: string
        logins:
          type: array
          description: Sorted by provider, login name, auth_index. Disabled logins included.
          items:
            $ref: "#/components/schemas/LiveListLogin"
    ModelListSource:
      type: string
      description: |
        Which source decides the login's models now. "live": the list its vendor returned for this account.
        "published": providers.dev's list of the login type (not in this build: step P3). "built-in": the
        catalog built into the binary (until step P1 also refreshed by upstream's catalog updater). "none":
        no list at all; the login offers only models from the config and plugins (an Antigravity account
        that has not answered yet; a Copilot account without a usable answer). Clients treat other values
        as unknown.
      example: live
    ModelListsResponse:
      type: object
      required: [observed_at, options, built_in, published, login_types, logins]
      properties:
        observed_at:
          $ref: "#/components/schemas/Timestamp"
        options:
          type: object
          required: [live_lists, published_lists]
          properties:
            live_lists:
              type: boolean
              description: The models.live-lists option (on unless set to false).
            published_lists:
              type: boolean
              description: The models.published-lists option. Always false in a build without the providers.dev client.
        built_in:
          type: object
          description: The built-in lists' providers.dev dataset. Both null while the built-in lists are the catalog (before step P1).
          required: [dataset_version, generated_at]
          properties:
            dataset_version:
              type: [string, "null"]
            generated_at:
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
        published:
          type: object
          required: [state, dataset_version, generated_at, fetched_at, from_cache, last_failure]
          properties:
            state:
              type: string
              description: |
                "held": a providers.dev document is held. "none": never fetched and nothing cached. "off": the
                option is off, or this build has no providers.dev client. Clients treat other values as unknown.
              example: "off"
            dataset_version:
              type: [string, "null"]
            generated_at:
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
            fetched_at:
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
            from_cache:
              type: boolean
            last_failure:
              oneOf:
                - $ref: "#/components/schemas/LiveListFailure"
                - type: "null"
        login_types:
          type: array
          description: Providers whose credentials get a row. API keys get none, except Gemini keys on Google's own host.
          items:
            type: string
        logins:
          type: array
          description: Sorted by provider, login name, auth_index. Disabled logins included.
          items:
            $ref: "#/components/schemas/ModelListLogin"
    ModelListLive:
      type: object
      description: The login's live list. For a login type without one, supported is false and the rest false or null.
      required: [supported, held, expired, fetched_at, from_cache, fetching, listed_models, last_failure]
      properties:
        supported:
          type: boolean
          description: The vendor has a list and this login is asked.
        held:
          type: boolean
          description: A list of this account is held and not older than 7 days.
        expired:
          type: boolean
          description: A list of this account is held but was not refreshed for 7 days, so the login no longer uses it.
        fetched_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: When the newest list of this account arrived from the vendor. Null without one.
        from_cache:
          type: boolean
          description: That list was read from the disk cache at start and has not been fetched again by this process.
        fetching:
          type: boolean
          description: A fetch for this login is running now. Always false for Copilot and Antigravity, whose fetches upstream runs.
        listed_models:
          type: [integer, "null"]
          description: How many models the vendor's list named. Null without a list.
        last_failure:
          oneOf:
            - $ref: "#/components/schemas/LiveListFailure"
            - type: "null"
          description: The account's last fetch, when it failed. Not reported for Copilot and Antigravity.
    ModelListFieldSource:
      type: [string, "null"]
      description: '"live" (the vendor''s list stated it) or "built-in" (the catalog did); null when no source states it.'
    ModelListModel:
      type: object
      required: [id, display_name, source, learned, limits, modalities, reasoning_levels, sources]
      properties:
        id:
          type: string
        display_name:
          type: [string, "null"]
        source:
          type: string
          description: |
            "live": the vendor's list names it. "built-in": from the catalog. "provimux": a model Provimux adds itself
            (image, video and speech models). "other": from the config, a plugin or an alias. Clients treat other values
            as unknown.
        learned:
          type: boolean
          description: The vendor's list names it and the catalog lacks it.
        limits:
          $ref: "#/components/schemas/Limits"
        modalities:
          type: object
          required: [input, output]
          properties:
            input:
              type: array
              items:
                type: string
            output:
              type: array
              items:
                type: string
        reasoning_levels:
          type: array
          items:
            type: string
        sources:
          type: object
          required: [display_name, context, output, input_modalities, output_modalities, reasoning_levels]
          properties:
            display_name:
              $ref: "#/components/schemas/ModelListFieldSource"
            context:
              $ref: "#/components/schemas/ModelListFieldSource"
            output:
              $ref: "#/components/schemas/ModelListFieldSource"
            input_modalities:
              $ref: "#/components/schemas/ModelListFieldSource"
            output_modalities:
              $ref: "#/components/schemas/ModelListFieldSource"
            reasoning_levels:
              $ref: "#/components/schemas/ModelListFieldSource"
    VendorModel:
      type: object
      description: One entry of a vendor's list as it arrived. Null or empty where the vendor stated nothing.
      required: [id, display_name, context, output, input_modalities, output_modalities, reasoning_levels]
      properties:
        id:
          type: string
        display_name:
          type: [string, "null"]
        context:
          type: [integer, "null"]
        output:
          type: [integer, "null"]
        input_modalities:
          type: array
          items:
            type: string
        output_modalities:
          type: array
          items:
            type: string
        reasoning_levels:
          type: array
          items:
            type: string
    ModelListLogin:
      type: object
      required: [auth_index, provider, login, disabled, source, live, registered_models, learned_models, models]
      properties:
        auth_index:
          type: [string, "null"]
        provider:
          type: string
          example: devin
        login:
          $ref: "#/components/schemas/Login"
        disabled:
          type: boolean
        source:
          $ref: "#/components/schemas/ModelListSource"
        live:
          $ref: "#/components/schemas/ModelListLive"
        registered_models:
          type: integer
          description: How many models the login serves now.
        learned_models:
          type: integer
          description: How many of them the catalog lacks (named by the vendor's list only).
        models:
          type: [array, "null"]
          description: Null unless the request names this login with auth_index.
          items:
            $ref: "#/components/schemas/ModelListModel"
        live_list:
          type: [array, "null"]
          description: Only with view=live, and then on every row. The vendor's list as it arrived; null without one.
          items:
            $ref: "#/components/schemas/VendorModel"
