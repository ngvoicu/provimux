openapi: 3.1.0
info:
  title: Provimux management endpoints for the console
  version: "1"
  description: |
    Read-only endpoints that exist only in Provimux (github.com/ngvoicu/provimux), under
    /v8/management/provimux/. Stock CLIProxyAPI answers 404 on these paths, and so does a Provimux older
    than an endpoint; the console (provimux-ui) hides the matching page then, or falls back to an older
    endpoint (model-lists, then live-lists).

    Rules of the contract:
    - Every property listed as required is always present. A value that is not known is null.
    - Times are RFC 3339 in UTC with the fraction of a second the server recorded (up to nanoseconds;
      none when it is zero), e.g. 2026-11-19T18:04:11.482Z. Compare them as times, not as strings.
    - The server only adds properties. It never removes one or changes a type or a meaning.
      Clients ignore properties and enum values they do not know.
    - They report state Provimux has recorded. They do not predict what the router will do: which route
      a request gets, whether a route is selectable now, or when a fetch is retried.
    - No response carries an API key, a token, an auth ID, a base URL beyond its host, or a
      provider's error text. A live-list failure is a category code and an HTTP status, never error text.
servers:
  - url: http://127.0.0.1:8317/v8/management
security:
  - managementKey: []
  - managementKeyHeader: []
paths:
  /provimux/model-routes:
    get:
      operationId: provimuxModelRoutes
      summary: Per model, every enabled login or key that registered it, with its recorded cooldown
      parameters:
        - name: model
          in: query
          required: false
          description: |
            Return only models whose id equals one of the values (exact, case-sensitive). Repeatable.
            An empty value returns an empty list without reading any state: the console's presence probe.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: The models and their routes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRoutesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Absent"
  /provimux/live-lists:
    get:
      operationId: provimuxLiveLists
      summary: Per login whose vendor list Provimux fetches, whether its model list is live or the catalog
      description: |
        Kept for consoles released before /provimux/model-lists. Its providers list grows as Provimux fetches
        more vendors' lists (claude, codex, meta; since model-lists P2 also devin, kimi, xai, gemini).
      responses:
        "200":
          description: The state of the live model lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveListsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Absent"
        "503":
          description: The live-list fetcher's state is not available in this binary. Not a sign of absence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /provimux/model-lists:
    get:
      operationId: provimuxModelLists
      summary: Per login, which source decides its models (its vendor's live list, the published list, the built-in list or none)
      description: |
        Every row names its login (login.name, login.email, login.label), as GET /credentials does: the answer is
        for the operator, behind the management key. Whoever reads it to publish anything (groundtruth's
        discovery) must drop `login` and `auth_index` from every row before the data leaves the machine.
      parameters:
        - name: auth_index
          in: query
          required: false
          description: |
            Return only this login, with models filled: one row per model it registers, with the source of each
            field. A value no login has returns an empty logins list. The same for keys: a key's auth_index returns
            only its keys row, with models filled.
          schema:
            type: string
        - name: view
          in: query
          required: false
          description: |
            "live": every row carries live_list, the vendor's list as it arrived, unmerged (null without one).
            What groundtruth's daily discovery reads. Other values are ignored. Key rows carry live_list too: the
            key's service's list as it arrived.
          schema:
            type: string
            enum: [live]
      responses:
        "200":
          description: The state of the model lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Absent"
        "503":
          description: The model-list state is not available in this binary. Not a sign of absence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /provimux/names:
    get:
      operationId: provimuxNames
      summary: The names the owner set, every other name his accounts offer, and what was asked for and refused
      description: |
        The state of models.only-my-names (design: only-my-names.md, section 16). The answer has the same shape
        whether the switch is on or off: with it off, `others` is what would stop being served. It is computed
        when asked, from the rule in force and from what the accounts register at that moment: the same rule
        value and the same registry every model list and every request are checked against. Usage is not here:
        join `others` with GET /provimux/savings?group=model&include=requested_models.
      responses:
        "200":
          description: The names and the state of the switch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Absent"
  /provimux/same-account-retry:
    get:
      operationId: provimuxSameAccountRetry
      summary: Whether a request the vendor refused as overloaded gets one second try on the same account, and what that did since the start
      description: |
        routing.retry.same-account-retry as in use (on unless the file sets false) and the counts since the
        gateway started. The value is written through the generic config path,
        /config/routing/retry/same-account-retry (true or false; DELETE returns to the default).
      responses:
        "200":
          description: The value in use and the counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SameAccountRetryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Absent"
components:
  securitySchemes:
    managementKey:
      type: http
      scheme: bearer
      description: The management key, as for every /v8/management route.
    managementKeyHeader:
      type: apiKey
      in: header
      name: X-Management-Key
  responses:
    Unauthorized:
      description: The management key is missing or wrong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Remote management is off for this client, no key is configured, or the address is banned after 5 failures.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Absent:
      description: |
        Empty body. Either management is not enabled (or home mode is on), or this server has no such
        route: stock CLIProxyAPI, or a Provimux older than this endpoint. The console hides the page.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC, with fractional seconds when the recorded time has them.
    Login:
      type: object
      description: How the credentials page names this credential. Never a secret.
      required: [name, email, label]
      properties:
        name:
          type: [string, "null"]
          description: |
            Auth file name, only for a login GET /credentials lists under a file. Null for a configured API key,
            for a runtime credential (identified by auth_index only) and for a login the credentials list hides.
        email:
          type: [string, "null"]
          description: Account email, under the same condition as name. Null when there is none.
        label:
          type: [string, "null"]
          description: |
            The credential's label, for a login under the same condition as name. For a configured key the
            OpenAI-compatible entry's name, or "<provider>-apikey". Null for runtime credentials.
    Limits:
      type: object
      required: [context, output]
      properties:
        context:
          type: [integer, "null"]
          description: Context window in tokens. Null when not known.
        output:
          type: [integer, "null"]
          description: Largest output in tokens. Null when not known.
    ReasoningBudget:
      type: object
      required: [min, max, zero_allowed, dynamic_allowed]
      properties:
        min:
          type: integer
        max:
          type: integer
        zero_allowed:
          type: boolean
          description: A budget of 0 (reasoning off) is accepted.
        dynamic_allowed:
          type: boolean
          description: A dynamic budget (-1) is accepted.
    Reasoning:
      type: object
      required: [levels, budget]
      properties:
        levels:
          type: array
          description: Discrete effort levels. Empty for a budget-only model.
          items:
            type: string
        budget:
          oneOf:
            - $ref: "#/components/schemas/ReasoningBudget"
            - type: "null"
    RecordedCooldown:
      type: object
      description: |
        An unexpired cooldown as the auth manager recorded it on the credential. It is a record, not an
        availability verdict: a route without one can still be unusable (an expired token, for example),
        and the router decides the rest.
      required: [scope, model, reason, until, http_status, backoff_level]
      properties:
        scope:
          type: string
          description: |
            "credential": recorded for the whole credential. "model": recorded for one model on this credential.
            Clients treat other values as unknown.
          example: model
        model:
          type: [string, "null"]
          description: |
            For scope "model", the model the cooldown is recorded under, as the auth manager keys it (prefix cut,
            OAuth alias resolved). Null for scope "credential".
        reason:
          type: string
          description: |
            A code, never a provider's text. Known values: quota, credential_quota, transient_rate_limit,
            transient_error, unauthorized, payment_required, not_found, model_not_supported, invalid_grant,
            cloudflare_challenge, unknown. Clients treat other values as unknown.
          example: quota
        until:
          $ref: "#/components/schemas/Timestamp"
        http_status:
          type: [integer, "null"]
          description: The provider's status behind the cooldown, when it is known and matches the reason.
        backoff_level:
          type: [integer, "null"]
    ModelRoute:
      type: object
      description: One credential that registered one model.
      required:
        - auth_index
        - provider
        - kind
        - priority
        - host
        - login
        - limits
        - reasoning
        - recorded_cooldown
      properties:
        auth_index:
          type: [string, "null"]
          description: The credential's stable index, the same value as auth_index in GET /credentials and auth-index in GET /config.
        provider:
          type: string
          example: claude
        kind:
          type: [string, "null"]
          description: |
            "oauth" for a subscription login, "apikey" for an API key; null when the credential tells neither.
            Clients treat other values as unknown.
          example: oauth
        priority:
          type: integer
          description: The credential's configured priority; higher is preferred.
        host:
          type: [string, "null"]
          description: Lower-case host of an API key's base URL. No port, path, query or user info. Null for logins and for keys without a base URL.
        account:
          type: string
          pattern: "^[as]\\.[a-z2-7]{20}$"
          description: |
            The account's marker (answered-by.md 2): an opaque keyed hash, the same as X-Provimux-Account on every
            answer this account gives and as `account` in GET /v1/models?include=accounts. "a." when the account is
            named as its vendor names it (equal markers are one account), "s." when it is this gateway's credential
            (equal markers are one credential). Beside the login's name it tells the operator which marker is which
            login; no answer to a client pairs the two. Left out when models.answered-by is false, and by a gateway
            from before answered-by W2: a reader treats it as optional.
          example: a.jvwtubr4vdp5dfnhj7jm
        login:
          $ref: "#/components/schemas/Login"
        limits:
          $ref: "#/components/schemas/Limits"
          description: What this credential declares for the model.
        reasoning:
          oneOf:
            - $ref: "#/components/schemas/Reasoning"
            - type: "null"
          description: Null when the credential declares no reasoning support for the model.
        recorded_cooldown:
          oneOf:
            - $ref: "#/components/schemas/RecordedCooldown"
            - type: "null"
          description: |
            The later-ending of the credential's recorded cooldown and this model's. Null when none is recorded,
            and for an alias pooling several upstream models (their cooldowns are recorded under their own names).
        answered:
          type: array
          maxItems: 4
          description: |
            What this credential's answers for this model said of themselves (answered-by.md 4.4, amended
            2026-11-27 by the lead): the distinct providers.dev entries (`<provider>/<model>`) its answers to every
            client key together named, newest first, each with the time of the last answer that named it; null for
            answers that named none. Per credential and per exact model name. GET /v1/models?include=accounts gives
            each client key only its own answers' items, with the day only. It is a record of answers and predicts
            nothing: an answer's entry is read from the request the gateway sent for it, so the next answer can
            differ from every item. Empty when no answer of this credential for this model is recorded. An item is
            not shown after 90 days and is removed from the record at its next write; the record outlives a restart
            where the gateway owns its auth folder's record file and keeps its marker key. It is a best-effort memory
            (amended 2026-11-27 (2) by the lead): it keeps only what the gateway's own output route wrote, an answer
            around a change of the auth folder may be missing, and a second gateway on the same auth folder keeps its
            record in memory only. It exists only in the gateway as shipped, a process Provimux's own program
            started; elsewhere a route has no `answered`.
            Optional in this contract: a gateway from before answered-by W6, and one with models.answered-by off,
            leaves it out, and a reader treats missing and empty alike. No route carries a predicted `entry`.
          items:
            $ref: "#/components/schemas/RouteAnswered"
    RouteAnswered:
      type: object
      required: [entry, at]
      properties:
        entry:
          type: [string, "null"]
          pattern: "^[^/]+/.+$"
          description: The entry those answers named; null where they named none. It says where the model would be at providers.dev, not that providers.dev has such an entry.
          example: claude-subscription/claude-opus-5-5
        at:
          $ref: "#/components/schemas/Timestamp"
          description: When the last answer of this credential for this model that said so was returned.
    Model:
      type: object
      required: [id, display_name, owned_by, limits, routes]
      properties:
        id:
          type: string
          description: The model id as a client sends it, prefix and alias included.
        display_name:
          type: [string, "null"]
        owned_by:
          type: [string, "null"]
        limits:
          $ref: "#/components/schemas/Limits"
          description: |
            What the registry publishes for the model: the smallest limit across its routes, null where
            routes disagree and one declares none.
        routes:
          type: array
          minItems: 1
          description: Highest priority first, then provider, kind, login label, auth_index.
          items:
            $ref: "#/components/schemas/ModelRoute"
    ModelRoutesResponse:
      type: object
      required: [observed_at, models]
      properties:
        observed_at:
          $ref: "#/components/schemas/Timestamp"
        models:
          type: array
          description: |
            Sorted by id. Every model at least one enabled credential registered, also while all its routes are
            cooling. While models.only-my-names applies, only the names it serves (GET /provimux/names lists the
            rest under others); the rule is read as the answer is made.
          items:
            $ref: "#/components/schemas/Model"
    LiveListFailure:
      type: object
      description: The latest fetch attempt of the login's current account, when it failed. Codes only, no error text.
      required: [at, category, http_status]
      properties:
        at:
          $ref: "#/components/schemas/Timestamp"
        category:
          type: string
          description: |
            http_status (the provider answered with another status than 200), credentials (preparing the
            login's credentials failed), invalid_response (the answer was not a usable model list), network
            (no answer), other. Clients treat other values as unknown.
          example: http_status
        http_status:
          type: [integer, "null"]
          description: The provider's status, for category http_status; otherwise null.
    LiveListLogin:
      type: object
      required:
        - auth_index
        - provider
        - login
        - disabled
        - source
        - fetching
        - fetched_at
        - listed_models
        - registered_models
        - last_failure
      properties:
        auth_index:
          type: [string, "null"]
        provider:
          type: string
          example: claude
        login:
          $ref: "#/components/schemas/Login"
        disabled:
          type: boolean
          description: The login is switched off and is never fetched.
        source:
          type: string
          description: |
            "live": models.live-lists is on and a list of this account is held, so it filters the login's models.
            "catalog": the built-in catalog is used unchanged (the option is off, or no list of this account is
            held). Clients treat other values as unknown.
          example: live
        fetching:
          type: boolean
          description: A fetch for this login is running now.
        fetched_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: When the held list of this account arrived. Null without one.
        listed_models:
          type: [integer, "null"]
          description: How many model ids the provider returned. Null without a list.
        registered_models:
          type: integer
          description: How many models the login serves now.
        last_failure:
          oneOf:
            - $ref: "#/components/schemas/LiveListFailure"
            - type: "null"
          description: |
            The account's last fetch, when it failed; null once a fetch succeeds, and for an earlier account in the
            same auth file. With source "live" the previous list is kept.
    LiveListsResponse:
      type: object
      required: [observed_at, enabled, providers, logins]
      properties:
        observed_at:
          $ref: "#/components/schemas/Timestamp"
        enabled:
          type: boolean
          description: The models.live-lists option.
        providers:
          type: array
          description: Providers whose logins have live lists. Logins of other providers and all API keys keep the catalog and are not listed.
          items:
            type: string
        logins:
          type: array
          description: Sorted by provider, login name, auth_index. Disabled logins included.
          items:
            $ref: "#/components/schemas/LiveListLogin"
    ModelListSource:
      type: string
      description: |
        Which source decides the login's models now. "live": the list its vendor returned for this account.
        "published": providers.dev's list of the login type (not sent by this build: providers.dev fills fields of
        learned models but does not decide which models a login offers; model-lists.md 13.5). "built-in": the
        catalog built into the binary (until step P1 also refreshed by upstream's catalog updater). "none":
        no list at all; the login offers only models from the config and plugins (an Antigravity account
        that has not answered yet; a Copilot account without a usable answer). "config" (key rows only): the
        key's rows in config.yaml alone decide, because no list of its service is held, the list is older than
        7 days, or the key is not asked. For a key, "live" means its service's list is held and added to its
        rows. Clients treat other values as unknown.
      example: live
    ModelListsResponse:
      type: object
      required: [observed_at, options, built_in, published, login_types, logins, keys]
      properties:
        observed_at:
          $ref: "#/components/schemas/Timestamp"
        options:
          type: object
          required: [live_lists, published_lists]
          properties:
            live_lists:
              type: boolean
              description: The models.live-lists option (on unless set to false).
            published_lists:
              type: boolean
              description: The models.published-lists option (on unless set to false; off in home mode).
        built_in:
          type: object
          description: The built-in lists' providers.dev dataset. Both null while the built-in lists are the catalog (before step P1).
          required: [dataset_version, generated_at]
          properties:
            dataset_version:
              type: [string, "null"]
            generated_at:
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
        published:
          type: object
          required: [state, dataset_version, generated_at, fetched_at, from_cache, last_failure]
          properties:
            state:
              type: string
              description: |
                "held": a providers.dev document is held. "none": never fetched and nothing cached. "off": the
                option is off. Clients treat other values as unknown. dataset_version and generated_at are the
                document's; fetched_at is when it arrived (a 304 does not change it); from_cache: read from the
                disk at start and not confirmed by providers.dev since; last_failure: the last fetch, when it failed
                (http_status, invalid_response for a malformed, incomplete or older document, network).
              example: "off"
            dataset_version:
              type: [string, "null"]
            generated_at:
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
            fetched_at:
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
            from_cache:
              type: boolean
            last_failure:
              oneOf:
                - $ref: "#/components/schemas/LiveListFailure"
                - type: "null"
        login_types:
          type: array
          description: Providers whose credentials get a row. API keys get none, except Gemini keys on Google's own host.
          items:
            type: string
        logins:
          type: array
          description: Sorted by provider, login name, auth_index. Disabled logins included.
          items:
            $ref: "#/components/schemas/ModelListLogin"
        keys:
          type: array
          description: |
            Config API keys whose model list refreshes itself or could (key-model-lists.md 7.1): every
            openai-compatibility key, and every built-in key (claude, codex, xai, meta, gemini, interactions,
            vertex) with rows in its models. A built-in key without rows keeps the catalog and has no row. A Gemini
            key on Google's own host keeps its row in logins and has one here too when it has rows. Keys are never
            in logins otherwise. Sorted by key.type, provider, auth_index. Disabled keys included. Absent from
            servers before this field: a reader that does not know it ignores it.
          items:
            $ref: "#/components/schemas/ModelListKeyRow"
    ModelListLive:
      type: object
      description: The login's live list. For a login type without one, supported is false and the rest false or null.
      required: [supported, held, expired, fetched_at, from_cache, fetching, listed_models, last_failure]
      properties:
        supported:
          type: boolean
          description: The vendor has a list and this login is asked.
        held:
          type: boolean
          description: A list of this account is held and not older than 7 days.
        expired:
          type: boolean
          description: A list of this account is held but was not refreshed for 7 days, so the login no longer uses it.
        fetched_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: When the newest list of this account arrived from the vendor. Null without one.
        from_cache:
          type: boolean
          description: That list was read from the disk cache at start and has not been fetched again by this process.
        fetching:
          type: boolean
          description: A fetch for this login is running now. Always false for Copilot and Antigravity, whose fetches upstream runs.
        listed_models:
          type: [integer, "null"]
          description: How many models the vendor's list named. Null without a list.
        last_failure:
          oneOf:
            - $ref: "#/components/schemas/LiveListFailure"
            - type: "null"
          description: The account's last fetch, when it failed. Not reported for Copilot and Antigravity.
    ModelListFieldSource:
      type: [string, "null"]
      description: '"built-in" (the catalog gave the value), "live" (the vendor''s list did: for a model the catalog lacks, or a field the catalog leaves empty; a model the catalog has keeps every value the catalog states) or "published" (providers.dev''s listing filled a gap: for a model the catalog has, a field both the catalog and the vendor''s list leave empty; for a model the catalog lacks, a field the vendor''s list does not state; never the reasoning levels, which providers.dev does not supply); null when no source states it. Clients treat other values as unknown.'
    ModelListModel:
      type: object
      required: [id, display_name, source, learned, limits, modalities, reasoning_levels, sources]
      properties:
        id:
          type: string
        display_name:
          type: [string, "null"]
        source:
          type: string
          description: |
            "live": the vendor's list names it. "built-in": from the catalog. "provimux": a model Provimux adds itself
            (image, video and speech models). "other": from the config, a plugin or an alias. Clients treat other values
            as unknown.
        learned:
          type: boolean
          description: The vendor's list names it and the catalog lacks it.
        limits:
          $ref: "#/components/schemas/Limits"
        modalities:
          type: object
          required: [input, output]
          properties:
            input:
              type: array
              items:
                type: string
            output:
              type: array
              items:
                type: string
        reasoning_levels:
          type: array
          items:
            type: string
        sources:
          type: object
          required: [display_name, context, output, input_modalities, output_modalities, reasoning_levels]
          properties:
            display_name:
              $ref: "#/components/schemas/ModelListFieldSource"
            context:
              $ref: "#/components/schemas/ModelListFieldSource"
            output:
              $ref: "#/components/schemas/ModelListFieldSource"
            input_modalities:
              $ref: "#/components/schemas/ModelListFieldSource"
            output_modalities:
              $ref: "#/components/schemas/ModelListFieldSource"
            reasoning_levels:
              $ref: "#/components/schemas/ModelListFieldSource"
    VendorModel:
      type: object
      description: One entry of a vendor's list as it arrived. Null or empty where the vendor stated nothing.
      required: [id, display_name, context, output, input_modalities, output_modalities, reasoning_levels]
      properties:
        id:
          type: string
        display_name:
          type: [string, "null"]
        context:
          type: [integer, "null"]
        output:
          type: [integer, "null"]
        input_modalities:
          type: array
          items:
            type: string
        output_modalities:
          type: array
          items:
            type: string
        reasoning_levels:
          type: array
          items:
            type: string
    ModelListLogin:
      type: object
      required: [auth_index, provider, login, disabled, source, live, registered_models, learned_models, models]
      properties:
        auth_index:
          type: [string, "null"]
        provider:
          type: string
          example: devin
        login:
          $ref: "#/components/schemas/Login"
        disabled:
          type: boolean
        source:
          $ref: "#/components/schemas/ModelListSource"
        live:
          $ref: "#/components/schemas/ModelListLive"
        registered_models:
          type: integer
          description: How many models the login serves now.
        learned_models:
          type: integer
          description: How many of them the catalog lacks (named by the vendor's list only).
        models:
          type: [array, "null"]
          description: Null unless the request names this login with auth_index.
          items:
            $ref: "#/components/schemas/ModelListModel"
        live_list:
          type: [array, "null"]
          description: Only with view=live, and then on every row. The vendor's list as it arrived; null without one.
          items:
            $ref: "#/components/schemas/VendorModel"
    ModelListKeyRow:
      type: object
      description: A logins row's fields for one config API key, plus key. login.label is the entry's name or the key's label; login.name and login.email are null.
      required: [auth_index, provider, login, disabled, source, live, registered_models, learned_models, models, key]
      properties:
        auth_index:
          type: [string, "null"]
        provider:
          type: string
          description: An openai-compatibility entry's name (lower case), else the key type.
          example: openrouter
        login:
          $ref: "#/components/schemas/Login"
        disabled:
          type: boolean
        source:
          $ref: "#/components/schemas/ModelListSource"
        live:
          $ref: "#/components/schemas/ModelListLive"
        registered_models:
          type: integer
          description: How many models the key serves now (a prefixed copy counts as one more).
        learned_models:
          type: integer
          description: How many models the key offers that no row names; the length of key.learned.
        models:
          type: [array, "null"]
          description: Null unless the request names this key with auth_index.
          items:
            $ref: "#/components/schemas/ModelListKeyModel"
        live_list:
          type: [array, "null"]
          description: Only with view=live, and then on every row. The service's list as it arrived; null without one.
          items:
            $ref: "#/components/schemas/VendorModel"
        key:
          $ref: "#/components/schemas/ModelListKey"
    ModelListKey:
      type: object
      required: [type, name, fixed, not_asked, configured_models, unlisted_models, learned, unlisted]
      properties:
        type:
          type: string
          description: openai-compatibility, claude, codex, xai, meta, gemini, interactions or vertex. Clients treat other values as unknown.
          example: openai-compatibility
        name:
          type: string
          description: An openai-compatibility entry's name (lower case), else the key type; the same as the row's provider.
        fixed:
          type: boolean
          description: The key's entry says fixed-models true.
        not_asked:
          type: [string, "null"]
          description: |
            Null when the key's service is asked for its list. Else why not: "fixed" (fixed-models true),
            "live_lists_off" (models.live-lists false, or home mode), "no_list_endpoint" (vertex and interactions
            keys). live.supported is false exactly when this is not null. Clients treat other values as unknown.
        configured_models:
          type: integer
          description: Rows in the key's models in config.yaml.
        unlisted_models:
          type: [integer, "null"]
          description: Rows whose model the held list does not name; null without a list in use (source not "live").
        learned:
          type: array
          description: |
            The ids of the models the key offers that no row names, as its service lists them (before the
            entry's prefix), in the list's order; excluded-models already applied. Empty without a list in use.
            These are the models a refresh added: a console marks them apart from the config's rows.
          items:
            type: string
        unlisted:
          type: [array, "null"]
          description: The names, as written, of the rows counted by unlisted_models; null with it.
          items:
            type: string
    ModelListKeyModel:
      type: object
      description: A ModelListModel of a key, plus listed. sources are null for keys.
      required: [id, display_name, source, learned, limits, modalities, reasoning_levels, sources, listed]
      properties:
        id:
          type: string
        display_name:
          type: [string, "null"]
        source:
          type: string
          description: '"live": a model the key learned from its service. "other": a row of the config, a plugin''s model. Clients treat other values as unknown.'
        learned:
          type: boolean
          description: The key offers it because its service lists it; no row names it.
        limits:
          $ref: "#/components/schemas/Limits"
        modalities:
          type: object
          required: [input, output]
          properties:
            input:
              type: array
              items:
                type: string
            output:
              type: array
              items:
                type: string
        reasoning_levels:
          type: array
          items:
            type: string
        sources:
          type: object
          required: [display_name, context, output, input_modalities, output_modalities, reasoning_levels]
          properties:
            display_name:
              $ref: "#/components/schemas/ModelListFieldSource"
            context:
              $ref: "#/components/schemas/ModelListFieldSource"
            output:
              $ref: "#/components/schemas/ModelListFieldSource"
            input_modalities:
              $ref: "#/components/schemas/ModelListFieldSource"
            output_modalities:
              $ref: "#/components/schemas/ModelListFieldSource"
            reasoning_levels:
              $ref: "#/components/schemas/ModelListFieldSource"
        listed:
          type: [boolean, "null"]
          description: |
            Whether the service's held list names the model: true for a learned model; for a row, whether the
            list names the model the row names (false marks a row the service no longer lists; rows are never
            dropped). Null without a list in use, and for a plugin's model.
    SameAccountRetryResponse:
      type: object
      required: [observed_at, enabled, set_in_file, default, applies, wait_min_ms, wait_max_ms, retry_after_max_ms, since, second_calls, second_calls_without_error, second_calls_with_error, left_during_wait]
      properties:
        observed_at:
          $ref: "#/components/schemas/Timestamp"
        enabled:
          type: boolean
          description: The value in use.
        set_in_file:
          type: boolean
          description: Whether the config file sets the key; false means enabled is the default.
        default:
          type: boolean
          description: The value when the key is not set (true in the gateway).
        applies:
          type: boolean
          description: enabled, and the gateway is not in Home mode (where Home chooses the accounts and nothing is retried).
        wait_min_ms:
          type: integer
          description: The shortest wait before the second try without a Retry-After.
        wait_max_ms:
          type: integer
          description: The longest wait before the second try without a Retry-After.
        retry_after_max_ms:
          type: integer
          description: The longest vendor Retry-After still waited (1 or 2 seconds are waited exactly, 0 means the jittered wait); a longer one means no second try.
        since:
          $ref: "#/components/schemas/Timestamp"
        second_calls:
          type: integer
          minimum: 0
          description: |
            Since `since` (the process start): how often the gateway called the executor a second time on the same
            account after an overload refusal. This counts the gateway's call, not a request the vendor received (a
            second connection can be refused). In memory only.
        second_calls_without_error:
          type: integer
          minimum: 0
          description: |
            Of the second calls, those that returned without an error: a complete answer, or a stream handed on. Not
            that the answer was complete or had content: an empty stream can still go on to another account.
        second_calls_with_error:
          type: integer
          minimum: 0
          description: Of the second calls, those that returned an error; the gateway then went on as without the rule.
        left_during_wait:
          type: integer
          minimum: 0
          description: Refusals after which the client went away during the wait; the executor was not called a second time.
    NamesResponse:
      type: object
      required: [observed_at, only_my_names, applied, names, keep_ignored, others, refused]
      description: |
        The rule in force and what the accounts register, both read as the answer is made. The rule in force
        is the one of the last config the gateway committed; lists and requests follow it from that instant,
        whatever the accounts are doing. A write of the config answers just before its config is committed:
        the answer reflects a write once applied.config_etag equals the ETag the write returned. Every
        registered name is in exactly one of names (as a name or one of its copies) and others.
      properties:
        observed_at:
          $ref: "#/components/schemas/Timestamp"
        only_my_names:
          $ref: "#/components/schemas/OnlyMyNamesState"
        applied:
          $ref: "#/components/schemas/NamesApplied"
        names:
          type: array
          description: |
            Every name the owner set: the names of the config in force (alias rows and keep), exactly as written
            (trimmed). An alias that exists only in a login's own file is not one of them: it is under others
            until keep lists it. Never also in others. Sorted by name, without case.
          items:
            $ref: "#/components/schemas/OwnName"
        keep_ignored:
          type: array
          description: Entries of models.only-my-names.keep the gateway ignores.
          items:
            $ref: "#/components/schemas/KeepIgnored"
        others:
          type: array
          description: |
            Every name an enabled account (or a plugin executor) registers now that a request could not be
            served under (not one of the owner's names, nor a copy of one under a prefix the config declares, nor
            one of them with a thinking suffix), with the accounts that register it; an alias in a login's own
            file, and a copy under a prefix set only in a login's own file, included. Spellings that differ only in case are different names. Not listed to clients and refused
            when only_my_names.enabled and applies; served otherwise (then it is what would stop being served).
            Sorted by name, without case.
          items:
            $ref: "#/components/schemas/OtherName"
        refused:
          oneOf:
            - $ref: "#/components/schemas/RefusedNames"
            - type: "null"
          description: Null while the rule in force is off or does not apply.
    OnlyMyNamesState:
      type: object
      required: [enabled, applies, not_applied]
      properties:
        enabled:
          type: boolean
          description: models.only-my-names.enabled of the rule in force (see NamesApplied).
        applies:
          type: boolean
          description: False when the gateway does not decide names itself; then nothing is held back.
        not_applied:
          type: [string, "null"]
          description: Why it does not apply; null when it does. Clients treat a value they do not know as not applying.
          enum: [home, null]
    NamesApplied:
      type: object
      required: [generation, config_etag, applying]
      description: |
        Which rule of models.only-my-names is in force: the one every model list and every request is checked
        against as this answer is made. A write of the config answers with an ETag; the answer reflects that
        write once config_etag equals it.
      properties:
        generation:
          type: integer
          minimum: 0
          description: Counts the rules the gateway has put in force since it started (one per config commit); this one's.
        config_etag:
          type: [string, "null"]
          description: The config API's ETag (quoted SHA-256 of the file) of the config whose rule is in force; null when not known.
        applying:
          type: boolean
          description: |
            Always false: a rule is in force from the instant it is set, and nothing is on its way. Kept so that
            a console written for the earlier answer needs no change.
    ServedCopy:
      type: object
      required: [id, accounts]
      properties:
        id:
          type: string
          description: |
            The id as clients send it: the name under a prefix the config declares ("team-a/opus" for "opus"), or
            the name with a thinking suffix registered as an id ("opus(high)"). A copy that is itself one of the
            owner's names (kept in full) is listed here and also has its own row in names.
        accounts:
          type: integer
          minimum: 1
          description: Enabled accounts that register it now.
    OwnName:
      type: object
      required: [name, set_by, accounts, copies]
      properties:
        name:
          type: string
          description: The name as written where it was set, trimmed. Names are compared exactly, as a request is matched.
        set_by:
          type: array
          minItems: 1
          description: |
            alias: an alias row of the config (an API key's models row whose alias differs from its name, or an
            oauth-model-alias row). keep: models.only-my-names.keep. login-file is no longer given (an alias in a
            login's own file is not a name of the config); the value stays in the enum for older consoles.
            A name is the owner's or it is not: every account that registers it serves it, as with the switch off.
          items:
            type: string
            enum: [alias, keep, login-file]
        accounts:
          type: integer
          minimum: 0
          description: |
            Enabled accounts (and plugin executors) that register the name exactly now; 0 when nothing registers
            that spelling (a request for a kept "MINE" can still reach a registered "mine" through upstream's
            lower-case lookup). While a login is being replaced by another it can be one read behind; the next
            read is right.
        copies:
          type: array
          description: |
            The registered ids served through the name that are not the name itself: its copies under a prefix
            the config declares on a key or provider entry ("team-a/opus"), and its spellings with a thinking
            suffix that an account registers as ids ("opus(high)", "team-a/opus(high)"). An id that is also one
            of the owner's names in full (kept "team-a/opus" or "opus(high)") is here and has its own row. Not
            counted in accounts. Sorted by id.
          items:
            $ref: "#/components/schemas/ServedCopy"
    KeepIgnored:
      type: object
      required: [value, reason]
      properties:
        value:
          type: string
        reason:
          type: string
          enum: [pattern, empty, reserved]
          description: "pattern: the entry contains *. empty: nothing but spaces. reserved: auto, which clients send for the first available model and is never a name."
    OtherName:
      type: object
      required: [name, accounts]
      properties:
        name:
          type: string
          description: The model id as a client would send it, namespace and prefix included.
        accounts:
          type: array
          minItems: 1
          description: Highest priority first, then provider, kind, login label, auth_index.
          items:
            $ref: "#/components/schemas/NameAccount"
    NameAccount:
      type: object
      required: [auth_index, provider, kind, priority, host, login]
      description: |
        An account that offers the name, identified as a route of GET /provimux/model-routes is. A plugin
        executor's own models have no account: auth_index, kind and host are null, provider is the plugin's.
      properties:
        auth_index:
          type: [string, "null"]
        provider:
          type: string
        kind:
          type: [string, "null"]
          description: oauth for a subscription login, apikey for an API key.
        priority:
          type: integer
        host:
          type: [string, "null"]
          description: The host of an API key's base URL; null for a login.
        login:
          $ref: "#/components/schemas/Login"
    RefusedNames:
      type: object
      required: [since, names, truncated]
      properties:
        since:
          $ref: "#/components/schemas/Timestamp"
          description: When counting began (the switch went on, or the process started with it on).
        names:
          type: array
          description: |
            Requests refused because the rule in force does not serve the name, whether or not an account
            registers it (the check reads the rule and the name, nothing else). Most recent first. In memory only.
          items:
            type: object
            required: [name, requests, last_at]
            properties:
              name:
                type: string
                description: |
                  The name as the gateway resolved it, without a thinking suffix: what the client sent, except that
                  speech and video routes turn tts-1 into grok-tts and sora-2 into grok-imagine-video first; or
                  the model a plugin's router sent the request to, when that is the name refused.
              requests:
                type: integer
                minimum: 1
              last_at:
                $ref: "#/components/schemas/Timestamp"
        truncated:
          type: boolean
          description: More than 256 names were refused; the rest are not counted.
