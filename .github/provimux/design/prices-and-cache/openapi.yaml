openapi: 3.1.0
info:
  title: Provimux figures, contract 1
  version: "1"
  description: |
    What Provimux (github.com/ngvoicu/provimux) says about the accounts behind a model: which entry
    of providers.dev each answer is, what each account's answers have been, and each entry's price,
    cache lifetimes, input window and output limit, each with its date and source. Design:
    ../prices-and-cache.md, and for the statement on each answer ../answered-by.md.

    The entry of an answer is read from the request the gateway sent for it: the host it was sent
    to and the model id written into it. Nothing predicts it, so no row of the list promises one.

    Two paths carry the same records:
    - `GET /v1/models?include=figures`, for tools, with a client key. This is contract 1.
    - `GET /v8/management/provimux/figures`, for the console, with the management key.

    How a tool uses it. Read the model list once, and again when an answer names an account the
    list did not have or an entry `figures.entries` did not have. Each answer of the gateway to a
    model request says itself what it is, in six
    response headers (components/headers; on the Responses WebSocket the same values as fields of
    each turn's `response.created`, components/schemas/AnswerStatement):
    - `X-Provimux-Entry` is the entry of that answer: a key of `figures.entries`. Nothing is
      matched by kind, provider or host.
    - `X-Provimux-Account` is the marker of the account that answered: the `account` of its row
      in the list.
    - `X-Provimux-Model`, `X-Provimux-Model-Basis`, `X-Provimux-Model-Sent` and
      `X-Provimux-Effort` say which model answered and how firmly that is known.

    An answer has `X-Provimux-Account` or none of the six. Where it has none, nobody is named: the
    answer is an error, the gateway's own, a plugin's, or its headers left before it did. A tool
    then knows neither the account nor the model, and assumes neither.

    An answer without figures is one of three things, and a tool guesses in none of them:
    - `X-Provimux-Entry` is there and is no key of `figures.entries`: providers.dev has no such
      entry, or the gateway holds no figures (`figures.state`).
    - A statement without `X-Provimux-Entry`: the gateway has no entry for what it sent (the
      account, the host or the model has no row in its map), it could not read what it sent, or
      the gateway could not be certain what it sent (below).
    - No statement.

    Before an answer, a tool has what the account's earlier answers to its own key said:
    `answered` on its row (per client key; another key's answers are not on it). That is a record,
    not a promise. A tool may show it and price by it as an expectation, and takes what the answer
    itself says the moment there is one. It is a cache of what answers named, rebuilt by the next
    answer, and nothing a user owns: it can be empty where answers were given.

    What contract 1 promises:
    - Every property listed as required is always present. A value that is not known is null,
      never 0 and never left out.
    - No property is removed, and none changes its type, unit or meaning. Properties and enum
      values may be added: a client ignores properties it does not know and treats an enum value it
      does not know as unknown.
    - Prices are US dollars per million tokens. Lifetimes are seconds. Windows and limits are
      tokens. Dates are YYYY-MM-DD. Times are RFC 3339 in UTC.
    - `rely_on_s` is chosen by the rule written on the schema `Lifetime`.
    - An answer names its entry and its account itself. Once the answer is written (its headers;
      on the Responses WebSocket, its turn's response.created), the record keeps what it said: the
      entry, or null where the account was named and no entry. It is then the newest item of
      `answered` on that caller's row of that account under the model that was called, until a
      later answer of that account for that model to that caller says otherwise. The record
      promises nothing for an answer around a change of the auth folder, and loses what it held
      when its file cannot be read. No row says more than that: `answered` is what answers said,
      never what the next one will say.
    - A caller is a caller as the gateway authenticates it: with the client keys of its
      configuration, one key.
    - The entry and the record exist only in the gateway as shipped: a process Provimux's own
      program started, which the gateway checks. A program that embeds Provimux's code gets no
      `X-Provimux-Entry`, no `X-Provimux-Model-Sent`, `X-Provimux-Model` or
      `X-Provimux-Model-Basis`, and no `answered`; `X-Provimux-Account` and `account` are
      unchanged.
    - In the gateway as shipped, an answer names an entry, and the model it sent, only where: one
      of its built-in executors served it, for a provider for which no executor but the gateway's
      own (a plugin's, for one) was put in place since the gateway started; no plugin made or
      changed the credential; and exactly one request could have produced the answer, its model
      read from that request, sent to the host the entry is priced at, with no connection the
      gateway did not see. Otherwise it names neither; where all of this holds and providers.dev has no entry
      for what was sent, it names the model and no entry.
    - Once a plugin's executor (any executor that is not one of the gateway's own) was put in
      place for a provider, no answer of that provider names an entry or the model it sent until
      the gateway restarts; its answers carry `X-Provimux-Account` and are recorded as null
      (amended 2026-11-27 (2), part 5, decided by the lead with the owner's word).
    - A marker is the same on every answer of one account and in every list, for as long as the
      gateway keeps its key; another account never has it. It is compared, never parsed, except
      for its first character.
    - A change that breaks any of this is served as contract 2 under another `include` value, and
      contract 1 is still answered for at least two Provimux releases that say so in their notes.

    What it does not promise: the values. They are providers.dev's, dated, and change when its
    dataset does. An answer may have no entry, and an entry may have no figures: providers.dev has
    entries for the latest models only. The account listed first is the one tried first, not
    always the one that answers. That the next answer of an account carries the entry its row
    shows: the request decides, each time.

    Nothing here names an account: no key, token, auth ID, e-mail or file name, and of a base URL
    only its host. The marker is a keyed hash under a key only the gateway holds: it tells one
    account from another and nothing about either.

    The operator can turn the statement and the markers off (`models.answered-by: false`). Then no
    answer has any of the six headers, no row has `account` or `answered`, nothing the gateway
    sends is read for it, and `figures.entries` is empty: without an answer's entry nothing leads
    to a figure.
servers:
  - url: http://127.0.0.1:8317
paths:
  /v1/models:
    get:
      operationId: listModelsWithFigures
      summary: The model list, with the accounts behind each model and their figures when asked
      security:
        - clientKey: []
      parameters:
        - name: include
          in: query
          required: false
          description: |
            Comma-separated, in any order, case-insensitive; the parameter may be repeated.
            Absent: the list as stock CLIProxyAPI gives it, byte for byte.
            `accounts`: each model gains `accounts`, each with its marker and what its answers said.
            `figures`: each model gains `accounts`, and the answer gains `figures`.
            A value the server does not know is ignored.
            Only this list carries `figures`: `GET /v1/models/{id}` with `include=figures` answers the
            model with `accounts` and without `figures` (decided by the lead on 2026-11-27).
          schema:
            type: string
          examples:
            accounts:
              value: accounts
            figures:
              value: figures
      responses:
        "200":
          description: The models this client key can use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
              examples:
                figures:
                  externalValue: examples/models-figures.json
        "401":
          description: The client key is missing or wrong.
  /v8/management/provimux/figures:
    get:
      operationId: provimuxFigures
      summary: The figures Provimux holds, and how it got them
      description: |
        Read-only. Stock CLIProxyAPI, and a Provimux older than this path, answer 404; the console
        shows no figures then. It reports what is held and predicts nothing.
      security:
        - managementKey: []
        - managementKeyHeader: []
      parameters:
        - name: all
          in: query
          required: false
          description: |
            `true`: every held entry. Otherwise only the entries an `answered` item of a route of
            GET /v8/management/provimux/model-routes names.
          schema:
            type: boolean
      responses:
        "200":
          description: The held figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiguresStatus"
              examples:
                held:
                  externalValue: examples/figures.json
        "401":
          description: The management key is missing or wrong.
        "404":
          description: Not a Provimux with this path.
components:
  headers:
    X-Provimux-Account:
      description: The marker of the account that answered. Present on an answer that names anybody; without it none of the six is present.
      schema:
        $ref: "#/components/schemas/AccountMarker"
    X-Provimux-Model:
      description: "`provimux_model` of AnswerStatement."
      schema:
        type: string
    X-Provimux-Model-Basis:
      description: "`provimux_model_basis` of AnswerStatement: `vendor` or `not-confirmed`."
      schema:
        type: string
        enum: [vendor, not-confirmed]
    X-Provimux-Model-Sent:
      description: "`provimux_model_sent` of AnswerStatement."
      schema:
        type: string
    X-Provimux-Effort:
      description: "`provimux_effort` of AnswerStatement."
      schema:
        type: string
    X-Provimux-Entry:
      description: "`provimux_entry` of AnswerStatement: the key of `figures.entries` for this answer."
      schema:
        $ref: "#/components/schemas/EntryRef"
  securitySchemes:
    clientKey:
      type: http
      scheme: bearer
      description: A client API key of the gateway, as for every /v1 route.
    managementKey:
      type: http
      scheme: bearer
      description: The management key, as for every /v8/management route.
    managementKeyHeader:
      type: apiKey
      in: header
      name: X-Management-Key
  schemas:
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    Day:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      description: A calendar day, e.g. 2026-11-24.
    EntryRef:
      type: string
      pattern: "^[^/]+/.+$"
      description: |
        An entry of providers.dev as providers.dev writes a reference: `<provider>/<model>`. A
        provider id never contains a slash, so the first slash ends the provider; a model id may
        contain more.
    AccountMarker:
      type: string
      pattern: "^[as]\\.[a-z2-7]{20}$"
      description: |
        An opaque marker of one account: the same on every answer that account gives and on its
        rows in the lists, another for every other account, the same after a restart and after the
        configuration is reordered, another when another account's login takes its place. It is a
        keyed hash; nothing can be read from it but its first character:
        - `a`: the account as its vendor names it. Equal markers are one account at the vendor,
          unequal ones are two.
        - `s`: this gateway's credential, where the gateway does not hold the vendor's own name for
          the account. Equal markers are one credential; unequal ones may still be one account,
          and for some kinds a login replaced in its file keeps the marker. A tool that must prove
          "the same account" does not accept `s`.
        One account held twice (one login in two files, one key in two rows) has one marker on two
        rows.
    Price:
      type: number
      minimum: 0
      description: US dollars per million tokens. Zero is a listed zero price.
    ModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
        figures:
          $ref: "#/components/schemas/Figures"
          description: Present only when the request asked for `figures`.
    Model:
      type: object
      required: [id, object]
      properties:
        id:
          type: string
          description: The name a request uses.
        object:
          type: string
        created:
          type: integer
        owned_by:
          type: string
        accounts:
          type: array
          description: |
            Present only when the request asked for `accounts` or `figures`. The enabled accounts
            that serve the model, in the order they are tried: highest priority first. Empty when
            none does.
          items:
            $ref: "#/components/schemas/Account"
    Account:
      type: object
      required: [provider, kind, priority]
      properties:
        provider:
          type: string
          description: The gateway's own name of the account's kind of login or key, e.g. claude, codex, devin.
        kind:
          type: string
          description: "`oauth` for a subscription login, `apikey` for an API key."
        priority:
          type: integer
        host:
          type: string
          description: The host of an API key's base URL, lower case. Left out when the key has none.
        account:
          $ref: "#/components/schemas/AccountMarker"
          description: |
            The account's marker: the value of `X-Provimux-Account` on every answer this account
            gives. Left out only when the operator turned the statement off.
        answered:
          type: array
          maxItems: 4
          description: |
            What this account's answers for this model to the caller said of themselves, as the
            gateway wrote them (per client key; callers without a key share one record; only in
            the gateway as shipped, a process Provimux's own program started; elsewhere the row has
            no `answered`): the distinct values of `X-Provimux-Entry` on the answers written
            to this key for this exact model name, newest first, each with the day of the last
            answer that carried it. An answer that named the account and no entry is an item whose
            `entry` is null. At most four: an older one gives way to a newer.

            It is a record of answers, not a statement about the next one. The entry of an answer
            is read from the request the gateway sent for it, so the next answer can differ from
            every item here: the configuration changed, the name is set on several models, the
            caller's effort chose another variant, a rule of the operator rewrote the request.
            One item is what a tool may expect and must not rely on. Several say that this
            account's answers for this model differ. None says that no answer of this account for
            this model to this key is recorded. It is a cache, rebuilt by the next answer and owned
            by nobody: an answer around a change of the auth folder may be missing from it, and a
            record file that cannot be read is replaced at the next write. An item is not shown
            after 90 days and is removed from the gateway's record at its next write; the record
            outlives a restart where the gateway keeps its marker key.

            Present wherever `account` is; empty when nothing is recorded. There is no `entry` on a
            row: the gateway predicts none.
          items:
            $ref: "#/components/schemas/Answered"
    Answered:
      type: object
      required: [entry, "on"]
      properties:
        entry:
          oneOf:
            - $ref: "#/components/schemas/EntryRef"
            - type: "null"
          description: |
            The `X-Provimux-Entry` of those answers. Null: they named no entry. It says where the
            model would be at providers.dev, not that providers.dev has such an entry.
        "on":
          $ref: "#/components/schemas/Day"
          description: The day, in UTC, of the last answer of this account for this model that said so.
    AnswerStatement:
      type: object
      description: |
        What an answer says of itself. On the Responses WebSocket these are fields at the top of
        each turn's `response.created` event, beside `cpa_auth_kind`, `cpa_auth_provider` and
        `cpa_auth_host`; over HTTP and SSE the same values are the six response headers of
        components/headers, in the same order. An event has `provimux_account` or none of the six.
        A value outside printable ASCII, a space or `%` is written as `%` and two hex digits, in a
        header and in a field alike.

        The statement is of the answer's first byte: what the gateway asked for, and what the
        vendor's answer had named by then. It is written only where the answer is written, never
        on an error, a keep-alive or an answer a plugin made.

        Examples, for the model list of examples/models-figures.json: examples/answers.json.
      required: [provimux_account]
      dependentRequired:
        provimux_model: [provimux_model_basis, provimux_model_sent]
        provimux_model_basis: [provimux_model, provimux_model_sent]
        provimux_model_sent: [provimux_model, provimux_model_basis]
        provimux_effort: [provimux_model]
        provimux_entry: [provimux_model]
      properties:
        provimux_account:
          $ref: "#/components/schemas/AccountMarker"
        provimux_model:
          type: string
          description: |
            The model that answered, as far as it is known: the id the vendor's answer named where
            it named one, else the id the gateway asked the vendor for. Left out, with the four
            below, on the few routes that relay a vendor's answer without an executor (a realtime
            call, a search).
        provimux_model_basis:
          type: string
          description: |
            `vendor`: the vendor's answer named `provimux_model`. `not-confirmed`: the vendor's
            answer named no model before the answer's first byte left; `provimux_model` is the id
            the gateway asked for, and whether that model answered is not confirmed. Always
            `not-confirmed` for a token count, and today for a stream from an OpenAI-compatible
            key, OpenRouter, Copilot or Devin.
          enum: [vendor, not-confirmed]
        provimux_model_sent:
          type: string
          description: |
            The model id in the request the gateway sent to the vendor, read from that request as
            it left: after the name's alias, a pool's turn, the executor's own mapping and any rule
            of the operator that rewrites a request. Where the gateway could not read the request
            it sent, it is the id its executor was given to send, and the answer has no
            `provimux_entry`. For Devin it is Devin's request id, which carries the effort. It can
            differ from `provimux_model` where the vendor names a dated id for an alias, or where
            another model answered: the gateway judges neither.
        provimux_effort:
          type: string
          description: |
            The reasoning effort in the outgoing request, as the gateway read it from the request's
            final body. Left out where it read none.
        provimux_entry:
          $ref: "#/components/schemas/EntryRef"
          description: |
            The entry of providers.dev this answer is, by the gateway's map from what it sent: the
            host the request went to, the model id in it, and the kind of credential that signed
            it. A key of `figures.entries` where the gateway holds figures for it. Left out where
            the map has no row for what was sent, and where the gateway could not read what it
            sent. Never worked out from the configuration.
    Figures:
      type: object
      required: [contract, source, state, dataset_version, generated_at, fetched_at, entries]
      properties:
        contract:
          type: integer
          const: 1
        source:
          type: string
          description: Where the figures come from. Today always https://providers.dev.
        state:
          type: string
          description: |
            `held`: figures are held, from a fetch or from the disk copy. `none`: nothing was ever
            fetched and nothing is on disk. `off`: the operator turned providers.dev off
            (`models.published-lists: false`). With `none` and `off`, `entries` is empty.
          enum: [held, none, "off"]
        dataset_version:
          type: [string, "null"]
          description: providers.dev's version of the dataset the figures are from.
        generated_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: |
            When providers.dev built that dataset. A dataset generated more than 24 hours ahead of the
            gateway's clock is never held, fetched or from the disk copy (decided by the lead on
            2026-11-27).
        fetched_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: When this gateway last got an answer from providers.dev, changed or not.
        entries:
          type: object
          description: |
            Keyed by entry reference. On /v1/models: every entry an `answered` item of an account
            in `data` names and the gateway holds figures for. An entry that is no key here has no
            figures. An answer can name an entry this copy lacks (its account had not answered for
            that model when the list was read): the list read again has it.
          additionalProperties:
            $ref: "#/components/schemas/Entry"
    Entry:
      type: object
      required: [provider, model, url, access, price, cache, input_window, max_output]
      properties:
        provider:
          type: string
          description: providers.dev's provider id.
        model:
          type: string
          description: The model's id at that provider.
        url:
          type: string
          description: The entry's page on providers.dev.
        access:
          type: string
          description: How the provider is reached.
          enum: [api, subscription, unknown]
        price:
          $ref: "#/components/schemas/EntryPrice"
        cache:
          $ref: "#/components/schemas/EntryCache"
        input_window:
          $ref: "#/components/schemas/Limit"
          description: The most input one request can carry on this entry, as providers.dev's safe value states it.
        max_output:
          $ref: "#/components/schemas/Limit"
          description: The most tokens one response can hold. A maximum, not a default.
    EntryPrice:
      type: object
      required: [billing, reference, input, output, cache_read, cache_write, tiers, other_rates, source, date, sources_differ]
      properties:
        billing:
          type: string
          description: |
            `per_use`: the account is charged these prices per token. `reference`: the account is
            not billed per token (a subscription); the prices are the API list prices of the entry
            in `reference`, for comparison. `unknown`: no price applies or none is known; every
            price is null. Also `unknown` where providers.dev names the API entry of a `reference`
            in a form that is not an EntryRef: the entry's price is left out (decided by the lead on
            2026-11-27).
          enum: [per_use, reference, unknown]
        reference:
          oneOf:
            - $ref: "#/components/schemas/EntryRef"
            - type: "null"
          description: With `reference`, the API entry the prices are taken from.
        input:
          oneOf:
            - $ref: "#/components/schemas/Price"
            - type: "null"
          description: The base price of text input, before any conditional rate.
        output:
          oneOf:
            - $ref: "#/components/schemas/Price"
            - type: "null"
        cache_read:
          oneOf:
            - $ref: "#/components/schemas/Price"
            - type: "null"
          description: Null where the source states none; then nothing may be assumed.
        cache_write:
          type: array
          description: |
            The prices of writing to the cache, shortest lifetime first; an item whose lifetime is
            not stated comes first. Empty where the source states none. A negative price the source
            states is left out (decided by the lead on 2026-11-27).
          items:
            $ref: "#/components/schemas/CacheWritePrice"
        tiers:
          type: array
          description: Prices above a prompt size, ascending. Empty where the source states none.
          items:
            $ref: "#/components/schemas/PriceTier"
        other_rates:
          type: boolean
          description: |
            True where the entry has rates this record does not carry (fast mode, a region, a time
            of day). The entry's page has them.
        source:
          type: [string, "null"]
          description: "Whose price this is: providers.dev, models.dev or pi.dev."
        date:
          oneOf:
            - $ref: "#/components/schemas/Day"
            - type: "null"
          description: The date of that source's statement.
        sources_differ:
          type: boolean
          description: True where providers.dev's sources contradict each other on this price.
    CacheWritePrice:
      type: object
      required: [lifetime_s, price]
      properties:
        lifetime_s:
          type: [integer, "null"]
          description: The cache lifetime this price buys, in seconds. Null where the source does not key the price by lifetime.
        price:
          $ref: "#/components/schemas/Price"
    PriceTier:
      type: object
      required: [input_tokens_above, input, output, cache_read, cache_write]
      properties:
        input_tokens_above:
          type: integer
          description: |
            The tier holds for a request whose input is above this many tokens. A tier whose size is
            above 2^53 - 1 is left out (decided by the lead on 2026-11-27).
        input:
          oneOf:
            - $ref: "#/components/schemas/Price"
            - type: "null"
        output:
          oneOf:
            - $ref: "#/components/schemas/Price"
            - type: "null"
        cache_read:
          oneOf:
            - $ref: "#/components/schemas/Price"
            - type: "null"
        cache_write:
          oneOf:
            - $ref: "#/components/schemas/Price"
            - type: "null"
    EntryCache:
      type: object
      required: [documented, retention, short, long]
      properties:
        documented:
          type: string
          description: Prompt caching as documented. `unknown` means the source says nothing, which is not `no`.
          enum: ["yes", "no", unknown]
        retention:
          type: string
          description: Whether a request can ask for a cache lifetime.
          enum: [supported, unsupported, unknown]
        short:
          $ref: "#/components/schemas/Lifetime"
          description: What a request gets without asking for a lifetime.
        long:
          $ref: "#/components/schemas/Lifetime"
          description: What a request gets when it asks for the longer cache.
    Lifetime:
      type: object
      description: |
        The cache lifetime of one profile of an entry.

        The rule of `rely_on_s`, in this order:
        1. providers.dev has measurements of the entry made by a real client through Provimux
           (an item of `through_provimux` with `counts` true): the lowest of their `lifetime_s`;
           `basis` is `measured_through_provimux`.
        2. else providers.dev's safe value is measured: that value; `basis` is `measured`.
        3. else providers.dev's safe value is documented: that value; `basis` is `documented`.
        4. else null; `basis` is `none`.

        A real client is a program that holds a conversation through the gateway: a coding agent
        such as Pi. Plain test requests sent through Provimux are not a client: they are listed in
        `through_provimux` with `counts` false, as evidence, and never give `rely_on_s` by row 1.
        They can still stand behind row 2, where they are the only measurement providers.dev has
        of a login; `safe.measured_with` then names them.

        0 is a value: it was measured, and no age held on every check. It does not say the
        provider never caches.
      required: [rely_on_s, basis, date, safe, documented_s, documented_status, through_provimux]
      properties:
        rely_on_s:
          type: [integer, "null"]
          minimum: 0
          description: Seconds a cached prompt can be relied on through this gateway, by the rule above.
        basis:
          type: string
          enum: [measured_through_provimux, measured, documented, none]
        date:
          oneOf:
            - $ref: "#/components/schemas/Day"
            - type: "null"
          description: The date of the statement `rely_on_s` is taken from; with row 1, of the measurement that gave the lowest value (of equal ones, the newest).
        safe:
          $ref: "#/components/schemas/SafeLifetime"
        documented_s:
          type: [integer, "null"]
          description: The documented lifetime. 0 = the provider documents that it does not cache.
        documented_status:
          type: [string, "null"]
          description: providers.dev's word on whether a measurement contradicts the documented lifetime, e.g. `not_contradicted`, `contradicted`.
        through_provimux:
          type: array
          description: |
            providers.dev's measurements of this profile made through Provimux, newest first: a
            real client's (`counts` true) and plain test requests' (`counts` false). Empty where
            there is none.
          items:
            $ref: "#/components/schemas/Measurement"
    SafeLifetime:
      type: object
      description: providers.dev's own safe value of the profile, whatever `rely_on_s` is taken from.
      required: [seconds, basis, source, date, measured_with]
      properties:
        seconds:
          type: [integer, "null"]
        basis:
          type: string
          enum: [measured, documented, none]
        source:
          type: [string, "null"]
          description: "Who the value is from: providers.dev, models.dev or pi.dev."
        date:
          oneOf:
            - $ref: "#/components/schemas/Day"
            - type: "null"
        measured_with:
          type: array
          description: The clients whose measurements give a measured safe value. Empty otherwise.
          items:
            $ref: "#/components/schemas/Client"
    Client:
      type: object
      required: [client, label, kind]
      properties:
        client:
          type: string
          description: providers.dev's public id of the client the requests went through.
        label:
          type: [string, "null"]
        kind:
          type: [string, "null"]
          description: "`direct`, `own_client` (the vendor's own client) or `proxy`."
    Measurement:
      type: object
      required: [client, label, counts, lifetime_s, date, checks, hits, first_miss_s, asked]
      properties:
        client:
          type: string
          description: providers.dev's public id of what sent the requests.
        label:
          type: [string, "null"]
        counts:
          type: boolean
          description: |
            True where the requests were made by a real client holding a conversation (a coding
            agent), so the measurement can give `rely_on_s` by row 1 of the rule. False for plain
            test requests: evidence only.
        lifetime_s:
          type: integer
          minimum: 0
          description: |
            The oldest tested age through which every check hit; 0 = no such age. A measurement
            providers.dev lists without a lifetime is no measurement and is not listed (decided by
            the lead on 2026-11-27).
        date:
          oneOf:
            - $ref: "#/components/schemas/Day"
            - type: "null"
        checks:
          type: integer
          description: Re-sends made, the control included.
        hits:
          type: integer
          description: How many of those were served from the cache.
        first_miss_s:
          type: [integer, "null"]
          description: The youngest age at which a check missed. Null = no miss.
        asked:
          oneOf:
            - $ref: "#/components/schemas/Asked"
            - type: "null"
          description: The request field that asked for the lifetime. Null = none was asked for.
    Asked:
      type: object
      required: [parameter, value]
      properties:
        parameter:
          type: string
        value:
          type: string
    Limit:
      type: object
      required: [tokens, at_least, source, date]
      properties:
        tokens:
          type: [integer, "null"]
          minimum: 0
          maximum: 9007199254740991
          description: |
            Null where unknown, and where providers.dev states a count above 2^53 - 1: left out,
            never clamped (decided by the lead on 2026-11-27).
        at_least:
          type: boolean
          description: True where the value is only the largest an evaluation saw accepted; the real limit may be higher.
        source:
          type: [string, "null"]
          description: "Who the value is from: measured, providers.dev, models.dev or pi.dev."
        date:
          oneOf:
            - $ref: "#/components/schemas/Day"
            - type: "null"
    FiguresStatus:
      type: object
      required: [observed_at, options, figures, held_entries, from_cache, last_failure]
      properties:
        observed_at:
          $ref: "#/components/schemas/Timestamp"
        options:
          type: object
          required: [published_lists]
          properties:
            published_lists:
              type: boolean
              description: The loaded config's `models.published-lists`; false turns every request to providers.dev off.
        figures:
          $ref: "#/components/schemas/Figures"
        held_entries:
          type: integer
          description: How many entries the gateway holds, whatever `figures.entries` lists.
        from_cache:
          type: boolean
          description: True while the held figures are the disk copy and no fetch has answered in this run.
        last_failure:
          oneOf:
            - $ref: "#/components/schemas/Failure"
            - type: "null"
          description: The last fetch that failed since the last one that answered. Null = none.
    Failure:
      type: object
      required: [at, category, http_status]
      properties:
        at:
          $ref: "#/components/schemas/Timestamp"
        category:
          type: string
          description: A code, never an error text. Clients treat an unknown one as a failure.
          enum: [http_status, invalid_response, network]
        http_status:
          type: [integer, "null"]
